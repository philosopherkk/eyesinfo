<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12151a" />
  <meta name="robots" content="noindex" />
  <title>淚膜 · 破裂與眨眼示意 — 護眼學堂</title>
  <style>
html, body { margin: 0; padding: 0; background: #0f1217; color: #e4e4e4; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 10px 8px 16px; }
.cap { font: 13px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #9aa3b2; margin: 0 4px 10px; }
.teach { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #12151a; color: #e4e4e4; padding: 12px; border-radius: 14px; max-width: 980px; margin: auto; user-select: none; }
.teach canvas { width: 100%; display: block; border-radius: 10px; background: #000; touch-action: none; }
.teach .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 4px 2px 10px; }
.teach .seg { display: flex; border-radius: 9px; overflow: hidden; border: 1px solid #444; }
.teach .seg button, .teach .btn { background: #23272f; color: #ddd; border: 0; padding: 8px 12px; font-size: 14px; cursor: pointer; min-height: 40px; }
.teach .seg button.on { background: #f0a030; color: #111; font-weight: 700; }
.teach .btn { border: 1px solid #444; border-radius: 9px; }
.teach label { font-size: 13px; display: flex; align-items: center; gap: 6px; color: #bbb; }
.teach input[type=range] { width: 110px; accent-color: #f0a030; }
.teach .v { min-width: 42px; font-variant-numeric: tabular-nums; color: #f3c06a; }
.teach .hint { margin: 8px 2px 0; font-size: 12.5px; line-height: 1.45; color: #8b93a3; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="cap" id="page-cap"></p>
<div class="teach" id="sim">
  <div class="bar">
    <label><span id="lab-tbut"></span> <input id="tbut" type="range" min="2" max="15" step="0.5" value="8"><span class="v" id="tbutv"></span></label>
    <button class="btn" type="button" id="blink"></button>
    <label><input type="checkbox" id="auto" checked> <span id="lab-auto"></span></label>
  </div>
  <canvas id="cv" width="960" height="520"></canvas>
  <p class="hint" id="hint"></p>
</div>
  </div>
<script>
(()=>{

const I18N = {
  "zh-Hant": {
    pageCap: "教育示意 · 睜眼後淚膜逐漸變薄並出現破裂；眨眼可重新鋪展。不是乾眼檢查。",
    tbut: "破裂時間示意", blink: "眨眼", auto: "自動循環",
    hint: "調短破裂時間會更快出現黑斑狀破裂區；眨眼後淚膜重新鋪平——教學示意，不是檢查分數。",
    htmlLang: "zh-Hant",
  },
  "zh-Hans": {
    pageCap: "教育示意 · 睁眼后泪膜逐渐变薄并出现破裂；眨眼可重新铺展。不是干眼检查。",
    tbut: "破裂时间示意", blink: "眨眼", auto: "自动循环",
    hint: "调短破裂时间会更快出现黑斑状破裂区；眨眼后泪膜重新铺平——教学示意，不是检查分数。",
    htmlLang: "zh-CN",
  },
  en: {
    pageCap: "Education illustration · after a blink the tear film thins and can break up; a blink resurfaces it. Not a dry-eye test.",
    tbut: "Break-up time (illus.)", blink: "Blink", auto: "Auto loop",
    hint: "Shorter break-up time shows dark patches sooner; a blink resets the film — teaching only, not a score.",
    htmlLang: "en",
  },
  ja: {
    pageCap: "教育用図示 · 開瞼後に涙液層が薄くなり破綻し、まばたきで再び広がります。ドライアイ検査ではありません。",
    tbut: "破綻時間（示意）", blink: "まばたき", auto: "自動ループ",
    hint: "破綻時間を短くすると黒い破綻部が早く出ます。まばたきで涙液層が戻る——教育用であり点数ではありません。",
    htmlLang: "ja",
  },
};

const normalizeLang = (raw) => {
  const v = (raw || "").trim();
  if (v === "zh" || v === "zh-Hant" || v === "zh-hant") return "zh-Hant";
  if (v === "zh-Hans" || v === "zh-hans" || v === "zh-CN" || v === "zh-cn") return "zh-Hans";
  if (v === "ja" || v === "jp") return "ja";
  if (v === "en") return "en";
  return "zh-Hant";
};
let uiLang = normalizeLang(new URLSearchParams(location.search).get("lang"));
let T = I18N[uiLang];
const $ = (id) => document.getElementById(id);
function applyLang(lang) {
  uiLang = normalizeLang(lang);
  T = I18N[uiLang];
  document.documentElement.lang = T.htmlLang;
  const cap = $("page-cap");
  if (cap) cap.textContent = T.pageCap;
  if (typeof onLang === "function") onLang();
}

const S = { tbut: 8, auto: true, age: 0, blinking: 0 };
const cv = $("cv"), ctx = cv.getContext("2d");
const W = 960, H = 520;
const spots = Array.from({length: 7}, (_,i) => ({
  x: 0.35 + (i%3)*0.12 + Math.random()*0.05,
  y: 0.38 + Math.floor(i/3)*0.12 + Math.random()*0.04,
  r: 0.03 + Math.random()*0.025,
  delay: 0.35 + Math.random()*0.45,
}));
function onLang(){
  $("lab-tbut").textContent = T.tbut;
  $("blink").textContent = T.blink;
  $("lab-auto").textContent = T.auto;
  $("hint").textContent = T.hint;
  sync();
}
function sync(){ $("tbutv").textContent = S.tbut.toFixed(1) + " s"; }
$("tbut").addEventListener("input", e => { S.tbut = +e.target.value; sync(); });
$("blink").addEventListener("click", () => { S.age = 0; S.blinking = 1; });
$("auto").addEventListener("change", e => { S.auto = e.target.checked; });
let last = performance.now();
function draw(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.blinking > 0) {
    S.blinking -= dt * 3.2;
    if (S.blinking <= 0) { S.blinking = 0; S.age = 0; }
  } else {
    S.age += dt;
    if (S.auto && S.age > S.tbut + 1.8) { S.blinking = 1; }
  }
  const u = Math.min(1, S.age / Math.max(0.5, S.tbut));
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#0b0d11"; ctx.fillRect(0,0,W,H);
  // eye outline
  const cx = 480, cy = 250;
  ctx.fillStyle = "#1c2430";
  ctx.beginPath(); ctx.ellipse(cx, cy, 280, 160, 0, 0, Math.PI*2); ctx.fill();
  // iris
  const ig = ctx.createRadialGradient(cx-20, cy-10, 20, cx, cy, 110);
  ig.addColorStop(0, "#6a8fb5"); ig.addColorStop(1, "#243246");
  ctx.fillStyle = ig;
  ctx.beginPath(); ctx.arc(cx, cy, 105, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#0a0c10";
  ctx.beginPath(); ctx.arc(cx, cy, 42, 0, Math.PI*2); ctx.fill();
  // tear film sheen → breakup
  ctx.save();
  const lid = S.blinking > 0 ? Math.sin((1 - S.blinking) * Math.PI) : 0;
  if (lid > 0.02) {
    ctx.fillStyle = "#12151a";
    ctx.fillRect(cx - 300, cy - 180, 600, 160 * lid);
    ctx.fillRect(cx - 300, cy + 180 - 160 * lid, 600, 160 * lid);
  }
  ctx.globalAlpha = 0.35 + 0.25 * (1 - u);
  const sheen = ctx.createLinearGradient(cx-200, cy-80, cx+200, cy+80);
  sheen.addColorStop(0, "rgba(180,220,255,0.15)");
  sheen.addColorStop(0.5, "rgba(255,255,255,0.35)");
  sheen.addColorStop(1, "rgba(180,220,255,0.1)");
  ctx.fillStyle = sheen;
  ctx.beginPath(); ctx.ellipse(cx, cy, 250, 140, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  spots.forEach((s) => {
    const local = Math.max(0, (u - s.delay) / (1 - s.delay));
    if (local <= 0 || S.blinking > 0.4) return;
    ctx.fillStyle = `rgba(8,10,14,${0.15 + local * 0.75})`;
    ctx.beginPath();
    ctx.ellipse(cx - 250 + s.x * 500, cy - 140 + s.y * 280, s.r * 500 * (0.6 + local), s.r * 320 * (0.6 + local), 0, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
  // timer bar
  ctx.fillStyle = "#1a1f28";
  ctx.fillRect(80, 460, 800, 14);
  ctx.fillStyle = u > 0.85 ? "#e07070" : "#7eb6ff";
  ctx.fillRect(80, 460, 800 * u, 14);
  requestAnimationFrame(draw);
}
applyLang(uiLang);
requestAnimationFrame(draw);

})();
</script>
</body>
</html>
