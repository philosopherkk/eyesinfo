<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12151a" />
  <meta name="robots" content="noindex" />
  <title>老花 · 調節與加入度示意 — 護眼學堂</title>
  <style>
html, body { margin: 0; padding: 0; background: #0f1217; color: #e4e4e4; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 10px 8px 16px; }
.cap { font: 13px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #9aa3b2; margin: 0 4px 10px; }
.teach { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #12151a; color: #e4e4e4; padding: 12px; border-radius: 14px; max-width: 980px; margin: auto; user-select: none; }
.teach canvas { width: 100%; display: block; border-radius: 10px; background: #000; touch-action: none; }
.teach .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 4px 2px 10px; }
.teach .seg { display: flex; border-radius: 9px; overflow: hidden; border: 1px solid #444; }
.teach .seg button, .teach .btn { background: #23272f; color: #ddd; border: 0; padding: 8px 12px; font-size: 14px; cursor: pointer; min-height: 40px; }
.teach .seg button.on { background: #f0a030; color: #111; font-weight: 700; }
.teach .btn { border: 1px solid #444; border-radius: 9px; }
.teach label { font-size: 13px; display: flex; align-items: center; gap: 6px; color: #bbb; }
.teach input[type=range] { width: 110px; accent-color: #f0a030; }
.teach .v { min-width: 42px; font-variant-numeric: tabular-nums; color: #f3c06a; }
.teach .hint { margin: 8px 2px 0; font-size: 12.5px; line-height: 1.45; color: #8b93a3; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="cap" id="page-cap"></p>
<div class="teach" id="sim">
  <div class="bar">
    <label><span id="lab-age"></span> <input id="age" type="range" min="20" max="70" step="1" value="45"><span class="v" id="agev"></span></label>
    <label><span id="lab-dist"></span> <input id="dist" type="range" min="0.25" max="6" step="0.05" value="0.4"><span class="v" id="distv"></span></label>
    <label><span id="lab-add"></span> <input id="add" type="range" min="0" max="3" step="0.25" value="0"><span class="v" id="addv"></span></label>
    <button class="btn" type="button" id="play" aria-label="pause">❚❚</button>
  </div>
  <canvas id="cv" width="960" height="520"></canvas>
  <p class="hint" id="hint"></p>
</div>
  </div>
<script>
(()=>{

const I18N = {
  "zh-Hant": {
    pageCap: "教育示意 · 調節幅度隨年齡下降，近距需要加入度（ADD）。不是驗光或處方。",
    age: "年齡示意", dist: "目標距離", add: "加入度", play: "❚❚", pauseAria: "暫停", playAria: "播放",
    amp: "調節幅度（示意）", need: "近距需求", withAdd: "戴加入度後殘餘離焦",
    hint: "拖動年齡與距離：年輕時晶狀體仍可調節；約四十歲後近距離焦上升，加入度可補償——只供教學。",
    htmlLang: "zh-Hant",
  },
  "zh-Hans": {
    pageCap: "教育示意 · 调节幅度随年龄下降，近距需要加入度（ADD）。不是验光或处方。",
    age: "年龄示意", dist: "目标距离", add: "加入度", play: "❚❚", pauseAria: "暂停", playAria: "播放",
    amp: "调节幅度（示意）", need: "近距需求", withAdd: "戴加入度后残余离焦",
    hint: "拖动年龄与距离：年轻时晶状体仍可调节；约四十岁后近距离焦上升，加入度可补偿——只供教学。",
    htmlLang: "zh-CN",
  },
  en: {
    pageCap: "Education illustration · amplitude of accommodation falls with age; near work may need an Add. Not a refraction or prescription.",
    age: "Age (illus.)", dist: "Target distance", add: "Add", play: "❚❚", pauseAria: "Pause", playAria: "Play",
    amp: "Accommodation amplitude (illus.)", need: "Near demand", withAdd: "Residual defocus with Add",
    hint: "Move age and distance: younger lenses can accommodate; after about forty, near defocus rises and an Add can compensate — teaching only.",
    htmlLang: "en",
  },
  ja: {
    pageCap: "教育用図示 · 調節力は加齢で低下し、近方には加入（ADD）が必要になることがあります。検眼や処方ではありません。",
    age: "年齢（示意）", dist: "視標距離", add: "加入", play: "❚❚", pauseAria: "一時停止", playAria: "再生",
    amp: "調節力（示意）", need: "近方の需要", withAdd: "加入後の残存ボケ",
    hint: "年齢と距離を動かす：若いほど調節できる。四十歳前後から近方ボケが増え、加入で補える——教育用のみ。",
    htmlLang: "ja",
  },
};

const normalizeLang = (raw) => {
  const v = (raw || "").trim();
  if (v === "zh" || v === "zh-Hant" || v === "zh-hant") return "zh-Hant";
  if (v === "zh-Hans" || v === "zh-hans" || v === "zh-CN" || v === "zh-cn") return "zh-Hans";
  if (v === "ja" || v === "jp") return "ja";
  if (v === "en") return "en";
  return "zh-Hant";
};
let uiLang = normalizeLang(new URLSearchParams(location.search).get("lang"));
let T = I18N[uiLang];
const $ = (id) => document.getElementById(id);
function applyLang(lang) {
  uiLang = normalizeLang(lang);
  T = I18N[uiLang];
  document.documentElement.lang = T.htmlLang;
  const cap = $("page-cap");
  if (cap) cap.textContent = T.pageCap;
  if (typeof onLang === "function") onLang();
}

const S = { age: 45, dist: 0.4, add: 0, play: true };
const cv = $("cv"), ctx = cv.getContext("2d");
const W = 960, H = 520;
function ampD(age){ return Math.max(0, 15 - 0.25 * (age - 10)); }
function demandD(dist){ return 1 / Math.max(dist, 0.2); }
function residualOk(){ return Math.max(0, demandD(S.dist) - ampD(S.age) - S.add); }
function onLang(){
  $("lab-age").textContent = T.age;
  $("lab-dist").textContent = T.dist;
  $("lab-add").textContent = T.add;
  $("hint").textContent = T.hint;
  $("play").setAttribute("aria-label", S.play ? T.pauseAria : T.playAria);
  $("play").textContent = S.play ? "❚❚" : "▶";
  syncLabels();
}
function syncLabels(){
  if (uiLang === "en") $("agev").textContent = S.age + " y";
  else if (uiLang === "ja") $("agev").textContent = S.age + " 歳";
  else if (uiLang === "zh-Hans") $("agev").textContent = S.age + " 岁";
  else $("agev").textContent = S.age + " 歲";
  $("distv").textContent = S.dist.toFixed(2) + " m";
  $("addv").textContent = (S.add >= 0 ? "+" : "") + S.add.toFixed(2) + " D";
}
[["age","age",1],["dist","dist",0.01],["add","add",0.01]].forEach(([id,key])=>{
  $(id).addEventListener("input", e => { S[key] = +e.target.value; syncLabels(); });
});
$("play").addEventListener("click", () => {
  S.play = !S.play; onLang();
});
let t0 = 0;
function draw(now){
  const dt = Math.min(0.05, ((now - t0) || 16) / 1000); t0 = now;
  if (S.play) S.dist = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(now / 1800));
  $("dist").value = String(S.dist);
  syncLabels();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#0b0d11"; ctx.fillRect(0,0,W,H);
  // scene: letter chart at variable distance
  const blur = residualOk() * 2.2;
  const chartX = 120 + (1 - Math.min(S.dist, 3) / 3) * 420;
  ctx.save();
  ctx.filter = blur > 0.05 ? `blur(${Math.min(14, blur)}px)` : "none";
  ctx.fillStyle = "#f4f0e6";
  roundRect(ctx, chartX, 70, 220, 280, 12); ctx.fill();
  ctx.fillStyle = "#222";
  ctx.font = "bold 54px system-ui"; ctx.textAlign = "center";
  ctx.fillText("E", chartX + 110, 160);
  ctx.font = "bold 34px system-ui"; ctx.fillText("F P", chartX + 110, 220);
  ctx.font = "bold 22px system-ui"; ctx.fillText("T O Z", chartX + 110, 270);
  ctx.restore();
  // eye schematic
  const ex = 780, ey = 220;
  ctx.strokeStyle = "#7ec8e3"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(ex, ey, 70, 48, 0, 0, Math.PI*2); ctx.stroke();
  // crystalline lens thickness by amp use
  const used = Math.min(ampD(S.age), demandD(S.dist));
  const thick = 10 + used * 1.4;
  ctx.fillStyle = "rgba(240,200,120,0.55)";
  ctx.beginPath(); ctx.ellipse(ex - 8, ey, thick, 28, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "#f0a030"; ctx.stroke();
  // retina
  ctx.strokeStyle = "#e07070"; ctx.beginPath();
  ctx.arc(ex + 48, ey, 22, -1.2, 1.2); ctx.stroke();
  // rays
  ctx.strokeStyle = "rgba(255,220,120,0.7)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(chartX + 220, 200); ctx.lineTo(ex - 70, ey - 18); ctx.lineTo(ex + 48, ey); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(chartX + 220, 200); ctx.lineTo(ex - 70, ey + 18); ctx.lineTo(ex + 48, ey); ctx.stroke();
  // meters
  const amp = ampD(S.age), need = demandD(S.dist), res = residualOk();
  drawMeter(40, 400, 280, amp / 15, T.amp, "#6ecf8e");
  drawMeter(340, 400, 280, Math.min(1, need / 8), T.need, "#7eb6ff");
  drawMeter(640, 400, 280, Math.min(1, res / 4), T.withAdd, "#f0a030");
  requestAnimationFrame(draw);
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawMeter(x,y,w,frac,label,col){
  ctx.fillStyle = "#1a1f28"; roundRect(ctx,x,y,w,48,8); ctx.fill();
  ctx.fillStyle = col; roundRect(ctx,x+4,y+22, Math.max(4,(w-8)*Math.min(1,Math.max(0,frac))), 18, 5); ctx.fill();
  ctx.fillStyle = "#c8cdd6"; ctx.font = "12px system-ui"; ctx.textAlign = "left";
  ctx.fillText(label, x+8, y+16);
}
applyLang(uiLang);
requestAnimationFrame(draw);

})();
</script>
</body>
</html>
