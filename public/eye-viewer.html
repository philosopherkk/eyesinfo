<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EyesInfo — Interactive Eye Anatomy</title>

<style>
  :root {
    color-scheme: dark;
    --bg: #081321;
    --panel: #111f31;
    --text: #edf5ff;
    --muted: #a9bbd0;
    --border: #30445e;
    --accent: #63d5ea;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
  }

  button, select, input { font: inherit; }

  button, select {
    color: var(--text);
    background: #1b3048;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7px 11px;
  }

  button { cursor: pointer; }
  button:hover { background: #29435f; }
  button:disabled { opacity: .4; cursor: default; }

  button:focus-visible, select:focus-visible,
  input:focus-visible, canvas:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  [hidden] { display: none !important; }

  #app {
    height: 100%;
    min-height: 600px;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  h1 { font-size: 19px; margin: 0; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  p { margin: 8px 0; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }

  .toolbar label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  #content {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 265px;
    min-height: 0;
  }

  #stage {
    position: relative;
    min-width: 0;
    min-height: 330px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 40%, #18324f 0, #081321 75%);
  }

  #stage canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* One-finger vertical scroll; orbit uses two fingers (see orbit-page-scroll.js). */
    touch-action: pan-y;
  }

  #labels, #wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #wires { z-index: 2; }
  #labels { z-index: 3; }

  .anatomy-label {
    position: absolute;
    width: max-content;
    max-width: calc(50% - 16px);
    padding: 4px 7px;
    font-size: 12px;
    line-height: 20px;
    white-space: nowrap;
    text-align: left;
    background: rgba(8, 19, 33, .9);
    border-radius: 7px;
    pointer-events: auto;
  }

  .anatomy-label.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  #viewBadge {
    position: absolute;
    left: 12px;
    top: 12px;
    z-index: 4;
    padding: 5px 10px;
    border-radius: 20px;
    background: rgba(8, 19, 33, .88);
    color: var(--muted);
    font-size: 12px;
    pointer-events: none;
  }

  #error {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    padding: 30px;
    text-align: center;
    z-index: 10;
    background: var(--bg);
  }

  aside {
    overflow: auto;
    padding: 16px;
    background: var(--panel);
    border-left: 1px solid var(--border);
  }

  #description {
    color: var(--muted);
    font-size: 14px;
    min-height: 64px;
  }

  #structureList {
    display: grid;
    gap: 6px;
    margin: 14px 0;
  }

  .structure-button {
    display: flex;
    align-items: center;
    gap: 9px;
    text-align: left;
    width: 100%;
    padding: 8px;
    font-size: 14px;
  }

  .structure-button.active {
    border-color: var(--accent);
    background: #23405b;
  }

  .swatch {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  #explodeControls {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  #explode { width: 100%; }

  .small {
    font-size: 12px;
    color: var(--muted);
  }

  footer {
    padding: 9px 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
  }

  footer details { margin-top: 5px; }
  footer summary { cursor: pointer; }
  footer ol { margin: 5px 0; }

  @media (max-width: 680px) {
    #app { min-height: 760px; }
    #content {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(330px, 1fr) 240px;
    }
    aside {
      border-left: 0;
      border-top: 1px solid var(--border);
    }
    header { padding: 10px 12px; }
    h1 { font-size: 16px; }
    .toolbar { padding: 8px 12px; gap: 6px; }
    button, select { padding: 6px 9px; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/0.170.0/build/three.module.js",

<div id="app">
  <header>
    <h1 id="title">互動眼球解剖</h1>
  </header>

  <nav class="toolbar" aria-label="Viewer controls">
    <button id="back" hidden>← 返回眼球</button>
    <button id="cut">完整眼球</button>
    <button id="zoomIn" aria-label="Zoom in">＋</button>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="reset">重設</button>

    <label>
      <input id="showLabels" type="checkbox" checked>
      <span id="labelsText">標籤</span>
    </label>

    <label>
      <input id="autoDetail" type="checkbox" checked>
      <span id="autoText">放大時顯示分層</span>
    </label>
  </nav>

  <main id="content">
    <div id="stage">
      <svg id="wires" aria-hidden="true"></svg>
      <div id="labels"></div>
      <div id="viewBadge"></div>
      <div id="error" role="alert">
        正在載入 3D 模型…
      </div>
    </div>

    <aside aria-label="Anatomical information">
      <h2 id="infoTitle">選取結構</h2>
      <p id="description">
        點選標籤或下方結構。拖曳旋轉 · 滾輪縮放。
      </p>

      <button id="details" disabled>查看分層</button>

      <div id="explodeControls" hidden>

        <input id="explode" type="range"

        <p id="orientation" class="small"></p>
      </div>

      <div id="structureList"></div>
      <p id="hint" class="small"></p>
    </aside>
  </main>

  <footer>
    <span id="disclaimer">
      教育示意：顏色及厚度經誇大，並非檢查或診斷工具。
    </span>

    <details>
      <summary id="textOnly">純文字解剖</summary>
      <p id="textStructures">
        主要結構：角膜；前房；虹膜；瞳孔；晶體；睫狀體；玻璃體；視網膜；脈絡膜；鞏膜；黃斑；視神經。
      </p>
      <p id="textCornea">
        角膜，由外至內：上皮層 → 鮑曼氏層 → 基質層 → 後彈力層 → 內皮層。
      </p>
      <p id="textRetina">
        視網膜，由玻璃體側至脈絡膜側：內界膜 → 神經纖維層 → 神經節細胞層 → 內叢狀層 → 內核層 → 外叢狀層 → 外核層 → 外界膜 → 感光細胞節段 → 視網膜色素上皮。
      </p>
    </details>

    <noscript>
      JavaScript is required for the interactive model.
      Please use the text-only anatomy above.
    </noscript>
  </footer>
</div>

  THREE = await import("three");
  [{ OrbitControls }, { enablePageScrollOrbit }] = await Promise.all([
    import("three/addons/controls/OrbitControls.js"),
    import("/js/orbit-page-scroll.js"),
  ]);

  startViewer();
} catch (error) {
  console.error("Eye viewer failed:", error);
  $("error").hidden = false;
  $("error").textContent = text("failure");
}

function startViewer() {
  const stage = $("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setClearColor(0x081321, 0);
  renderer.localClippingEnabled = true;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.prepend(renderer.domElement);

  const canvas = renderer.domElement;
  canvas.tabIndex = 0;
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", text("canvas"));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, .025, 60);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = .09;
  controls.enablePan = false;
  controls.minDistance = 1.9;
  controls.maxDistance = 12;
  controls.zoomSpeed = .8;
  enablePageScrollOrbit(controls, canvas);

  scene.add(new THREE.HemisphereLight(0xeaf3ff, 0x2a3548, 1.0));

  const keyLight = new THREE.DirectionalLight(0xfff0dc, 2.2);
  keyLight.position.set(4, 6, 7);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x9cc3ff, .75);
  fillLight.position.set(-6, -1.5, 5);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0x7cb9ff, 1.5);
  rimLight.position.set(-5, 2, -4);
  scene.add(rimLight);

  const bounceLight = new THREE.DirectionalLight(0xffd8bd, .5);
  bounceLight.position.set(1, -7, 2);
  scene.add(bounceLight);

  const eye = new THREE.Group();
  scene.add(eye);

  // Positive X is removed in cutaway mode. The plane sits just off-centre
  // so the macula (x within ±.14) is not bisected by the cut.
  const CUT_X = .15;
  const cutPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), CUT_X);
  const sections = [];
  const eyeMeshes = [];
  const detailCache = new Map();

  let mode = "eye";
  let cutaway = true;
  let selected = null;
  let selectedLayer = null;
  let focused = false;
  let detailGroup = null;
  let labels = [];
  let dirty = true;
  let visible = true;
  let savedView = null;
  let viewerStarted = false;

  function material(color, opacity = 1) {
    return new THREE.MeshStandardMaterial({
      color,
      roughness: .42,
      metalness: 0,
      side: THREE.DoubleSide,
      transparent: opacity < 1,
      opacity,
      depthWrite: opacity === 1
    });
  }

  function addMesh(id, geometry, color, opacity = 1, parent = eye) {
    const mat = color && color.isMaterial ? color : material(color, opacity);
    const mesh = new THREE.Mesh(geometry, mat);
    mesh.userData.id = id;
    parent.add(mesh);
    if (parent === eye) eyeMeshes.push(mesh);
    return mesh;
  }

  // ---- Procedural assets (no external files) -------------------------------

  function seeded(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function canvasTexture(canvas) {
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    return texture;
  }

  // Generic schematic iris, planar-mapped over x,y in [-IRIS_SPAN, IRIS_SPAN].
  const IRIS_SPAN = .82;
  function makeIrisTexture() {
    const size = 512;
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext("2d");
    const rand = seeded(11);
    const half = size / 2;
    const k = half / IRIS_SPAN;
    const rIn = .25 * k;
    const rOut = .80 * k;

    ctx.fillStyle = "#16241f";
    ctx.fillRect(0, 0, size, size);

    const base = ctx.createRadialGradient(half, half, rIn, half, half, rOut);
    base.addColorStop(0, "#b08a3c");
    base.addColorStop(.26, "#8d8d3e");
    base.addColorStop(.45, "#4f9a62");
    base.addColorStop(.8, "#2f8a6e");
    base.addColorStop(1, "#1c5a50");
    ctx.fillStyle = base;
    ctx.beginPath();
    ctx.arc(half, half, rOut + 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.lineCap = "round";
    for (let i = 0; i < 1500; i++) {
      const angle = rand() * Math.PI * 2;
      const r0 = rIn * (1 + rand() * .18);
      const r1 = rIn + (rOut - rIn) * (.5 + rand() * .5);
      const wobble = (rand() - .5) * .07;
      const light = rand() > .45;
      ctx.strokeStyle = light
        ? `rgba(235,224,170,${.05 + rand() * .13})`
        : `rgba(14,32,28,${.07 + rand() * .16})`;
      ctx.lineWidth = .5 + rand() * 1.5;
      ctx.beginPath();
      ctx.moveTo(half + r0 * Math.cos(angle), half + r0 * Math.sin(angle));
      ctx.quadraticCurveTo(
        half + (r0 + r1) * .5 * Math.cos(angle + wobble),
        half + (r0 + r1) * .5 * Math.sin(angle + wobble),
        half + r1 * Math.cos(angle + wobble * 1.6),
        half + r1 * Math.sin(angle + wobble * 1.6)
      );
      ctx.stroke();
    }

    for (let i = 0; i < 18; i++) {
      const angle = rand() * Math.PI * 2;
      const r = rIn + (rOut - rIn) * (.55 + rand() * .35);
      ctx.save();
      ctx.translate(half + r * Math.cos(angle), half + r * Math.sin(angle));
      ctx.rotate(angle);
      ctx.fillStyle = `rgba(10,24,20,${.22 + rand() * .2})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, 7 + rand() * 9, 2.5 + rand() * 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const collarette = rIn + (rOut - rIn) * .36;
    ctx.strokeStyle = "rgba(240,226,170,.38)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const angle = i / 120 * Math.PI * 2;
      const r = collarette + Math.sin(angle * 9) * 4 + (rand() - .5) * 5;
      const x = half + r * Math.cos(angle);
      const y = half + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();

    const ruff = ctx.createRadialGradient(half, half, rIn - 1, half, half, rIn + 14);
    ruff.addColorStop(0, "rgba(28,16,8,.95)");
    ruff.addColorStop(.45, "rgba(40,26,12,.55)");
    ruff.addColorStop(1, "rgba(40,26,12,0)");
    ctx.fillStyle = ruff;
    ctx.beginPath();
    ctx.arc(half, half, rIn + 14, 0, Math.PI * 2);
    ctx.arc(half, half, rIn - 1, 0, Math.PI * 2, true);
    ctx.fill("evenodd");

    const limbal = ctx.createRadialGradient(half, half, rOut - 22, half, half, rOut);
    limbal.addColorStop(0, "rgba(10,28,26,0)");
    limbal.addColorStop(1, "rgba(10,28,26,.65)");
    ctx.fillStyle = limbal;
    ctx.beginPath();
    ctx.arc(half, half, rOut, 0, Math.PI * 2);
    ctx.fill();

    return canvasTexture(canvas);
  }

  // Equirectangular: u = azimuth, v = polar angle from the front (+Z).
  const LIMBUS_ANGLE = .58;
  function makeScleraTexture() {
    const w = 512;
    const h = 256;
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    const rand = seeded(23);
    const yOf = v => (1 - v) * h;
    const limbusV = LIMBUS_ANGLE / Math.PI;

    const base = ctx.createLinearGradient(0, 0, 0, h);
    base.addColorStop(0, "#d9dde0");
    base.addColorStop(1 - limbusV - .02, "#e8e6e0");
    base.addColorStop(1 - limbusV + .05, "#efece4");
    base.addColorStop(1, "#e2e1dc");
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 2600; i++) {
      ctx.fillStyle = `rgba(${rand() > .5 ? "255,255,250" : "150,150,145"},${rand() * .045})`;
      ctx.fillRect(rand() * w, rand() * h, 2 + rand() * 6, 1 + rand() * 2);
    }

    ctx.lineCap = "round";
    for (let i = 0; i < 70; i++) {
      let x = rand() * w;
      let y = yOf(limbusV + .03 + rand() * .08);
      ctx.strokeStyle = `rgba(190,70,70,${.05 + rand() * .075})`;
      ctx.lineWidth = .6 + rand() * 1.1;
      ctx.beginPath();
      ctx.moveTo(x, y);
      const length = 10 + rand() * 24;
      for (let s = 0; s < 4; s++) {
        x += (rand() - .5) * 9;
        y += length / 4;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    const ring = ctx.createLinearGradient(0, yOf(limbusV - .005), 0, yOf(limbusV + .05));
    ring.addColorStop(0, "rgba(125,135,150,.55)");
    ring.addColorStop(1, "rgba(125,135,150,0)");
    ctx.fillStyle = ring;
    ctx.fillRect(0, yOf(limbusV + .05), w, yOf(limbusV - .005) - yOf(limbusV + .05));

    return canvasTexture(canvas);
  }

  // Small gradient + soft-box scene baked into a PMREM for glints.
  function makeEnvironment() {
    const envScene = new THREE.Scene();

    const dome = new THREE.SphereGeometry(30, 32, 16);
    const colors = [];
    const position = dome.attributes.position;
    for (let i = 0; i < position.count; i++) {
      const t = THREE.MathUtils.clamp(position.getY(i) / 30 * .5 + .5, 0, 1);
      const low = new THREE.Color(.04, .055, .08);
      const mid = new THREE.Color(.22, .3, .4);
      const high = new THREE.Color(.62, .72, .86);
      const c = t < .5
        ? low.lerp(mid, t * 2)
        : mid.lerp(high, (t - .5) * 2);
      colors.push(c.r, c.g, c.b);
    }
    dome.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
    envScene.add(new THREE.Mesh(
      dome,
      new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })
    ));

    const panels = [
      { size: [16, 9], at: [7, 13, 11], color: [7, 6.6, 6] },
      { size: [5, 18], at: [-20, 3, 9], color: [2.4, 3, 4] },
      { size: [5, 14], at: [19, 2, -5], color: [1.6, 2, 2.6] },
      { size: [12, 3], at: [0, -9, 12], color: [1.2, 1, .9] }
    ];
    for (const panel of panels) {
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(...panel.size),
        new THREE.MeshBasicMaterial({
          color: new THREE.Color(...panel.color),
          side: THREE.DoubleSide
        })
      );
      mesh.position.set(...panel.at);
      mesh.lookAt(0, 0, 0);
      envScene.add(mesh);
    }

    const generator = new THREE.PMREMGenerator(renderer);
    const target = generator.fromScene(envScene, .04);
    generator.dispose();
    envScene.traverse(object => {
      object.geometry?.dispose();
      object.material?.dispose();
    });
    return target.texture;
  }

  let envMap = null;
  try {
    envMap = makeEnvironment();
  } catch (error) {
    console.warn("Environment map unavailable:", error);
  }

  function irisTextureSafe() {
    try { return makeIrisTexture(); } catch { return null; }
  }
  function scleraTextureSafe() {
    try { return makeScleraTexture(); } catch { return null; }
  }
  const irisTexture = irisTextureSafe();
  const scleraTexture = scleraTextureSafe();

  // Alpha boost at grazing angles and on specular glints, without
  // `transmission` or a second scene pass.
  function glassy(mat, rim, glint, key) {
    mat.onBeforeCompile = shader => {
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <opaque_fragment>",
        `float fres = pow(1.0 - clamp(abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0), 3.0);
         float glow = dot(totalSpecular, vec3(0.3333));
         diffuseColor.a = clamp(diffuseColor.a + fres * ${rim.toFixed(2)} + glow * ${glint.toFixed(2)}, 0.0, 1.0);
         #include <opaque_fragment>`
      );
    };
    mat.customProgramCacheKey = () => key;
    return mat;
  }

  function tissue(color, options = {}) {
    const opacity = options.opacity ?? 1;
    const Material = options.physical
      ? THREE.MeshPhysicalMaterial : THREE.MeshStandardMaterial;
    const mat = new Material({
      color,
      roughness: options.roughness ?? .5,
      metalness: 0,
      side: THREE.DoubleSide,
      transparent: opacity < 1,
      opacity,
      depthWrite: opacity === 1,
      map: options.map ?? null,
      vertexColors: Boolean(options.vertexColors),
      ...(options.extra || {})
    });
    if (envMap) {
      mat.envMap = envMap;
      mat.envMapIntensity = options.env ?? .5;
    }
    return mat;
  }

  // ---- Profile geometry ----------------------------------------------------
  // Everything is a closed (r, z) polygon revolved around the optical (Z) axis,
  // so neighbouring parts share the same wall coordinates.

  const V2 = (r, z) => new THREE.Vector2(r, z);
  const polar = (R, a) => {
    const r = R * Math.sin(a);
    return V2(Math.abs(r) < 1e-9 ? 0 : r, R * Math.cos(a));
  };
  const arc = (R, a0, a1, n) => {
    const points = [];
    for (let i = 0; i <= n; i++) points.push(polar(R, a0 + (a1 - a0) * i / n));
    return points;
  };
  const coatPolygon = (outer, inner, start, n = 72) => [
    ...arc(outer, start, Math.PI, n),
    ...arc(inner, Math.PI, start, n)
  ];

  function revolve(polygon, segments, options = {}) {
    const pts = [];
    for (const p of polygon) {
      const last = pts[pts.length - 1];
      if (!last || last.distanceTo(p) > 1e-6) pts.push(p.clone());
    }
    if (pts.length > 1 && pts[0].distanceTo(pts[pts.length - 1]) < 1e-6) {
      pts.pop();
    }
    const n = pts.length;

    let area = 0;
    for (let i = 0; i < n; i++) {
      const a = pts[i];
      const b = pts[(i + 1) % n];
      area += a.x * b.y - b.x * a.y;
    }
    const sign = area >= 0 ? 1 : -1;
    const segmentNormals = pts.map((a, i) => {
      const b = pts[(i + 1) % n];
      const dx = b.x - a.x;
      const dz = b.y - a.y;
      const length = Math.hypot(dx, dz) || 1;
      return V2(sign * dz / length, -sign * dx / length);
    });

    const creaseLimit = Math.cos(
      THREE.MathUtils.degToRad(options.crease ?? 40)
    );
    const nodes = [];
    const nodeIn = [];
    const nodeOut = [];
    for (let k = 0; k < n; k++) {
      const previous = segmentNormals[(k + n - 1) % n];
      const next = segmentNormals[k];
      const p = pts[k];
      const make = (normal, seg) => {
        nodes.push({ r: p.x, z: p.y, nr: normal.x, nz: normal.y, seg, k });
        return nodes.length - 1;
      };
      if (previous.dot(next) >= creaseLimit) {
        const id = make(previous.clone().add(next).normalize(), k);
        nodeIn[k] = nodeOut[k] = id;
      } else {
        nodeIn[k] = make(previous, (k + n - 1) % n);
        nodeOut[k] = make(next, k);
      }
    }

    const ring = segments + 1;
    const positions = new Float32Array(nodes.length * ring * 3);
    const normals = new Float32Array(nodes.length * ring * 3);
    const uvs = new Float32Array(nodes.length * ring * 2);
    const colors = options.segColor
      ? new Float32Array(nodes.length * ring * 3) : null;

    nodes.forEach((node, index) => {
      for (let j = 0; j <= segments; j++) {
        const phi = j / segments * Math.PI * 2;
        const cos = Math.cos(phi);
        const sin = Math.sin(phi);
        let r = node.r;
        let z = node.z;
        if (options.displace) [r, z] = options.displace(r, z, phi);
        const at = index * ring + j;
        positions.set([r * cos, r * sin, z], at * 3);
        normals.set([node.nr * cos, node.nr * sin, node.nz], at * 3);
        uvs.set(
          options.uv ? options.uv(node, j / segments, r, z, cos, sin)
                     : [j / segments, node.k / n],
          at * 2
        );
        if (colors) colors.set(options.segColor(node.seg), at * 3);
      }
    });

    const indices = [];
    for (let k = 0; k < n; k++) {
      const a = pts[k];
      const b = pts[(k + 1) % n];
      if (a.x < 1e-6 && b.x < 1e-6) continue;
      const start = nodeOut[k] * ring;
      const end = nodeIn[(k + 1) % n] * ring;
      for (let j = 0; j < segments; j++) {
        indices.push(
          start + j, end + j, start + j + 1,
          start + j + 1, end + j, end + j + 1
        );
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
    geometry.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
    if (colors) {
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    }
    geometry.setIndex(indices);

    if (options.displace) {
      geometry.computeVertexNormals();
      const normal = geometry.attributes.normal;
      const tmp = new THREE.Vector3();
      nodes.forEach((_, index) => {
        const first = index * ring;
        const last = first + segments;
        tmp.fromBufferAttribute(normal, first)
          .add(new THREE.Vector3().fromBufferAttribute(normal, last))
          .normalize();
        normal.setXYZ(first, tmp.x, tmp.y, tmp.z);
        normal.setXYZ(last, tmp.x, tmp.y, tmp.z);
      });
    }
    return geometry;
  }

  // Flat cut face of a revolved solid on the plane x = cutX. A point at
  // radius r lies at y = ±sqrt(r² − cutX²) on that plane.
  function clipMinRadius(polygon, minR) {
    const out = [];
    const n = polygon.length;
    for (let i = 0; i < n; i++) {
      const a = polygon[i];
      const b = polygon[(i + 1) % n];
      const aIn = a.x >= minR;
      const bIn = b.x >= minR;
      if (aIn) out.push(a);
      if (aIn !== bIn) {
        const t = (minR - a.x) / (b.x - a.x);
        out.push(V2(minR, a.y + (b.y - a.y) * t));
      }
    }
    return out;
  }

  function capGeometry(polygon, displace) {
    const clipped = clipMinRadius(polygon, CUT_X);
    const mapped = [];
    for (const p of clipped) {
      let r = p.x;
      let z = p.y;
      if (displace) {
        const phi = Math.atan2(Math.sqrt(Math.max(r * r - CUT_X * CUT_X, 0)), CUT_X);
        [r, z] = displace(r, z, phi);
      }
      const y = Math.sqrt(Math.max(r * r - CUT_X * CUT_X, 0));
      const last = mapped[mapped.length - 1];
      if (!last || Math.hypot(last.x - y, last.y - z) > 1e-5) {
        mapped.push(V2(y, z));
      }
    }
    if (mapped.length > 2 &&
        Math.hypot(mapped[0].x - mapped.at(-1).x,
                   mapped[0].y - mapped.at(-1).y) < 1e-5) mapped.pop();

    const positions = [];
    const indices = [];
    if (mapped.length >= 3) {
      for (const side of [1, -1]) {
        const base = positions.length / 3;
        const contour = mapped.map(p => V2(side * p.x, p.y));
        const faces = THREE.ShapeUtils.triangulateShape(contour, []);
        contour.forEach(p => positions.push(CUT_X + .002, p.x, p.y));
        faces.forEach(face => indices.push(
          base + face[0], base + face[1], base + face[2]
        ));
      }
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      "position", new THREE.Float32BufferAttribute(positions, 3)
    );
    geometry.setAttribute("normal", new THREE.Float32BufferAttribute(
      positions.map((_, i) => (i % 3 === 0 ? 1 : 0)), 3
    ));
    geometry.setIndex(indices);
    return geometry;
  }

  function addCap(id, polygon, color, options = {}) {
    const mat = tissue(color, {
      roughness: options.roughness ?? .6,
      opacity: options.opacity ?? 1,
      env: .25
    });
    const face = addMesh(
      id, capGeometry(polygon, options.displace), mat
    );
    face.userData.noClip = true;
    if (options.renderOrder) face.renderOrder = options.renderOrder;
    sections.push(face);
    return face;
  }

  // ---- Wall coats: sclera, choroid, retina ---------------------------------

  const scleraMaterial = tissue("#d9d8d6", {
    map: scleraTexture, roughness: .4, env: .75
  });
  const scleraPolygon = coatPolygon(1.50, 1.425, LIMBUS_ANGLE);
  addMesh("sclera", revolve(scleraPolygon, 80, {
    uv: (node, u) => [u, Math.atan2(node.r, node.z) / Math.PI]
  }), scleraMaterial);
  addCap("sclera", scleraPolygon, "#f1f2f3");

  const ORA_ANGLE = .99;
  const choroidPolygon = coatPolygon(1.423, 1.395, ORA_ANGLE);
  addMesh("choroid", revolve(choroidPolygon, 80),
    tissue("#914d50", { roughness: .62, env: .3 }));
  addCap("choroid", choroidPolygon, "#914d50");

  const retinaPolygon = coatPolygon(1.392, 1.360, ORA_ANGLE + .01);
  addMesh("retina", revolve(retinaPolygon, 80),
    tissue("#ef927d", { roughness: .66, env: .3 }));
  addCap("retina", retinaPolygon, "#ef927d");

  // ---- Cornea: aspheric front and back surfaces ----------------------------

  const asphere = (R, k) => r =>
    r * r / (R * (1 + Math.sqrt(Math.max(0, 1 - (1 + k) * r * r / (R * R)))));
  const limbusOuter = polar(1.5, LIMBUS_ANGLE);
  const limbusInner = polar(1.425, LIMBUS_ANGLE);
  const sagOuter = asphere(.98, -.25);
  const sagInner = asphere(.90, -.25);
  const apexOuter = limbusOuter.y + sagOuter(limbusOuter.x);
  const apexInner = limbusInner.y + sagInner(limbusInner.x);
  const corneaOuter = [];
  const corneaInner = [];
  for (let i = 0; i <= 48; i++) {
    const f = i / 48;
    const ro = limbusOuter.x * f;
    corneaOuter.push(V2(ro, apexOuter - sagOuter(ro)));
    const ri = limbusInner.x * (1 - f);
    corneaInner.push(V2(ri, apexInner - sagInner(ri)));
  }
  const corneaPolygon = [...corneaOuter, ...corneaInner];

  const corneaMaterial = glassy(tissue("#bdeff6", {
    opacity: .13, roughness: .05, physical: true, env: 2.2,
    extra: { clearcoat: .6, clearcoatRoughness: .04, ior: 1.376 }
  }), .4, 1.3, "cornea");
  const cornea = addMesh("cornea", revolve(corneaPolygon, 80), corneaMaterial);
  cornea.userData.pick = true;
  cornea.renderOrder = 5;
  addCap("cornea", corneaPolygon, "#9fdbe6");

  // ---- Lens: flatter front curve, steeper back curve -----------------------

  const LENS_EQUATOR_Z = .92;
  const LENS_RADIUS = .50;
  const LENS_FRONT = .20;
  const LENS_BACK = .30;
  const lensFront = r =>
    LENS_EQUATOR_Z + LENS_FRONT * Math.sqrt(Math.max(0, 1 - (r / LENS_RADIUS) ** 2));
  const lensPolygon = [];
  for (let i = 0; i <= 28; i++) {
    const t = i / 28 * Math.PI / 2;
    lensPolygon.push(V2(LENS_RADIUS * Math.sin(t),
                        LENS_EQUATOR_Z + LENS_FRONT * Math.cos(t)));
  }
  for (let i = 1; i <= 28; i++) {
    const t = Math.PI / 2 + i / 28 * Math.PI / 2;
    lensPolygon.push(V2(LENS_RADIUS * Math.sin(t),
                        LENS_EQUATOR_Z + LENS_BACK * Math.cos(t)));
  }
  const lensMaterial = glassy(tissue("#b6dceb", {
    opacity: .72, roughness: .12, env: 1.1
  }), .28, .6, "lens");
  const lens = addMesh("lens", revolve(lensPolygon, 72), lensMaterial);
  lens.renderOrder = 1;
  addCap("lens", lensPolygon, "#a9d3e4");
  addCap("lens", lensPolygon.map(p =>
    V2(p.x * .58, LENS_EQUATOR_Z + (p.y - LENS_EQUATOR_Z) * .58)
  ), "#e6d89e").position.x = .001;

  // ---- Iris: sloped diaphragm with thickness and a real pupil opening ------

  const PUPIL_RADIUS = .25;
  const irisFront = r => 1.150 + (.80 - r) / .55 * .022;
  const irisBack = r => irisFront(r) - .045;
  const irisPolygon = [
    V2(.81, irisFront(.80)),
    V2(PUPIL_RADIUS, irisFront(PUPIL_RADIUS)),
    V2(PUPIL_RADIUS, irisBack(PUPIL_RADIUS)),
    V2(.81, irisBack(.80))
  ];
  const irisSegmentColors = [
    [1, 1, 1], [.2, .12, .08], [.045, .03, .025], [.09, .06, .045]
  ];
  const irisMaterial = tissue("#ffffff", {
    map: irisTexture, vertexColors: true, roughness: .55, env: .35
  });
  const iris = addMesh("iris", revolve(irisPolygon, 128, {
    uv: (node, u, r, z, cos, sin) =>
      [r * cos / (2 * IRIS_SPAN) + .5, r * sin / (2 * IRIS_SPAN) + .5],
    segColor: seg => irisSegmentColors[seg]
  }), irisMaterial);
  addCap("iris", irisPolygon, "#6f9a84");

  // The aperture: a dark skin hugging the lens front, so the lens is seen
  // through the opening. It is the pick target for 瞳孔 / Pupil.
  const pupilPolygon = [];
  for (let i = 0; i <= 10; i++) {
    const r = PUPIL_RADIUS * i / 10;
    pupilPolygon.push(V2(r, lensFront(r) + .008));
  }
  for (let i = 10; i >= 0; i--) {
    const r = PUPIL_RADIUS * i / 10;
    pupilPolygon.push(V2(r, lensFront(r) + .004));
  }
  const pupil = addMesh("pupil", revolve(pupilPolygon, 48),
    tissue("#050a12", { opacity: .74, roughness: .3, env: .1 }));
  pupil.userData.pick = true;
  pupil.renderOrder = 6;

  // ---- Aqueous: anterior chamber bounded by cornea, iris and lens ----------

  const aqueousPolygon = [];
  for (let i = 0; i <= 40; i++) {
    const r = limbusInner.x * i / 40;
    aqueousPolygon.push(V2(r, apexInner - sagInner(r)));
  }
  aqueousPolygon.push(V2(.80, irisFront(.80)));
  aqueousPolygon.push(V2(PUPIL_RADIUS, irisFront(PUPIL_RADIUS)));
  for (let i = 0; i <= 8; i++) {
    const r = PUPIL_RADIUS * (1 - i / 8);
    aqueousPolygon.push(V2(r, lensFront(r)));
  }
  const aqueous = addMesh("aqueous",
    revolve(aqueousPolygon, 64), "#63bce7", .055);
  aqueous.renderOrder = 4;

  // ---- Ciliary body: wedge lining the inner scleral wall -------------------
  // Pars plicata (ridged processes) in front, tapering pars plana behind,
  // ending at the ora serrata where choroid and retina begin.

  const CILIARY_FRONT = .60;
  const CILIARY_WALL = 1.422;
  const CILIARY_PROCESSES = 48;
  const ciliaryThickness = [
    [.600, .120], [.630, .172], [.700, .166], [.780, .120],
    [.860, .066], [.930, .042], [ORA_ANGLE, .027]
  ];
  const thicknessAt = a => {
    for (let i = 1; i < ciliaryThickness.length; i++) {
      const [a0, t0] = ciliaryThickness[i - 1];
      const [a1, t1] = ciliaryThickness[i];
      if (a <= a1) {
        const f = (a - a0) / (a1 - a0);
        const s = f * f * (3 - 2 * f);
        return t0 + (t1 - t0) * s;
      }
    }
    return ciliaryThickness.at(-1)[1];
  };
  const ciliaryInner = a => polar(CILIARY_WALL - thicknessAt(a), a);
  const ciliaryPolygon = [];
  for (let i = 0; i <= 12; i++) {
    ciliaryPolygon.push(polar(CILIARY_WALL,
      CILIARY_FRONT + (ORA_ANGLE - CILIARY_FRONT) * i / 12));
  }
  for (let i = 0; i <= 28; i++) {
    ciliaryPolygon.push(ciliaryInner(
      ORA_ANGLE - (ORA_ANGLE - CILIARY_FRONT) * i / 28
    ));
  }
  const processRidge = phi =>
    Math.pow(.5 + .5 * Math.cos(CILIARY_PROCESSES * phi), 1.4);
  const ciliaryDisplace = (r, z, phi) => {
    const R = Math.hypot(r, z);
    if (R > CILIARY_WALL - .012) return [r, z];
    const a = Math.atan2(r, z);
    const weight = THREE.MathUtils.clamp((.80 - a) / .12, 0, 1);
    const lift = weight * (1 - processRidge(phi)) * .055;
    const scale = (R + lift) / R;
    return [r * scale, z * scale];
  };
  addMesh("ciliary", revolve(ciliaryPolygon, 192, {
    displace: ciliaryDisplace, crease: 50
  }), tissue("#b67bba", { roughness: .5, env: .45 }));
  addCap("ciliary", ciliaryPolygon, "#b67bba", { displace: ciliaryDisplace });

  // Zonules run from the process tips to the lens equator.
  const tip = ciliaryInner(.66);
  const zonulePositions = [];
  for (let i = 0; i < CILIARY_PROCESSES; i++) {
    const phi = i / CILIARY_PROCESSES * Math.PI * 2;
    const cos = Math.cos(phi);
    const sin = Math.sin(phi);
    for (const dz of [.035, -.035]) {
      zonulePositions.push(
        tip.x * cos, tip.x * sin, tip.y,
        LENS_RADIUS * .98 * cos, LENS_RADIUS * .98 * sin, LENS_EQUATOR_Z + dz
      );
    }
  }
  const zonuleGeometry = new THREE.BufferGeometry();
  zonuleGeometry.setAttribute(
    "position", new THREE.Float32BufferAttribute(zonulePositions, 3)
  );
  eye.add(new THREE.LineSegments(
    zonuleGeometry,
    new THREE.LineBasicMaterial({ color: "#d9cde4", transparent: true, opacity: .75 })
  ));

  // ---- Vitreous: fills the cavity behind the lens --------------------------

  const vitreousPolygon = [
    ...arc(1.358, ORA_ANGLE, Math.PI, 48),
    V2(0, LENS_EQUATOR_Z - LENS_BACK)
  ];
  for (let i = 1; i <= 24; i++) {
    const t = Math.PI - i / 24 * Math.PI / 2;
    vitreousPolygon.push(V2(LENS_RADIUS * Math.sin(t),
                            LENS_EQUATOR_Z + LENS_BACK * Math.cos(t)));
  }
  for (let i = 1; i <= 14; i++) {
    vitreousPolygon.push(ciliaryInner(.74 + (ORA_ANGLE - .74) * i / 14));
  }
  const vitreous = addMesh("vitreous",
    revolve(vitreousPolygon, 72), "#87bbd6", .045);
  vitreous.renderOrder = 3;
  addCap("vitreous", vitreousPolygon, "#87bbd6", { opacity: .13, renderOrder: 3 });

  // ---- Posterior pole: macula, optic nerve and disc (unchanged) ------------

  const macula = addMesh(
    "macula", new THREE.CircleGeometry(.14, 48), "#edc15a"
  );
  macula.position.z = -1.348;

  const fovea = addMesh(
    "macula", new THREE.CircleGeometry(.035, 32), "#d28553"
  );
  fovea.position.z = -1.345;

  const optic = addMesh(
    "optic", new THREE.CylinderGeometry(.16, .20, 1.12, 40), "#eac393"
  );
  optic.rotation.x = Math.PI / 2;
  optic.position.set(-.34, .10, -1.89);
  optic.userData.noClip = true;

  const disc = addMesh(
    "optic", new THREE.SphereGeometry(1, 32, 20), "#f0d9aa"
  );
  disc.scale.set(.11, .11, .028);
  disc.position.set(-.34, .10, -1.31);

  function updateCutaway() {
    eye.traverse(object => {
      if (!object.material) return;
      const materials = Array.isArray(object.material)
        ? object.material : [object.material];
      for (const mat of materials) {
        mat.clippingPlanes =
          cutaway && !object.userData.noClip ? [cutPlane] : [];
        mat.needsUpdate = true;
      }
    });
    for (const face of sections) face.visible = cutaway;
    dirty = true;
  }

  // Curved tissue blocks. All dimensions are schematic.
  function tissueGeometry(thickness, bend) {
    const geometry = new THREE.BoxGeometry(
      2.7, thickness, 1.45, 28, 1, 14
    );
    const positions = geometry.attributes.position;
    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i);
      const z = positions.getZ(i);
      positions.setY(
        i,
        positions.getY(i) + bend * (1 - x*x/1.83 - z*z/1.05)
      );
    }
    positions.needsUpdate = true;
    geometry.computeVertexNormals();
    return geometry;
  }

  function getDetail(id) {
    if (detailCache.has(id)) return detailCache.get(id);

    const group = new THREE.Group();
    group.userData.items = [];

    LAYERS[id].forEach((row, index) => {
      let geometry;
      if (id === "lens") {
        geometry = new THREE.SphereGeometry(1, 64, 32);
      } else {
        geometry = tissueGeometry(row[4], id === "cornea" ? .22 : .04);
      }

      const mesh = addMesh(
        row[0], geometry, row[3],
        id === "lens" && index < 2 ? .30 : 1,
        group
      );

      if (id === "lens") {
        const sizes = [
          [1.12, 1.12, .50],
          [1.05, 1.05, .46],
          [.66, .66, .31]
        ];
        mesh.scale.set(...sizes[index]);
        mesh.renderOrder = 3 - index;
      }

      group.userData.items.push({ mesh, row, index });
    });

    scene.add(group);
    group.visible = false;
    detailCache.set(id, group);
    return group;
  }

  function updateSeparation() {
    if (!detailGroup) return;

    const items = detailGroup.userData.items;
    const gap = Number($("explode").value) * .26;

    if (mode === "lens") {
      items.forEach(({ mesh, index }) => {
        mesh.position.set((index - 1) * gap * 5.5, 0, 0);
      });
    } else {
      const total = items.reduce((sum, item) => sum + item.row[4], 0)
        + gap * (items.length - 1);
      let top = total / 2;

      items.forEach(({ mesh, row }) => {
        mesh.position.set(0, top - row[4] / 2, 0);
        top -= row[4] + gap;
      });
    }

    dirty = true;
  }

  function activeRows() {
    return mode === "eye" ? GROSS : LAYERS[mode];
  }

  function highlight() {
    for (const mesh of eyeMeshes) {
      if (mesh.material.emissive) {
        mesh.material.emissive.set(
          mode === "eye" && mesh.userData.id === selected
            ? "#19434d" : "#000000"
        );
      }
    }

    if (detailGroup) {
      for (const { mesh } of detailGroup.userData.items) {
        mesh.material.emissive.set(
          mesh.userData.id === selectedLayer ? "#224650" : "#000000"
        );
      }
    }

    document.querySelectorAll("[data-structure]").forEach(button => {
      const id = mode === "eye" ? selected : selectedLayer;
      const active = button.dataset.structure === id;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });

    dirty = true;
  }

  function notifyParent(id) {
    // Optional integration hook. No existing site behavior is assumed.
    if (parent !== window && location.origin !== "null") {
      parent.postMessage({
        type: "eyesinfo-eye-select",
        structure: id,
        label: id ? nameOf(grossById(id)) : null
      }, location.origin);
    }
  }

  // The globe (radius 1.5) and corneal apex (about 1.66) must never swallow
  // the camera. With the target at the origin the zoom floor sits outside the
  // globe; once a structure is focused the floor relaxes so layer views can
  // still open, and a hard radial floor takes over for everything else.
  const CAMERA_FLOOR = 1.85;
  const ZOOM_FLOOR_CUTAWAY = 1.9;
  const ZOOM_FLOOR_WHOLE = 2.4;
  const ZOOM_FLOOR_FOCUSED = 1.1;
  const DEFAULT_DIRECTION = new THREE.Vector3(4.8, 2.1, 4.5).normalize();
  let atDefaultView = true;

  // Aspect-aware framing: the eye (with its nerve) must fit both the vertical
  // and the horizontal field of view, which matters on narrow phone stages.
  function defaultDistance() {
    const width = stage.clientWidth || 800;
    const height = stage.clientHeight || 500;
    const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const extent = 2.35;
    const fitHeight = extent / tan;
    const fitWidth = extent / (tan * (width / height));
    return THREE.MathUtils.clamp(Math.max(fitHeight, fitWidth), 5.6, 10);
  }

  function frameDefaultView() {
    controls.target.set(0, 0, 0);
    camera.position.copy(DEFAULT_DIRECTION).multiplyScalar(defaultDistance());
    atDefaultView = true;
  }

  function setZoomFloor() {
    controls.minDistance = mode !== "eye"
      ? 1.8
      : focused ? ZOOM_FLOOR_FOCUSED
      : cutaway ? ZOOM_FLOOR_CUTAWAY : ZOOM_FLOOR_WHOLE;
  }

  function keepCameraOutsideGlobe() {
    if (mode !== "eye") return;
    if (focused && $("autoDetail").checked && LAYERS[selected]) return;
    const length = camera.position.length();
    if (length >= CAMERA_FLOOR) return;
    camera.position.multiplyScalar(CAMERA_FLOOR / Math.max(length, 1e-4));
    camera.lookAt(controls.target);
  }

  function selectStructure(id, focus = true) {
    if (mode === "eye") {
      selected = id;
      selectedLayer = null;

      if (focus) {
        const row = grossById(id);
        controls.target.set(...row[4]);
        const direction = new THREE.Vector3(1, .35, 1).normalize();
        camera.position.copy(controls.target)
          .addScaledVector(direction, 3.0);
        focused = true;
        atDefaultView = false;
        setZoomFloor();
        controls.update();
      }

      notifyParent(id);
    } else {
      selectedLayer = id;
    }

    updateInformation();
    highlight();
  }

  function updateInformation() {
    const row = mode === "eye"
      ? grossById(selected)
      : LAYERS[mode].find(item => item[0] === selectedLayer);

    $("infoTitle").textContent = row
      ? nameOf(row)
      : mode === "eye" ? text("choose") : nameOf(grossById(mode));

    $("description").textContent = row
      ? row[mode === "eye"
          ? (lang === "en" ? 5 : 6)
          : (lang === "en" ? 5 : 6)]
      : text(mode === "eye" ? "intro" : "layerHint");

    $("details").disabled =
      mode !== "eye" || !LAYERS[selected];

    $("details").hidden = mode !== "eye";
  }

  function buildInterface() {
    document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
    $("title").textContent = text("title");
    $("cut").textContent = text(cutaway ? "whole" : "cutaway");
    $("reset").textContent = text("reset");
    $("back").textContent = text("back");
    $("labelsText").textContent = text("labels");
    $("autoText").textContent = text("auto");
    $("details").textContent = text("detail");
    $("explodeText").textContent = text("gap");
    $("disclaimer").textContent = text("disclaimer");
    $("textOnly").textContent = text("textOnly");
    $("textStructures").textContent = text("textStructures");
    $("textCornea").textContent = text("textCornea");
    $("textRetina").textContent = text("textRetina");
    stage.querySelector("canvas")?.setAttribute("aria-label", text("canvas"));
    $("hint").textContent = text(mode === "eye" ? "hint" : "layerHint");

    $("back").hidden = mode === "eye";
    $("cut").disabled = mode !== "eye";
    $("explodeControls").hidden = mode === "eye";
    $("orientation").textContent =
      mode === "eye" ? "" : text(mode + "Order");

    $("viewBadge").textContent = mode === "eye"
      ? text(cutaway ? "cutaway" : "whole")
      : nameOf(grossById(mode)) + " · " + text("detail");

    $("structureList").replaceChildren();
    $("labels").replaceChildren();
    $("wires").replaceChildren();
    labels = [];

    activeRows().forEach(row => {
      const listButton = document.createElement("button");
      listButton.className = "structure-button";
      listButton.dataset.structure = row[0];

      const swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.background = row[3];
      swatch.setAttribute("aria-hidden", "true");
      listButton.append(swatch, document.createTextNode(nameOf(row)));
      listButton.onclick = () => selectStructure(row[0]);
      $("structureList").append(listButton);

      const label = document.createElement("button");
      label.className = "anatomy-label";
      label.dataset.structure = row[0];
      label.textContent = nameOf(row);
      label.title = nameOf(row);
      label.style.borderColor = row[3];
      label.onclick = () => selectStructure(row[0]);

      const wire = document.createElementNS(
        "http://www.w3.org/2000/svg", "polyline"
      );
      wire.setAttribute("fill", "none");
      wire.setAttribute("stroke", row[3]);
      wire.setAttribute("stroke-width", "1");
      wire.setAttribute("opacity", ".7");

      $("labels").append(label);
      $("wires").append(wire);
      labels.push({ row, label, wire });
    });

    updateInformation();
    highlight();
    dirty = true;
  }

  // The lens layers open stacked; cornea and retina keep the markup default.
  const LAYER_GAP_DEFAULT = { lens: 0 };

  function enterDetail(id) {
    if (!LAYERS[id] || mode !== "eye") return;

    savedView = {
      position: camera.position.clone(),
      target: controls.target.clone()
    };

    selected = id;
    selectedLayer = null;
    focused = false;
    mode = id;
    eye.visible = false;
    detailGroup = getDetail(id);
    detailGroup.visible = true;

    $("explode").value = LAYER_GAP_DEFAULT[id] ?? $("explode").defaultValue;

    setZoomFloor();
    controls.maxDistance = 12;
    controls.target.set(0, 0, 0);
    camera.position.set(3.5, 2.3, 5.0);
    controls.update();

    updateSeparation();
    buildInterface();
  }

  function backToEye(resetView = false) {
    if (detailGroup) detailGroup.visible = false;
    detailGroup = null;
    mode = "eye";
    selectedLayer = null;
    eye.visible = true;
    controls.maxDistance = 12;

    if (!resetView && savedView) {
      controls.target.copy(savedView.target);
      const offset = savedView.position.clone().sub(savedView.target);
      offset.setLength(Math.max(offset.length(), 3));
      camera.position.copy(savedView.target).add(offset);
      focused = Boolean(selected);
      atDefaultView = false;
    } else {
      selected = null;
      focused = false;
      if (viewerStarted) notifyParent(null);
      frameDefaultView();
    }

    setZoomFloor();
    controls.update();
    buildInterface();
  }

  function zoom(factor) {
    const offset = camera.position.clone().sub(controls.target);
    const distance = THREE.MathUtils.clamp(
      offset.length() * factor,
      controls.minDistance,
      controls.maxDistance
    );
    offset.setLength(distance);
    camera.position.copy(controls.target).add(offset);
    atDefaultView = false;
    controls.update();
    dirty = true;
  }

  function rotate(dx, dy) {
    const offset = camera.position.clone().sub(controls.target);
    const spherical = new THREE.Spherical().setFromVector3(offset);
    spherical.theta += dx;
    spherical.phi = THREE.MathUtils.clamp(
      spherical.phi + dy, .08, Math.PI - .08
    );
    camera.position.copy(controls.target)
      .add(new THREE.Vector3().setFromSpherical(spherical));
    atDefaultView = false;
    controls.update();
    dirty = true;
  }

  // Screen-space label placement, with leader lines.
  // Labels are educational annotations, not depth-occluded surfaces.
  function drawLabels() {
    const enabled = $("showLabels").checked;
    $("labels").hidden = !enabled;
    $("wires").hidden = !enabled;
    if (!enabled) return;

    const width = stage.clientWidth;
    const height = stage.clientHeight;
    const columns = [[], []];
    const activeId = mode === "eye" ? selected : selectedLayer;

    labels.forEach(item => {
      const anchor = new THREE.Vector3();

      if (mode === "eye") {
        anchor.set(...item.row[4]);
      } else {
        const part = detailGroup.userData.items
          .find(entry => entry.row[0] === item.row[0]);
        part.mesh.getWorldPosition(anchor);
        if (mode !== "lens") anchor.x += 1.35;
      }

      anchor.project(camera);
      item.label.style.display = "none";
      item.wire.style.display = "none";

      if (anchor.z < -1 || anchor.z > 1) return;

      item.px = (anchor.x * .5 + .5) * width;
      item.py = (-anchor.y * .5 + .5) * height;
      if (item.px < -width || item.px > width * 2) return;

      columns[item.px < width / 2 ? 0 : 1].push(item);
    });

    const pad = 10;
    const gap = 6;

    columns.forEach((items, side) => {
      items.forEach(item => {
        item.label.style.display = "block";
        item.label.style.maxWidth = Math.max(72, Math.floor((width - pad * 3) / 2)) + "px";
      });

      const sample = items[0]?.label.offsetHeight || 30;
      const capacity = Math.max(
        1,
        Math.floor((height - pad * 2 + gap) / (sample + gap))
      );

      // Selected annotations are retained when space is limited.
      items.sort((a, b) =>
        Number(b.row[0] === activeId) - Number(a.row[0] === activeId)
      );
      const kept = new Set(items.slice(0, capacity));
      items.forEach(item => {
        if (!kept.has(item)) {
          item.label.style.display = "none";
          item.wire.style.display = "none";
        }
      });
      items = items.filter(item => kept.has(item));
      items.sort((a, b) => a.py - b.py);

      let cursor = pad;
      items.forEach(item => {
        const h = item.label.offsetHeight || sample;
        const preferred = Math.max(pad, Math.min(item.py - h / 2, height - pad - h));
        item.top = Math.max(cursor, preferred);
        cursor = item.top + h + gap;
      });

      const overflow = cursor - gap - (height - pad);
      if (overflow > 0) {
        items.forEach(item => { item.top -= overflow; });
      }

      items.forEach(item => {
        const h = item.label.offsetHeight || sample;
        const w = item.label.offsetWidth || 72;
        item.top = Math.max(pad, Math.min(item.top, height - pad - h));
        const x = side === 0 ? pad : Math.max(pad, width - pad - w);
        item.ly = item.top + h / 2;
        item.label.style.display = "block";
        item.wire.style.display = "block";
        item.label.style.left = x + "px";
        item.label.style.top = item.top + "px";

        const edge = side === 0 ? x + w : x;
        const elbow = side === 0 ? edge + 10 : edge - 10;

        item.wire.setAttribute("points",
          `${item.px},${item.py} ${elbow},${item.ly} ${edge},${item.ly}`
        );
      });
    });
  }

  // Clicking a mesh selects it; dragging must not trigger selection.
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const activePointers = new Set();
  let pointerStart = null;
  let multiPointerGesture = false;

  canvas.addEventListener("pointerdown", event => {
    activePointers.add(event.pointerId);
    if (activePointers.size === 1) {
      multiPointerGesture = false;
      pointerStart = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY
      };
    } else {
      multiPointerGesture = true;
    }
  });

  canvas.addEventListener("pointercancel", event => {
    activePointers.delete(event.pointerId);
    pointerStart = null;
  });

  canvas.addEventListener("pointerup", event => {
    activePointers.delete(event.pointerId);

    if (!pointerStart ||
        pointerStart.id !== event.pointerId ||
        multiPointerGesture ||
        Math.hypot(event.clientX - pointerStart.x,
                   event.clientY - pointerStart.y) > 6) return;

    pointerStart = null;
    const rect = canvas.getBoundingClientRect();
    pointer.set(
      ((event.clientX - rect.left) / rect.width) * 2 - 1,
      -((event.clientY - rect.top) / rect.height) * 2 + 1
    );

    scene.updateMatrixWorld(true);
    camera.updateMatrixWorld(true);
    raycaster.setFromCamera(pointer, camera);

    const objects = mode === "eye"
      ? eyeMeshes
      : detailGroup.userData.items.map(item => item.mesh);

    const hit = raycaster.intersectObjects(objects, false).find(result => {
      if (!result.object.visible) return false;
      if (mode === "eye" && cutaway &&
          !result.object.userData.noClip &&
          cutPlane.distanceToPoint(result.point) < -.001) return false;

      // Very transparent cavity models should not block solid tissues.
      return result.object.userData.pick === true ||
        result.object.material.opacity >= .15;
    });

    if (hit) selectStructure(hit.object.userData.id);
  });

  canvas.addEventListener("dblclick", () => {
    if (mode === "eye" && LAYERS[selected]) enterDetail(selected);
  });

  canvas.addEventListener("keydown", event => {
    const actions = {
      ArrowLeft: () => rotate(-.12, 0),
      ArrowRight: () => rotate(.12, 0),
      ArrowUp: () => rotate(0, -.12),
      ArrowDown: () => rotate(0, .12),
      "+": () => zoom(.82),
      "=": () => zoom(.82),
      "-": () => zoom(1.22),
      Home: () => backToEye(true),
      Escape: () => mode !== "eye" && backToEye()
    };

    if (actions[event.key]) {
      event.preventDefault();
      actions[event.key]();
    }
  });

  $("cut").onclick = () => {
    cutaway = !cutaway;
    setZoomFloor();
    controls.update();
    updateCutaway();
    buildInterface();
  };

  $("zoomIn").onclick = () => zoom(.82);
  $("zoomOut").onclick = () => zoom(1.22);
  $("reset").onclick = () => backToEye(true);
  $("back").onclick = () => backToEye();
  $("details").onclick = () => enterDetail(selected);
  $("explode").oninput = updateSeparation;
  $("showLabels").onchange = () => { dirty = true; };
  $("autoDetail").onchange = () => { dirty = true; };

  controls.addEventListener("change", () => { dirty = true; });
  controls.addEventListener("start", () => { atDefaultView = false; });

  const resizeObserver = new ResizeObserver(() => {
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    if (!width || !height) return;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    if (atDefaultView && mode === "eye" && !focused) {
      frameDefaultView();
      controls.update();
    }
    dirty = true;
  });
  resizeObserver.observe(stage);

  const intersectionObserver = new IntersectionObserver(entries => {
    visible = entries[0].isIntersecting;
    dirty = true;
  });
  intersectionObserver.observe(stage);

  document.addEventListener("visibilitychange", () => { dirty = true; });

  canvas.addEventListener("webglcontextlost", event => {
    event.preventDefault();
    $("error").hidden = false;
    $("error").textContent = text("failure");
  });

  canvas.addEventListener("webglcontextrestored", () => {
    $("error").hidden = true;
    dirty = true;
  });

  updateCutaway();
  backToEye(true);
  viewerStarted = true;
  renderer.compile(scene, camera);
  $("error").hidden = true;

  renderer.setAnimationLoop(() => {
    if (!visible || document.hidden) return;
    controls.update();
    if (!dirty) return;

    const distance = camera.position.distanceTo(controls.target);

    if (mode === "eye" &&
        focused &&
        $("autoDetail").checked &&
        LAYERS[selected] &&
        distance < 1.65) {
      enterDetail(selected);
    } else if (mode !== "eye" && distance > 9.6) {
      backToEye();
    }

    keepCameraOutsideGlobe();
    renderer.render(scene, camera);
    drawLabels();
    dirty = false;
  });
}

</script>
</body>
</html>
