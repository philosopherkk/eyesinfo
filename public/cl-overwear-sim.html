<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12151a" />
  <meta name="robots" content="noindex" />
  <title>隱鏡過戴示意 — 護眼學堂</title>
  <style>
html, body { margin: 0; padding: 0; background: #0f1217; color: #e4e4e4; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 10px 8px 16px; }
.cap { font: 13px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #9aa3b2; margin: 0 4px 10px; }
.teach { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #12151a; color: #e4e4e4; padding: 12px; border-radius: 14px; max-width: 980px; margin: auto; user-select: none; }
.teach canvas { width: 100%; display: block; border-radius: 10px; background: #000; touch-action: none; }
.teach .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 4px 2px 10px; }
.teach .seg { display: flex; border-radius: 9px; overflow: hidden; border: 1px solid #444; }
.teach .seg button, .teach .btn { background: #23272f; color: #ddd; border: 0; padding: 8px 12px; font-size: 14px; cursor: pointer; min-height: 40px; }
.teach .seg button.on { background: #f0a030; color: #111; font-weight: 700; }
.teach .btn { border: 1px solid #444; border-radius: 9px; }
.teach label { font-size: 13px; display: flex; align-items: center; gap: 6px; color: #bbb; }
.teach input[type=range] { width: 110px; accent-color: #f0a030; }
.teach .v { min-width: 42px; font-variant-numeric: tabular-nums; color: #f3c06a; }
.teach .hint { margin: 8px 2px 0; font-size: 12.5px; line-height: 1.45; color: #8b93a3; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="cap" id="page-cap"></p>
<div class="teach" id="sim">
  <div class="bar">
    <div class="seg">
      <button type="button" data-m="hypoxia" class="on" id="m-hypoxia"></button>
      <button type="button" data-m="infection" id="m-infection"></button>
    </div>
    <label><span id="lab-wear"></span> <input id="wear" type="range" min="4" max="24" step="1" value="14"><span class="v" id="wearv"></span></label>
    <button class="btn" type="button" id="play">❚❚</button>
  </div>
  <canvas id="cv" width="960" height="520"></canvas>
  <p class="hint" id="hint"></p>
</div>
  </div>
<script>
(()=>{

const I18N = {
  "zh-Hant": {
    pageCap: "教育示意 · 分開「長期缺氧不適」與「急性感染紅旗」。不是安全時數計算、不是品牌或透氧比較、不是診斷。",
    hypoxia: "慢性缺氧路徑", infection: "急性感染路徑", wear: "連續戴用示意",
    pauseAria: "暫停", playAria: "播放",
    o2: "角膜氧氣（示意）", comfort: "舒適度（示意）",
    red: "劇痛、畏光或突然視力下降 → 本站急症頁（不是預約）",
    hint: "左側：戴太耐／過夜可令角膜氧氣示意下降、不適上升（慢性路徑）。右側：急性紅旗與慢性路徑分開——嚴重疼痛、畏光或突然視力下降請看本站／urgent；本頁不訂戴用時數、不比較品牌或透氧（Dk）。",
    htmlLang: "zh-Hant",
  },
  "zh-Hans": {
    pageCap: "教育示意 · 分开「长期缺氧不适」与「急性感染红旗」。不是安全时数计算、不是品牌或透氧比较、不是诊断。",
    hypoxia: "慢性缺氧路径", infection: "急性感染路径", wear: "连续戴用示意",
    pauseAria: "暂停", playAria: "播放",
    o2: "角膜氧气（示意）", comfort: "舒适度（示意）",
    red: "剧痛、畏光或突然视力下降 → 本站急症页（不是预约）",
    hint: "左侧：戴太久／过夜可令角膜氧气示意下降、不适上升（慢性路径）。右侧：急性红旗与慢性路径分开——严重疼痛、畏光或突然视力下降请看本站／urgent；本页不定戴用时数、不比较品牌或透氧（Dk）。",
    htmlLang: "zh-CN",
  },
  en: {
    pageCap: "Education illustration · separates chronic hypoxia discomfort from acute-infection red flags. Not a safe-hours calculator, brand or oxygen-permeability (Dk) comparison, or diagnosis.",
    hypoxia: "Chronic hypoxia path", infection: "Acute infection path", wear: "Wear duration (illus.)",
    pauseAria: "Pause", playAria: "Play",
    o2: "Corneal oxygen (illus.)", comfort: "Comfort (illus.)",
    red: "Severe pain, photophobia or sudden vision drop → this site’s /urgent (not booking)",
    hint: "Left: long wear / overnight can lower illustrated oxygen and comfort (chronic path). Right: acute red flags are separate — severe pain, photophobia or sudden vision drop → /urgent only. No wear-hour prescription; no brand or Dk comparisons.",
    htmlLang: "en",
  },
  ja: {
    pageCap: "教育用図示 · 「慢性の低酸素による不快」と「急性感染の赤旗」を分けます。安全装着時間の計算、ブランドや酸素透過（Dk）比較、診断ではありません。",
    hypoxia: "慢性低酸素の経路", infection: "急性感染の経路", wear: "連続装用（示意）",
    pauseAria: "一時停止", playAria: "再生",
    o2: "角膜の酸素（示意）", comfort: "快適さ（示意）",
    red: "強い痛み・羞明・突然の視力低下 → 本サイトの／urgent（予約ではない）",
    hint: "左：長く装用／夜間装用は酸素と快適さの示意を下げ得ます（慢性）。右：急性の赤旗は別経路——強い痛み・羞明・突然の視力低下は／urgentのみ。装用時間の処方なし、ブランドやDk比較なし。",
    htmlLang: "ja",
  },
};

const normalizeLang = (raw) => {
  const v = (raw || "").trim();
  if (v === "zh" || v === "zh-Hant" || v === "zh-hant") return "zh-Hant";
  if (v === "zh-Hans" || v === "zh-hans" || v === "zh-CN" || v === "zh-cn") return "zh-Hans";
  if (v === "ja" || v === "jp") return "ja";
  if (v === "en") return "en";
  return "zh-Hant";
};
let uiLang = normalizeLang(new URLSearchParams(location.search).get("lang"));
let T = I18N[uiLang];
const $ = (id) => document.getElementById(id);
function applyLang(lang) {
  uiLang = normalizeLang(lang);
  T = I18N[uiLang];
  document.documentElement.lang = T.htmlLang;
  const cap = $("page-cap");
  if (cap) cap.textContent = T.pageCap;
  if (typeof onLang === "function") onLang();
}

const S = { mode: "hypoxia", wear: 14, play: true };
const cv = $("cv"), ctx = cv.getContext("2d");
const W = 960, H = 520;
function onLang(){
  $("m-hypoxia").textContent = T.hypoxia;
  $("m-infection").textContent = T.infection;
  $("lab-wear").textContent = T.wear;
  $("hint").textContent = T.hint;
  document.querySelectorAll("[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === S.mode));
  $("play").setAttribute("aria-label", S.play ? T.pauseAria : T.playAria);
  $("play").textContent = S.play ? "❚❚" : "▶";
  sync();
}
function sync(){
  const u = uiLang === "en" ? " h" : uiLang === "ja" ? " 時間" : " 小時";
  $("wearv").textContent = S.wear + u;
}
document.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => { S.mode = b.dataset.m; onLang(); }));
$("wear").addEventListener("input", e => { S.wear = +e.target.value; sync(); });
$("play").addEventListener("click", () => { S.play = !S.play; onLang(); });
let t0 = performance.now();
function draw(now){
  if (S.play && S.mode === "hypoxia") {
    S.wear = 8 + 10 * (0.5 + 0.5 * Math.sin((now - t0) / 2200));
    $("wear").value = String(Math.round(S.wear));
    sync();
  }
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#0b0d11"; ctx.fillRect(0,0,W,H);
  // cornea + lens schematic
  const cx = 280, cy = 240;
  ctx.strokeStyle = "#7ec8e3"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, cy, 120, 70, 0, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = "rgba(120,180,220,0.15)";
  ctx.beginPath(); ctx.ellipse(cx, cy, 118, 68, 0, 0, Math.PI*2); ctx.fill();
  // contact lens arc
  ctx.strokeStyle = "#f0a030"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(cx - 10, cy, 95, 55, 0, -1.1, 1.1); ctx.stroke();
  const load = Math.min(1, Math.max(0, (S.wear - 6) / 16));
  // oxygen bubbles fading with wear
  const o2 = 1 - load * 0.75;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + now / 900;
    ctx.globalAlpha = 0.15 + o2 * 0.55;
    ctx.fillStyle = "#7eb6ff";
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * 55, cy + Math.sin(a) * 32, 4 + o2 * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // meters
  meter(40, 420, 240, o2, T.o2, "#7eb6ff");
  meter(300, 420, 240, 1 - load * 0.8, T.comfort, "#6ecf8e");
  // right panel: mode story
  ctx.fillStyle = "#1a1f28";
  round(560, 60, 360, 320, 12); ctx.fill();
  ctx.fillStyle = "#e4e4e4"; ctx.font = "15px system-ui"; ctx.textAlign = "left";
  if (S.mode === "hypoxia") {
    wrap(T.hypoxia, 580, 100, 320, 22);
    wrap(T.hint.split(uiLang === "en" ? ". Right:" : "。")[0] + (uiLang === "en" ? "." : "。"), 580, 140, 320, 20);
  } else {
    ctx.fillStyle = "#e07070";
    wrap(T.infection, 580, 100, 320, 22);
    ctx.fillStyle = "#e4e4e4";
    wrap(T.red, 580, 150, 320, 22);
  }
  requestAnimationFrame(draw);
}
function meter(x,y,w,frac,label,col){
  ctx.fillStyle = "#1a1f28"; round(x,y,w,48,8); ctx.fill();
  ctx.fillStyle = col; round(x+4,y+22, Math.max(4,(w-8)*Math.min(1,Math.max(0,frac))), 18, 5); ctx.fill();
  ctx.fillStyle = "#c8cdd6"; ctx.font = "12px system-ui"; ctx.textAlign = "left";
  ctx.fillText(label, x+8, y+16);
}
function round(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrap(text,x,y,maxW,lh){
  const words = text.split(/(?<=[。．、，,\s])/);
  let line = "", yy = y;
  ctx.font = "13px system-ui";
  for (const w of words) {
    const test = line + w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); yy += lh; line = w; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
}
applyLang(uiLang);
requestAnimationFrame(draw);

})();
</script>
</body>
</html>
