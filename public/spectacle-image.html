<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>鏡片所見畫面示意 — 護眼學堂</title>
  <style>
    html, body { margin: 0; padding: 0; background: #101318; color: #e8eaee; overflow-x: hidden; }
    #sim {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; flex-direction: column;
      max-width: 1040px; margin: 0 auto; padding: 12px 12px 20px;
      box-sizing: border-box;
    }
    #pageCap { order: -1; }
    .stage { order: 0; }
    .controls { order: 1; }
    .cap { font-size: 13px; line-height: 1.5; color: #9aa3b2; margin: 0 0 8px; }
    .lab { font-size: 13px; font-weight: 700; color: #f3c06a; margin: 0; }
    .note, .hint, .capmode { font-size: 13px; line-height: 1.5; color: #c5ceda; margin: 6px 0; }
    .hint { color: #8b95a3; margin: 4px 0; }
    .controls, .stage, .seg, .row, .field { min-width: 0; max-width: 100%; }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .seg button, .chk {
      background: #23272f; color: #e6e6e6; border: 1px solid #3a404a; border-radius: 999px;
      min-height: 44px; padding: 8px 14px; font-size: 14px; cursor: pointer;
      max-width: 100%; overflow-wrap: anywhere; box-sizing: border-box;
    }
    .seg button.on { background: #f0a030; color: #1a1206; font-weight: 700; border-color: #f0a030; }
    .seg button:disabled { opacity: 0.4; cursor: not-allowed; }
    .chk { display: flex; align-items: center; gap: 8px; border-radius: 12px; }
    .chk input { width: 18px; height: 18px; accent-color: #f0a030; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .panel {
      margin-top: 12px; padding: 12px 12px 8px; border-radius: 16px;
      background: #171b22; border: 1px solid #2c323c;
    }
    .field { margin: 12px 0 4px; }
    .field-top, .ends { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .live { font-size: 13px; font-weight: 700; color: #fff; }
    .ends { font-size: 12px; color: #8b95a3; margin-top: 2px; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 44px; margin: 4px 0 0; background: transparent; cursor: pointer;
    }
    input[type="range"]:focus-visible { outline: 2px solid #f0a030; outline-offset: 2px; }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px; border-radius: 999px;
      background: linear-gradient(90deg, #7eb6e6 0%, #d7dde6 50%, #e7b15a 100%);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 26px; height: 26px; margin-top: -9px; border-radius: 50%;
      background: #fff; border: 3px solid #1a1206; box-shadow: 0 1px 4px rgba(0,0,0,.45);
    }
    #rng-cyl::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, #3a404a, #f0a030);
    }
    canvas {
      width: 100%; max-width: 100%; height: auto; display: block;
      border-radius: 16px; background: #0e1218; margin-top: 4px;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="sim">
    <p class="cap" id="pageCap"></p>
    <div class="controls">
    <p class="lab" id="lab-compare"></p>
    <div class="seg" id="grp-mode" role="group"></div>

    <div class="panel">
    <p class="lab" id="lab-rx"></p>
    <p class="note" id="rxNote"></p>
    <div class="field">
      <div class="field-top">
        <span class="lab" id="lab-sphere"></span>
        <span class="live" id="sphereLive"></span>
      </div>
      <input id="rng-sphere" type="range" min="0" max="200" step="1" value="40" />
      <div class="ends"><span id="end-plus"></span><span id="end-plano"></span><span id="end-minus"></span></div>
    </div>
    <div class="field">
      <div class="field-top">
        <span class="lab" id="lab-cyl"></span>
        <span class="live" id="cylLive"></span>
      </div>
      <input id="rng-cyl" type="range" min="0" max="100" step="1" value="0" />
      <div class="ends"><span id="end-cyl0"></span><span id="end-cyl1"></span></div>
    </div>
    <div class="row">
      <span class="lab" id="lab-mer"></span>
      <div class="seg" id="grp-mer" role="group"></div>
    </div>
    <div class="row">
      <span class="lab" id="lab-add"></span>
      <div class="seg" id="grp-add" role="group"></div>
    </div>
    </div>

    <p class="lab" id="lab-show"></p>
    <div class="row">
      <label class="chk"><input type="checkbox" id="chk-zone" checked /> <span id="lab-zone"></span></label>
      <label class="chk"><input type="checkbox" id="chk-out" checked /> <span id="lab-out"></span></label>
    </div>
    <div id="hints"></div>
    </div>

    <div class="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <p class="capmode" id="modeCap"></p>
    <p class="note" id="noFixed" hidden></p>
    </div>
  </div>

    if (v === "zh-Hans" || v === "zh-hans" || v === "zh-CN" || v === "zh-cn") return "zh-Hans";
    if (v === "ja" || v === "jp") return "ja";
    if (v === "en") return "en";
    return "zh-Hant";
  };

  let uiLang = normalizeLang(new URLSearchParams(location.search).get("lang"));
  let T = I18N[uiLang];

  const VW = 960, VH = 540, SW = 1400, SH = 788, PAD = 240, SCENE_H = SH + PAD;
  const ZX = VW / 2, ZY = VH * 0.5, ZRX = 250, ZRY = 230;
  const LVL = { none: 0, light: 1, mid: 2, high: 3 };
  const SPEC = { sv: 1, prog: 1, specCyl: 1 };

  const S = {
    mode: "sv",
    sphere: 40,
    cyl: 0,
    mer: "h",
    add: "mid",
    zone: true,
    outside: true,
  };

  const $ = (id) => document.getElementById(id);
  const cv = $("cv");
  const fx = cv.getContext("2d");
  const mk = (w, h) => {
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    return c;
  };
  const hasFilter = (() => {
    const c = mk(4, 4).getContext("2d");
    if (!c || !("filter" in c)) return false;
    c.filter = "blur(2px)";
    return c.filter === "blur(2px)";
  })();

  const photo = new Image();
  let photoReady = false;
  const blurCache = new Map();
  const pixelCache = new WeakMap();
  function drawFar(ctx) {
    ctx.fillStyle = "#243246";
    ctx.fillRect(0, 0, SW, SH);
    if (!photoReady) return;
    const ir = photo.naturalWidth / photo.naturalHeight;
    const cr = SW / SH;
    let dw = SW;
    let dh = SH;
    let dx = 0;
    let dy = 0;
    if (ir > cr) {
      dh = SH;
      dw = SH * ir;
      dx = (SW - dw) / 2;
    } else {
      dw = SW;
      dh = SW / ir;
      dy = (SH - dh) * 0.35;
    }
    ctx.drawImage(photo, dx, dy, dw, dh);
  }

  function extendFar(canvas) {
    const band = 72;
    const tmp = mk(SW, PAD);
    const tx = tmp.getContext("2d");
    tx.save();
    tx.translate(0, PAD);
    tx.scale(1, -1);
    tx.drawImage(canvas, 0, SH - band, SW, band, 0, 0, SW, PAD);
    tx.restore();
    canvas.getContext("2d").drawImage(tmp, 0, SH);
  }

  const far0 = mk(SW, SCENE_H);
  drawFar(far0.getContext("2d"));
  extendFar(far0);
  photo.onload = () => {
    photoReady = true;
    blurCache.clear();
    pixelCache.delete(far0);
    drawFar(far0.getContext("2d"));
    extendFar(far0);
    if (typeof render === "function") render();
  };
  photo.src = "spectacle-ridge.jpg";

  function blurOf(src, r) {
    if (r <= 0) return src;
    const c = mk(src.width, src.height);
    const x = c.getContext("2d");
    if (hasFilter) {
      x.filter = "blur(" + r + "px)";
      x.drawImage(src, 0, 0);
      x.filter = "none";
      return c;
    }
    const n = 5;
    x.globalAlpha = 1 / n;
    for (let i = 0; i < n; i++) {
      const t = (i - (n - 1) / 2) * r * 0.35;
      x.drawImage(src, t, 0);
      x.drawImage(src, 0, t);
    }
    return c;
  }

  function blurred(src, r) {
    const q = Math.max(0, Math.round(r * 2) / 2);
    if (q <= 0) return src;
    const key = "f" + q;
    const hit = blurCache.get(key);
    if (hit) return hit;
    const made = blurOf(src, q);
    blurCache.set(key, made);
    return made;
  }

  function photoOf(level) {
    const rad = [0, 6, 12, 20];
    const idx = Math.max(0, Math.min(3, level | 0));
    return blurred(far0, rad[idx] || 0);
  }

  function layers(farR) {
    const c = mk(SW, SCENE_H);
    const x = c.getContext("2d");
    x.drawImage(blurred(far0, farR), 0, 0);
    return c;
  }

  function smear(src, angle, dist) {
    if (dist <= 0) return src;
    const c = mk(src.width, src.height);
    const x = c.getContext("2d");
    const steps = 7;
    x.globalAlpha = 1 / steps;
    for (let i = 0; i < steps; i++) {
      const t = (i / (steps - 1) - 0.5) * dist;
      x.drawImage(src, Math.cos(angle) * t, Math.sin(angle) * t);
    }
    return c;
  }

  function srcPixels(src) {
    const hit = pixelCache.get(src);
    if (hit) return hit;
    const img = src.getContext("2d").getImageData(0, 0, src.width, src.height);
    pixelCache.set(src, img);
    return img;
  }

  function blitMag(ctx, src, mag, pinch, lookX, lookY) {
    const srcCx = SW / 2 + (lookX || 0);
    const srcCy = SH / 2 + (lookY || 0);
    const safeMag = mag > 0.2 ? mag : 0.2;
    if (Math.abs(pinch) < 0.015) {
      const sw = VW / safeMag;
      const sh = VH / safeMag;
      ctx.drawImage(src, srcCx - sw / 2, srcCy - sh / 2, sw, sh, 0, 0, VW, VH);
      return;
    }
    const simg = srcPixels(src);
    const sd = simg.data;
    const sw = src.width;
    const shh = src.height;
    const out = ctx.createImageData(VW, VH);
    const od = out.data;
    const viewCx = VW / 2;
    const viewCy = VH / 2;
    const maxX = sw - 1.001;
    const maxY = shh - 1.001;
    for (let y = 0; y < VH; y++) {
      const ny = (y - ZY) / ZRY;
      const ny2 = ny * ny;
      const row = y * VW;
      for (let x = 0; x < VW; x++) {
        const nx = (x - ZX) / ZRX;
        const r2 = nx * nx + ny2;
        // pinch > 0 pincushion (plus / hyperopia): magnification grows toward the edge, lines bow inward.
        // pinch < 0 barrel (minus / myopia): magnification falls toward the edge, lines bow outward.
        let radial = 1 - pinch * r2;
        if (radial < 0.34) radial = 0.34;
        if (radial > 2.6) radial = 2.6;
        const ox = (x - viewCx) / safeMag;
        const oy = (y - viewCy) / safeMag;
        let sx = srcCx + ox * radial;
        let sy = srcCy + oy * radial;
        if (sy < 0) sy = Math.min(-sy, 200);
        if (sx < 0) sx = 0;
        else if (sx > maxX) sx = maxX;
        if (sy > maxY) sy = maxY;
        const x0 = sx | 0;
        const y0 = sy | 0;
        const fx = sx - x0;
        const fy = sy - y0;
        const i00 = (y0 * sw + x0) * 4;
        const i10 = i00 + 4;
        const i01 = i00 + sw * 4;
        const i11 = i01 + 4;
        const w00 = (1 - fx) * (1 - fy);
        const w10 = fx * (1 - fy);
        const w01 = (1 - fx) * fy;
        const w11 = fx * fy;
        const di = (row + x) * 4;
        od[di] = sd[i00] * w00 + sd[i10] * w10 + sd[i01] * w01 + sd[i11] * w11;
        od[di + 1] = sd[i00 + 1] * w00 + sd[i10 + 1] * w10 + sd[i01 + 1] * w01 + sd[i11 + 1] * w11;
        od[di + 2] = sd[i00 + 2] * w00 + sd[i10 + 2] * w10 + sd[i01 + 2] * w01 + sd[i11 + 2] * w11;
        od[di + 3] = 255;
      }
    }
    ctx.putImageData(out, 0, 0);
  }

  function makePlate(scene, mag, pinch, angle, stretchAmt, shx, shy, lookX, lookY) {
    const v = mk(VW, VH);
    blitMag(v.getContext("2d"), scene, mag, pinch, lookX, lookY);
    let out = v;
    if (stretchAmt) {
      const c = mk(VW, VH);
      const x = c.getContext("2d");
      x.translate(VW / 2, VH / 2);
      x.rotate(angle);
      x.scale(1 + stretchAmt, 1);
      x.rotate(-angle);
      x.drawImage(v, -VW / 2, -VH / 2);
      out = c;
    }
    if (shx || shy) {
      const c = mk(VW, VH);
      const x = c.getContext("2d");
      x.translate(VW / 2, VH / 2);
      x.transform(1, shy, shx, 1, 0, 0);
      x.drawImage(out, -VW / 2, -VH / 2);
      out = c;
    }
    return out;
  }

  function zonePath(ctx, inset) {
    ctx.beginPath();
    ctx.ellipse(ZX, ZY, Math.max(8, ZRX - inset), Math.max(8, ZRY - inset), 0, 0, Math.PI * 2);
  }

  function isSpec() { return !!SPEC[S.mode]; }
  function sphereState() {
    const delta = S.sphere - 100;
    const sign = delta < -1 ? "plus" : delta > 1 ? "minus" : "plano";
    const amt = Math.min(1, Math.abs(delta) / 100);
    return { sign, amt };
  }
  function cylAmt() { return Math.min(1, Math.max(0, S.cyl) / 100); }
  function merAngle() {
    if (S.mer === "v") return Math.PI / 2;
    if (S.mer === "o") return Math.PI / 4;
    return 0;
  }

  function optics() {
    const { sign, amt } = sphereState();
    const cA = cylAmt();
    const ang = merAngle();
    const cylPx = cA * 36;
    const mag = sign === "plus" ? 1 + 0.18 * amt : sign === "minus" ? 1 - 0.14 * amt : 1;
    const bend = amt * amt;
    const pinch = sign === "plus" ? 0.3 * bend : sign === "minus" ? -0.9 * bend : 0;
    let farR = 0;
    if (sign === "minus") farR = 22 * amt;
    else if (sign === "plus") farR = 12 * Math.max(0, amt - 0.2);
    const uncorr = smear(layers(farR), ang, cylPx);
    const residual = smear(layers(0), ang, cylPx);
    const sharp = layers(0);
    return { sign, amt, cA, ang, cylPx, mag, pinch, uncorr, residual, sharp };
  }

  function paintZone(plate, inset) {
    fx.save();
    zonePath(fx, inset);
    fx.clip();
    fx.drawImage(plate, 0, 0);
    fx.restore();
  }

  function paintSoft(plate, inset, drawMask) {
    const layer = mk(VW, VH);
    const lx = layer.getContext("2d");
    lx.drawImage(plate, 0, 0);
    lx.globalCompositeOperation = "destination-in";
    drawMask(lx);
    fx.save();
    zonePath(fx, inset);
    fx.clip();
    fx.drawImage(layer, 0, 0);
    fx.restore();
  }

  function fillSoft(ctx, blurPx, drawPath) {
    ctx.save();
    if (hasFilter) ctx.filter = "blur(" + blurPx + "px)";
    ctx.fillStyle = "#fff";
    drawPath(ctx);
    ctx.fill();
    ctx.restore();
    if (hasFilter) return;
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.translate(ZX, ZY);
    ctx.scale(1.16, 1.12);
    ctx.translate(-ZX, -ZY);
    ctx.fillStyle = "#fff";
    drawPath(ctx);
    ctx.fill();
    ctx.restore();
  }

  function maskDistance(ctx) {
    fillSoft(ctx, 18, (c) => {
      c.beginPath();
      c.ellipse(ZX, ZY - ZRY * 0.34, ZRX * 0.52, ZRY * 0.42, 0, 0, Math.PI * 2);
    });
  }

  function maskCorridor(ctx) {
    fillSoft(ctx, 13, (c) => {
      const y0 = ZY - ZRY * 0.28;
      const y1 = ZY + ZRY * 0.02;
      const y2 = ZY + ZRY * 0.88;
      const w0 = ZRX * 0.065;
      const w1 = ZRX * 0.11;
      const w2 = ZRX * 0.4;
      c.beginPath();
      c.moveTo(ZX - w0, y0);
      c.quadraticCurveTo(ZX - w1, y1, ZX - w2, y2);
      c.lineTo(ZX + w2, y2);
      c.quadraticCurveTo(ZX + w1, y1, ZX + w0, y0);
      c.closePath();
    });
  }

  function label(text, x, y) {
    fx.font = "600 15px system-ui, sans-serif";
    fx.textAlign = "center";
    fx.textBaseline = "middle";
    fx.lineWidth = 4;
    fx.strokeStyle = "rgba(0,0,0,.7)";
    fx.fillStyle = "#fff";
    fx.strokeText(text, x, y);
    fx.fillText(text, x, y);
  }

  function draw() {
    const o = optics();
    const spec = isSpec();
    const gap = S.mode === "sv" && o.sign === "plus" && o.amt > 0.72;
    const inset = gap ? 8 : 0;
    fx.setTransform(1, 0, 0, 1, 0, 0);
    fx.clearRect(0, 0, VW, VH);

    if (!spec) {
      if (S.mode === "clPlain") {
        fx.drawImage(makePlate(o.uncorr, 1, 0, 0, 0, 0, 0), 0, 0);
      } else if (S.mode === "clCyl") {
        const stretch = o.cA > 0.66 ? 0.035 : 0;
        fx.drawImage(makePlate(o.sharp, 1, 0, o.ang, stretch, 0, 0), 0, 0);
      } else {
        fx.drawImage(makePlate(o.residual, 1, 0, 0, 0, 0, 0), 0, 0);
      }
    } else {
      const outside = makePlate(o.uncorr, 1, 0, 0, 0, 0, 0);
      fx.save();
      if (gap) {
        fx.beginPath();
        fx.rect(0, 0, VW, VH);
        fx.ellipse(ZX, ZY, ZRX + 16, ZRY + 16, 0, 0, Math.PI * 2);
        fx.clip("evenodd");
      }
      if (S.outside) fx.drawImage(outside, 0, 0);
      else {
        fx.fillStyle = "#14181e";
        fx.fillRect(0, 0, VW, VH);
      }
      fx.restore();
      if (!S.outside) {
        fx.save();
        zonePath(fx, -2);
        fx.strokeStyle = "#3a414c";
        fx.lineWidth = 16;
        fx.stroke();
        fx.restore();
      }
      if (gap) {
        fx.save();
        fx.beginPath();
        fx.ellipse(ZX, ZY, ZRX + 16, ZRY + 16, 0, 0, Math.PI * 2);
        fx.ellipse(ZX, ZY, ZRX - inset, ZRY - inset, 0, 0, Math.PI * 2);
        fx.fillStyle = "rgba(58, 46, 30, 0.94)";
        fx.fill("evenodd");
        fx.restore();
      }

      const stretch = S.mode === "specCyl" ? 0.13 * o.cA : 0;
      const svScene = S.mode === "specCyl" ? o.sharp : o.residual;
      const sv = makePlate(svScene, o.mag, o.pinch, o.ang, stretch, 0, 0);
      const prog = S.mode === "prog" && LVL[S.add] > 0;

      if (!prog) {
        paintZone(sv, inset);
      } else {
        const aL = LVL[S.add];
        const peri = [0, 2, 3, 3][aL];
        const swim = [0, 0.02, 0.04, 0.06][aL];
        const around = makePlate(photoOf(Math.min(3, peri)), o.mag, o.pinch, 0, 0, swim, 0, 0, 0);
        paintZone(around, inset);
        paintSoft(sv, inset, maskCorridor);
        paintSoft(sv, inset, maskDistance);
      }

      if (S.zone) {
        fx.save();
        zonePath(fx, inset);
        fx.strokeStyle = "rgba(240,160,48,.95)";
        fx.lineWidth = 2.5;
        fx.stroke();
        fx.restore();
        label(T.zone, ZX, Math.max(16, ZY - ZRY - 16));
        if (S.outside) label(T.zoneOut, 70, ZY);
        if (gap) label(T.zoneGap, ZX + ZRX + 8, ZY + ZRY * 0.72);
      }
    }
  }

  function sphereWords() {
    const { sign, amt } = sphereState();
    if (sign === "plano" || amt < 0.06) return T.plano;
    const side = sign === "plus" ? T.signPlus : T.signMinus;
    const band = amt < 0.34 ? T.amtLight : amt < 0.67 ? T.amtMid : T.amtHigh;
    return band + " " + side;
  }
  function cylWords() {
    const a = cylAmt();
    if (a < 0.04) return T.amtNone;
    if (a < 0.34) return T.amtLight;
    if (a < 0.67) return T.amtMid;
    return T.amtHigh;
  }

  function captionText() {
    const { sign, amt } = sphereState();
    const quiet = amt < 0.04 && cylAmt() < 0.04 && !(S.mode === "prog" && LVL[S.add] > 0);
    if (quiet) return T.zeroState;
    const map = {
      sv: sign === "minus" ? T.capMyope : T.capHyper,
      prog: T.capProg, specCyl: T.capSpecCyl,
      cl: T.capCl, clCyl: T.capClCyl, clPlain: T.capClPlain,
    };
    let text = map[S.mode] || "";
    if (S.mode === "sv" && sign === "plus" && amt > 0.72) text += " " + T.capHyperGap;
    if (S.mode === "clCyl" && cylAmt() < 0.04) text += " " + T.capClSame;
    return text;
  }

  function fillSeg(id, key, options) {
    const host = $(id);
    host.setAttribute("aria-label", T[key] || "");
    host.replaceChildren();
    options.forEach(([value, labelKey]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.k = key === "groupCompare" ? "mode" : host.dataset.k;
      b.dataset.v = value;
      b.textContent = T[labelKey];
      host.appendChild(b);
    });
  }

  function buildControls() {
    $("grp-mode").dataset.k = "mode";
    $("grp-mer").dataset.k = "mer";
    $("grp-add").dataset.k = "add";
    fillSeg("grp-mode", "groupCompare", [
      ["sv", "modeSv"], ["prog", "modeProg"], ["specCyl", "modeSpecCyl"],
      ["cl", "modeCl"], ["clCyl", "modeClCyl"], ["clPlain", "modeClPlain"],
    ]);
    fillSeg("grp-mer", "meridian", [["h", "merH"], ["o", "merO"], ["v", "merV"]]);
    fillSeg("grp-add", "addAmt", [["none", "amtNone"], ["light", "amtLight"], ["mid", "amtMid"], ["high", "amtHigh"]]);
    $("pageCap").textContent = T.pageCap;
    $("lab-compare").textContent = T.groupCompare;
    $("lab-rx").textContent = T.groupRx;
    $("rxNote").textContent = T.rxNote;
    $("lab-sphere").textContent = T.sphereAmt;
    $("end-plus").textContent = T.signPlus;
    $("end-plano").textContent = T.plano;
    $("end-minus").textContent = T.signMinus;
    $("end-cyl0").textContent = T.amtNone;
    $("end-cyl1").textContent = T.amtHigh;
    $("rng-sphere").setAttribute("aria-label", T.sphereAmt);
    $("rng-cyl").setAttribute("aria-label", T.cylAmt);
    $("lab-cyl").textContent = T.cylAmt;
    $("lab-mer").textContent = T.meridian;
    $("lab-add").textContent = T.addAmt;
    $("lab-show").textContent = T.groupShow;
    $("lab-zone").textContent = T.showZone;
    $("lab-out").textContent = T.showOutside;
    document.documentElement.lang = T.htmlLang;
    document.title = T.title;
  }

  function syncUi() {
    const spec = isSpec();
    document.querySelectorAll("#sim button[data-k]").forEach((b) => {
      const k = b.dataset.k;
      const v = b.dataset.v;
      const on = S[k] === v;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      let disabled = false;
      if (k === "mer") disabled = cylAmt() < 0.04;
      if (k === "add") disabled = S.mode !== "prog";
      b.disabled = disabled;
    });
    $("rng-sphere").value = String(S.sphere);
    $("rng-cyl").value = String(S.cyl);
    $("sphereLive").textContent = sphereWords();
    $("cylLive").textContent = cylWords();
    $("chk-zone").checked = S.zone;
    $("chk-out").checked = S.outside;
    $("chk-out").disabled = !spec;
    const hints = [];
    if (cylAmt() < 0.04) hints.push(T.hintMeridian);
    if (S.mode !== "prog") hints.push(T.hintAdd);
    if (!spec) hints.push(T.hintOutside);
    $("hints").replaceChildren();
    hints.forEach((text) => {
      const p = document.createElement("p");
      p.className = "hint";
      p.textContent = text;
      $("hints").appendChild(p);
    });
    $("modeCap").textContent = captionText();
    const showFixed = !spec && S.zone;
    $("noFixed").hidden = !showFixed;
    $("noFixed").textContent = T.noFixedZone;
  }

  function render() {
    draw();
    syncUi();
    reportHeight();
  }

  $("sim").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-k]");
    if (!b || b.disabled) return;
    S[b.dataset.k] = b.dataset.v;
    render();
  });
  $("rng-sphere").addEventListener("input", (ev) => { S.sphere = Number(ev.target.value); render(); });
  $("rng-cyl").addEventListener("input", (ev) => { S.cyl = Number(ev.target.value); render(); });
  $("chk-zone").addEventListener("change", (ev) => { S.zone = ev.target.checked; render(); });
  $("chk-out").addEventListener("change", (ev) => { S.outside = ev.target.checked; render(); });

  function reportHeight() {
    const h = Math.ceil($("sim").getBoundingClientRect().height || 900);
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "eyesinfo-spectacle-image-height", height: h }, "*");
    }
  }
  window.addEventListener("load", reportHeight);
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(reportHeight).observe($("sim"));

  buildControls();
  render();
})();
  </script>
</body>
</html>
