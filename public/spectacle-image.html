  <style>
    html, body { margin: 0; padding: 0; background: #12151a; color: #e4e4e4; overflow-x: hidden; }
    #sim {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; flex-direction: column;
      max-width: 980px; margin: 0 auto; padding: 12px;
      box-sizing: border-box;
    }
    .cap { font-size: 13px; line-height: 1.5; color: #9aa3b2; margin: 0 0 10px; }
    .lab { font-size: 13px; font-weight: 700; color: #f3c06a; margin: 12px 0 6px; }
    .note, .hint, .capmode, .scale { font-size: 13px; line-height: 1.5; color: #c5ceda; margin: 6px 0; }
    .hint { color: #9aa3b2; }
    .controls, .stage, .seg, .row { min-width: 0; max-width: 100%; }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; }
    .seg button, .chk {
      background: #23272f; color: #ddd; border: 1px solid #444; border-radius: 9px;
      min-height: 44px; padding: 8px 12px; font-size: 14px; cursor: pointer;
      max-width: 100%; overflow-wrap: anywhere; box-sizing: border-box;
    }
    .seg button.on { background: #f0a030; color: #111; font-weight: 700; border-color: #f0a030; }
    .seg button:disabled { opacity: 0.45; cursor: not-allowed; }
    .chk { display: flex; align-items: center; gap: 8px; }
    .chk input { width: 18px; height: 18px; accent-color: #f0a030; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    canvas { width: 100%; max-width: 100%; height: auto; display: block; border-radius: 10px; background: #0e1218; margin-top: 10px; }
    [hidden] { display: none !important; }
    /* Wide layout: controls, then the scene. Phone: scene first so it is not below a clipped frame. */
    .controls { order: 1; }
    .stage { order: 2; }
    @media (max-width: 719px) {
      #pageCap { order: -1; }
      .stage { order: 0; }
      .controls { order: 1; }
      canvas { margin-top: 0; }
    }
  </style>
</head>

    g.addColorStop(0.5, "#d5e4ef");
    g.addColorStop(1, "#b7b3a6");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SW, SH);
    ctx.fillStyle = "#7d8a84";
    ctx.beginPath();
    ctx.moveTo(0, SH);
    ctx.lineTo(SW * 0.42, SH * 0.62);
    ctx.lineTo(SW * 0.58, SH * 0.62);
    ctx.lineTo(SW, SH);
    ctx.fill();
    ctx.strokeStyle = "#f4ecd4";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(SW / 2, SH * 0.62);
    ctx.lineTo(SW / 2, SH);
    ctx.stroke();
    const blocks = [
      [16, 180, 170, 340],
      [210, 140, 210, 390],
      [450, 170, 180, 360],
      [860, 130, 230, 400],
      [1120, 175, 160, 350],
      [1280, 150, 100, 370],
    ];
    blocks.forEach((b, i) => {
      ctx.fillStyle = i % 2 ? "#4e5e6d" : "#3d4b59";
      ctx.fillRect(b[0], b[1], b[2], b[3]);
      ctx.strokeStyle = "rgba(255,255,255,.4)";
      ctx.lineWidth = 3;
      ctx.strokeRect(b[0] + 8, b[1] + 8, b[2] - 16, b[3] - 16);
      ctx.fillStyle = "#d7e7f2";
      for (let y = b[1] + 22; y < b[1] + b[3] - 16; y += 34) {
        for (let x = b[0] + 16; x < b[0] + b[2] - 16; x += 30) {
          ctx.fillRect(x, y, 14, 18);
        }
      }
    });
    const sx = SW / 2 - 130;
    const sy = 230;
    ctx.fillStyle = "#f3e2b2";
    ctx.fillRect(sx, sy, 260, 120);
    ctx.strokeStyle = "#1c2430";
    ctx.lineWidth = 6;
    ctx.strokeRect(sx + 10, sy + 10, 240, 100);
    ctx.fillStyle = "#1c2430";
    ctx.font = "700 68px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("街", SW / 2 + 16, sy + 62);
    ctx.beginPath();
    ctx.arc(sx + 40, sy + 40, 16, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawMid(ctx) {
    const x = SW / 2 - 80;
    const y = 370;
    const w = 160;
    const h = 250;
    ctx.fillStyle = "#6b4423";
    ctx.fillRect(x - 18, y - 12, w + 36, h + 16);
    ctx.fillStyle = "#24180f";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#ead7b4";
    ctx.lineWidth = 8;
    ctx.strokeRect(x + 16, y + 16, w - 32, h - 32);
    ctx.beginPath();
    ctx.moveTo(SW / 2, y + 16);
    ctx.lineTo(SW / 2, y + h - 16);
    ctx.stroke();
  }

  function drawNear(ctx) {
    const x = SW / 2 - 170;
    const y = 468;
    const w = 340;
    const h = 120;
    ctx.fillStyle = "#f7f4ee";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 4;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = "#222";
    for (let i = 0; i < 4; i++) ctx.fillRect(x + 22, y + 20 + i * 24, w - 80, 8);
    ctx.beginPath();
    ctx.arc(x + w - 36, y + 36, 16, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillRect(x + w - 42, y + 62, 8, 42);
  }

  const far0 = mk(SW, SH);
  const mid0 = mk(SW, SH);
  const near0 = mk(SW, SH);
  drawFar(far0.getContext("2d"));
  drawMid(mid0.getContext("2d"));
  drawNear(near0.getContext("2d"));

  function blurOf(src, r) {
    if (r <= 0) return src;
    const c = mk(src.width, src.height);
    const x = c.getContext("2d");
    if (hasFilter) {
      x.filter = "blur(" + r + "px)";
      x.drawImage(src, 0, 0);
      x.filter = "none";
      return c;
    }
    const n = 5;
    x.globalAlpha = 1 / n;
    for (let i = 0; i < n; i++) {
      const t = (i - (n - 1) / 2) * r * 0.35;
      x.drawImage(src, t, 0);
      x.drawImage(src, 0, t);
    }
    return c;
  }

  const radii = [0, 5, 11, 18];
  const farB = radii.map((r) => blurOf(far0, r));
  const midB = radii.map((r) => blurOf(mid0, r));
  const nearB = radii.map((r) => blurOf(near0, r));

  function stack(fi, mi, ni) {
    const c = mk(SW, SH);
    const x = c.getContext("2d");
    x.drawImage(farB[fi], 0, 0);
    x.drawImage(midB[mi], 0, 0);
    x.drawImage(nearB[ni], 0, 0);
    return c;
  }

  function smear(src, angle, dist) {
    if (dist <= 0) return src;
    const c = mk(src.width, src.height);
    const x = c.getContext("2d");
    const steps = 7;
    x.globalAlpha = 1 / steps;
    for (let i = 0; i < steps; i++) {
      const t = (i / (steps - 1) - 0.5) * dist;
      x.drawImage(src, Math.cos(angle) * t, Math.sin(angle) * t);
    }
    return c;
  }

  function blitMag(ctx, src, mag, pinch) {
    const strips = 84;
    const sampleH = VH / mag;
    const sampleW = VW / mag;
    const oy = (SH - sampleH) / 2;
    const ox = (SW - sampleW) / 2;
    for (let i = 0; i < strips; i++) {
      const y0 = (i / strips) * VH;
      const y1 = ((i + 1) / strips) * VH;
      const mid = (y0 + y1) / 2;
      const ny = (mid - VH / 2) / (VH / 2);
      const e = ny * ny;
      let frac = 1;
      if (pinch > 0) frac = 1 - pinch * e;
      else if (pinch < 0) frac = 1 - (-pinch) * (1 - e);
      if (frac < 0.55) frac = 0.55;
      const sw = sampleW * frac;
      let sx = ox + (sampleW - sw) / 2;
      let sy = oy + (i / strips) * sampleH;
      let sh = sampleH / strips + 1.6;
      sx = Math.max(0, Math.min(SW - 2, sx));
      sy = Math.max(0, Math.min(SH - 2, sy));
      const swC = Math.max(1, Math.min(SW - sx, sw));
      const shC = Math.max(1, Math.min(SH - sy, sh));
      ctx.drawImage(src, sx, sy, swC, shC, 0, y0, VW, y1 - y0 + 0.6);
    }
  }

  function makePlate(scene, mag, pinch, angle, stretchAmt, shx, shy) {
    const v = mk(VW, VH);
    blitMag(v.getContext("2d"), scene, mag, pinch);
    let out = v;
    if (stretchAmt) {
      const c = mk(VW, VH);
      const x = c.getContext("2d");
      x.translate(VW / 2, VH / 2);
      x.rotate(angle);
      x.scale(1 + stretchAmt, 1);
      x.rotate(-angle);
      x.drawImage(v, -VW / 2, -VH / 2);
      out = c;
    }
    if (shx || shy) {
      const c = mk(VW, VH);
      const x = c.getContext("2d");
      x.translate(VW / 2, VH / 2);
      x.transform(1, shy, shx, 1, 0, 0);
      x.drawImage(out, -VW / 2, -VH / 2);
      out = c;
    }
    return out;
  }

  function zonePath(ctx, inset) {
    ctx.beginPath();
    ctx.ellipse(ZX, ZY, Math.max(8, ZRX - inset), Math.max(8, ZRY - inset), 0, 0, Math.PI * 2);
  }

  function isSpec() { return !!SPEC[S.mode]; }
  function effectiveSign() {
    if (S.mode === "hyper") return "plus";
    if (S.mode === "myope") return "minus";
    return S.sign;
  }
  function merAngle() {
    if (S.mer === "v") return Math.PI / 2;
    if (S.mer === "o") return Math.PI / 4;
    return 0;
  }
  function bFar(sign, level) {
    if (!level) return 0;
    return sign === "minus" ? level : Math.max(1, level - 1);
  }
  function bMid(sign, level) {
    if (!level) return 0;
    return sign === "minus" ? Math.max(0, level - 1) : level;
  }
  function bNear(sign, level) {
    if (!level) return 0;
    return sign === "minus" ? Math.max(0, level - 2) : Math.min(3, level + 1);
  }

  function optics() {
    const sign = effectiveSign();
    const sL = LVL[S.sphere];
    const cL = LVL[S.cyl];
    const ang = merAngle();
    const cylPx = [0, 10, 20, 34][cL];
    const mag = sign === "plus" ? MAG[sL] : MINI[sL];
    const pinch = sign === "plus" ? PIN[sL] : -PIN[sL];
    const uncorr = smear(stack(bFar(sign, sL), bMid(sign, sL), bNear(sign, sL)), ang, cylPx);
    const residual = smear(stack(0, 0, 0), ang, cylPx);
    const sharp = stack(0, 0, 0);
    return { sign, sL, cL, ang, cylPx, mag, pinch, uncorr, residual, sharp };
  }

  function paintZone(plate, inset) {
    fx.save();
    zonePath(fx, inset);
    fx.clip();
    fx.drawImage(plate, 0, 0);
    fx.restore();
  }

  function paintBand(plate, inset, x, y, w, h) {
    fx.save();
    zonePath(fx, inset);
    fx.clip();
    fx.beginPath();
    fx.rect(x, y, w, h);
    fx.clip();
    fx.drawImage(plate, 0, 0);
    fx.restore();
  }

  function label(text, x, y) {
    fx.font = "600 15px system-ui, sans-serif";
    fx.textAlign = "center";
    fx.textBaseline = "middle";
    fx.lineWidth = 4;
    fx.strokeStyle = "rgba(0,0,0,.7)";
    fx.fillStyle = "#fff";
    fx.strokeText(text, x, y);
    fx.fillText(text, x, y);
  }

  function draw() {
    const o = optics();
    const spec = isSpec();
    const gap = S.mode === "hyper" && S.sphere === "high";
    const inset = gap ? 8 : 0;
    fx.setTransform(1, 0, 0, 1, 0, 0);
    fx.clearRect(0, 0, VW, VH);

    if (!spec) {
      if (S.mode === "iol") {
        fx.drawImage(makePlate(stack(0, 0, 2), 1, 0, 0, 0, 0, 0), 0, 0);
      } else if (S.mode === "clPlain") {
        fx.drawImage(makePlate(o.uncorr, 1, 0, 0, 0, 0, 0), 0, 0);
      } else if (S.mode === "clCyl") {
        const stretch = [0, 0, 0, 0.035][o.cL];
        fx.drawImage(makePlate(o.sharp, 1, 0, o.ang, stretch, 0, 0), 0, 0);
      } else {
        fx.drawImage(makePlate(o.residual, 1, 0, 0, 0, 0, 0), 0, 0);
      }
    } else {
      const outside = makePlate(o.uncorr, 1, 0, 0, 0, 0, 0);
      fx.save();
      if (gap) {
        fx.beginPath();
        fx.rect(0, 0, VW, VH);
        fx.ellipse(ZX, ZY, ZRX + 16, ZRY + 16, 0, 0, Math.PI * 2);
        fx.clip("evenodd");
      }
      if (S.outside) fx.drawImage(outside, 0, 0);
      else {
        fx.fillStyle = "#14181e";
        fx.fillRect(0, 0, VW, VH);
      }
      fx.restore();
      if (!S.outside) {
        fx.save();
        zonePath(fx, -2);
        fx.strokeStyle = "#3a414c";
        fx.lineWidth = 16;
        fx.stroke();
        fx.restore();
      }
      if (gap) {
        fx.save();
        fx.beginPath();
        fx.ellipse(ZX, ZY, ZRX + 16, ZRY + 16, 0, 0, Math.PI * 2);
        fx.ellipse(ZX, ZY, ZRX - inset, ZRY - inset, 0, 0, Math.PI * 2);
        fx.fillStyle = "rgba(58, 46, 30, 0.94)";
        fx.fill("evenodd");
        fx.restore();
      }

      const stretch = S.mode === "specCyl" ? [0, 0.045, 0.08, 0.13][o.cL] : 0;
      const svScene = S.mode === "specCyl" ? o.sharp : o.residual;
      const sv = makePlate(svScene, o.mag, o.pinch, o.ang, stretch, 0, 0);
      const prog = S.mode === "prog" && LVL[S.add] > 0;

      if (!prog) {
        paintZone(sv, inset);
      } else {
        const aL = LVL[S.add];
        const sh = [0, 0.045, 0.08, 0.12][aL];
        const addMag = o.mag * [1, 1.04, 1.09, 1.15][aL];
        const nearScene = smear(stack(Math.min(3, aL + 1), Math.min(3, aL), 0), o.ang, o.cylPx);
        const nearPlate = makePlate(nearScene, addMag, o.pinch, 0, 0, 0, 0);
        const mush = makePlate(stack(3, 3, 3), o.mag, o.pinch, 0, 0, S.gaze === "side" ? sh : 0, S.gaze === "down" ? sh : 0);
        const mild = makePlate(smear(stack(0, 1, 3), o.ang, o.cylPx), o.mag, o.pinch, 0, 0, 0, 0);
        const side = makePlate(stack(2, 2, 2), o.mag, o.pinch, 0, 0, 0, 0);
        if (S.gaze === "down") {
          paintZone(mush, inset);
          paintBand(nearPlate, inset, ZX - ZRX * 0.16, 0, ZRX * 0.32, VH);
        } else if (S.gaze === "side") {
          paintZone(mush, inset);
          paintBand(sv, inset, ZX - ZRX + 10, 0, ZRX * 0.36, VH);
        } else {
          paintZone(sv, inset);
          paintBand(mild, inset, 0, ZY + ZRY * 0.22, VW, VH);
          const sideW = ZRX * 0.26;
          paintBand(side, inset, ZX - ZRX, 0, sideW, VH);
          paintBand(side, inset, ZX + ZRX - sideW, 0, sideW, VH);
        }
      }

      if (S.zone) {
        fx.save();
        zonePath(fx, inset);
        fx.strokeStyle = "rgba(240,160,48,.95)";
        fx.lineWidth = 2.5;
        fx.stroke();
        fx.restore();
        label(T.zone, ZX, Math.max(16, ZY - ZRY - 16));
        if (S.outside) label(T.zoneOut, 70, ZY);
        if (gap) label(T.zoneGap, ZX + ZRX + 8, ZY + ZRY * 0.72);
        if (prog) {
          label(T.zoneFar, ZX, ZY - ZRY * 0.55);
          label(T.zoneCorr, ZX, ZY);
          label(T.zoneNear, ZX, ZY + ZRY * 0.58);
          label(T.zonePeriph, ZX - ZRX * 0.62, ZY);
          label(T.zonePeriph, ZX + ZRX * 0.62, ZY);
        }
      }
    }
  }

  function captionText() {
    if (S.mode === "iol") return T.capIol;
    const quiet = LVL[S.sphere] === 0 && LVL[S.cyl] === 0 && !(S.mode === "prog" && LVL[S.add] > 0);
    if (quiet) return T.zeroState;
    const map = {
      hyper: T.capHyper, myope: T.capMyope, prog: T.capProg, specCyl: T.capSpecCyl,
      cl: T.capCl, clCyl: T.capClCyl, clPlain: T.capClPlain,
    };
    let text = map[S.mode] || "";
    if (S.mode === "hyper" && S.sphere === "high") text += " " + T.capHyperGap;
    if (S.mode === "clCyl" && LVL[S.cyl] === 0) text += " " + T.capClSame;
    return text;
  }

  function scaleText() {
    const sign = effectiveSign();
    const sN = [0, 1, 3, 5][LVL[S.sphere]];
    const cN = [0, 1, 2, 3][LVL[S.cyl]];
    const aN = LVL[S.add];
    const aMap = { 1: "1", 2: "2", 3: "2.5" };
    const signed = (sign === "minus" ? "−" : "+") + sN;
    const mer = S.mer === "h" ? T.merH : S.mer === "o" ? T.merO : T.merV;
    let sph;
    let cyl;
    let add = "";
    if (uiLang === "en") {
      sph = sN === 0 ? "Sphere none" : "Sphere illustration " + signed;
      cyl = cN === 0 ? "astigmatism none" : "astigmatism illustration " + cN + " · " + mer.toLowerCase();
      if (S.mode === "prog") add = aN === 0 ? " · Add none" : " · Add illustration " + aMap[aN];
    } else {
      sph = sN === 0 ? T.sphereAmt + " " + T.amtNone : T.sphereAmt + " " + T.illus + " " + signed;
      cyl = cN === 0 ? T.cylAmt + " " + T.amtNone : T.cylAmt + " " + T.illus + " " + cN + " · " + mer;
      if (S.mode === "prog") {
        add = aN === 0 ? " · " + T.addAmt + " " + T.amtNone : " · " + T.addAmt + " " + T.illus + " " + aMap[aN];
      }
    }
    return sph + " · " + cyl + add;
  }

  function fillSeg(id, key, options) {
    const host = $(id);
    host.setAttribute("aria-label", T[key] || "");
    host.replaceChildren();
    options.forEach(([value, labelKey]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.k = key === "groupCompare" ? "mode" : host.dataset.k;
      b.dataset.v = value;
      b.textContent = T[labelKey];
      host.appendChild(b);
    });
  }

  function buildControls() {
    $("grp-mode").dataset.k = "mode";
    $("grp-sign").dataset.k = "sign";
    $("grp-sphere").dataset.k = "sphere";
    $("grp-cyl").dataset.k = "cyl";
    $("grp-mer").dataset.k = "mer";
    $("grp-add").dataset.k = "add";
    $("grp-gaze").dataset.k = "gaze";
    fillSeg("grp-mode", "groupCompare", [
      ["hyper", "modeHyper"], ["myope", "modeMyope"], ["prog", "modeProg"], ["specCyl", "modeSpecCyl"],
      ["cl", "modeCl"], ["clCyl", "modeClCyl"], ["clPlain", "modeClPlain"], ["iol", "modeIol"],
    ]);
    fillSeg("grp-sign", "sphereSign", [["minus", "signMinus"], ["plus", "signPlus"]]);
    fillSeg("grp-sphere", "sphereAmt", [["none", "amtNone"], ["light", "amtLight"], ["mid", "amtMid"], ["high", "amtHigh"]]);
    fillSeg("grp-cyl", "cylAmt", [["none", "amtNone"], ["light", "amtLight"], ["mid", "amtMid"], ["high", "amtHigh"]]);
    fillSeg("grp-mer", "meridian", [["h", "merH"], ["o", "merO"], ["v", "merV"]]);
    fillSeg("grp-add", "addAmt", [["none", "amtNone"], ["light", "amtLight"], ["mid", "amtMid"], ["high", "amtHigh"]]);
    fillSeg("grp-gaze", "groupGaze", [["far", "gazeFar"], ["down", "gazeDown"], ["side", "gazeSide"]]);
    $("pageCap").textContent = T.pageCap;
    $("lab-compare").textContent = T.groupCompare;
    $("lab-rx").textContent = T.groupRx;
    $("rxNote").textContent = T.rxNote;
    $("lab-sign").textContent = T.sphereSign;
    $("lab-sphere").textContent = T.sphereAmt;
    $("lab-cyl").textContent = T.cylAmt;
    $("lab-mer").textContent = T.meridian;
    $("lab-add").textContent = T.addAmt;
    $("lab-gaze").textContent = T.groupGaze;
    $("lab-show").textContent = T.groupShow;
    $("lab-zone").textContent = T.showZone;
    $("lab-out").textContent = T.showOutside;
    $("lab-scale").textContent = T.showScale;
    document.documentElement.lang = T.htmlLang;
    document.title = T.title;
  }

  function syncUi() {
    const spec = isSpec();
    const sign = effectiveSign();
    document.querySelectorAll("#sim button[data-k]").forEach((b) => {
      const k = b.dataset.k;
      const v = b.dataset.v;
      let on = S[k] === v;
      if (k === "sign") on = sign === v;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      let disabled = false;
      if (k === "sign") disabled = S.mode === "hyper" || S.mode === "myope";
      if (k === "mer") disabled = S.cyl === "none";
      if (k === "add") disabled = S.mode !== "prog";
      if (k === "gaze") disabled = !spec;
      b.disabled = disabled;
    });
    $("chk-zone").checked = S.zone;
    $("chk-out").checked = S.outside;
    $("chk-out").disabled = !spec;
    $("chk-scale").checked = S.scale;
    const hints = [];
    if (S.mode === "hyper" || S.mode === "myope") hints.push(T.hintSignLock);
    if (S.cyl === "none") hints.push(T.hintMeridian);
    if (S.mode !== "prog") hints.push(T.hintAdd);
    if (!spec) hints.push(T.hintGaze);
    if (!spec) hints.push(T.hintOutside);
    $("hints").replaceChildren();
    hints.forEach((text) => {
      const p = document.createElement("p");
      p.className = "hint";
      p.textContent = text;
      $("hints").appendChild(p);
    });
    $("modeCap").textContent = captionText();
    const showScale = S.scale;
    $("scaleNote").hidden = !showScale;
    $("scaleLine").hidden = !showScale;
    $("scaleNote").textContent = T.rxNote;
    $("scaleLine").textContent = scaleText();
    const showFixed = !spec && S.zone;
    $("noFixed").hidden = !showFixed;
    $("noFixed").textContent = T.noFixedZone;
  }

  function render() {
    draw();
    syncUi();
    reportHeight();
  }

  $("sim").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-k]");
    if (!b || b.disabled) return;
    S[b.dataset.k] = b.dataset.v;
    render();
  });
  $("chk-zone").addEventListener("change", (ev) => { S.zone = ev.target.checked; render(); });
  $("chk-out").addEventListener("change", (ev) => { S.outside = ev.target.checked; render(); });
  $("chk-scale").addEventListener("change", (ev) => { S.scale = ev.target.checked; render(); });

  function reportHeight() {
    const h = Math.ceil($("sim").getBoundingClientRect().height || 900);
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "eyesinfo-spectacle-image-height", height: h }, "*");
    }
  }
  window.addEventListener("load", reportHeight);
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(reportHeight).observe($("sim"));

  buildControls();
  render();
})();
  </script>
</body>
</html>
