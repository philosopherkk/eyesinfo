  <meta charset="UTF-8" />

  <title>鏡片所見畫面示意 — 護眼學堂</title>
  <style>
    html, body { margin: 0; padding: 0; background: #101318; color: #e8eaee; overflow-x: hidden; }
    #sim {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; flex-direction: column;
      max-width: 1040px; margin: 0 auto; padding: 12px 12px 20px;
      box-sizing: border-box;
    }
    #pageCap { order: -1; }
    .stage { order: 0; }
    .controls { order: 1; }
    .cap { font-size: 13px; line-height: 1.5; color: #9aa3b2; margin: 0 0 8px; }
    .lab { font-size: 13px; font-weight: 700; color: #f3c06a; margin: 0; }
    .note, .hint, .capmode { font-size: 13px; line-height: 1.5; color: #c5ceda; margin: 6px 0; }
    .hint { color: #8b95a3; margin: 4px 0; }
    .controls, .stage, .seg, .row, .field { min-width: 0; max-width: 100%; }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .seg button, .chk {
      background: #23272f; color: #e6e6e6; border: 1px solid #3a404a; border-radius: 999px;
      min-height: 44px; padding: 8px 14px; font-size: 14px; cursor: pointer;
      max-width: 100%; overflow-wrap: anywhere; box-sizing: border-box;
    }
    .seg button.on { background: #f0a030; color: #1a1206; font-weight: 700; border-color: #f0a030; }
    .seg button:disabled { opacity: 0.4; cursor: not-allowed; }
    .chk { display: flex; align-items: center; gap: 8px; border-radius: 12px; }
    .chk input { width: 18px; height: 18px; accent-color: #f0a030; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .panel {
      margin-top: 12px; padding: 12px 12px 8px; border-radius: 16px;
      background: #171b22; border: 1px solid #2c323c;
    }
    .field { margin: 12px 0 4px; }
    .field-top, .ends { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .live { font-size: 13px; font-weight: 700; color: #fff; }
    .ends { font-size: 12px; color: #8b95a3; margin-top: 2px; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 44px; margin: 4px 0 0; background: transparent; cursor: pointer;
    }
    input[type="range"]:focus-visible { outline: 2px solid #f0a030; outline-offset: 2px; }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px; border-radius: 999px;
      background: linear-gradient(90deg, #7eb6e6 0%, #d7dde6 50%, #e7b15a 100%);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 26px; height: 26px; margin-top: -9px; border-radius: 50%;
      background: #fff; border: 3px solid #1a1206; box-shadow: 0 1px 4px rgba(0,0,0,.45);
    }
    #rng-sphere::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, #e7b15a 0%, #d7dde6 50%, #7eb6e6 100%);
    }
    #rng-sphere::-moz-range-track {
      height: 8px; border-radius: 999px;
      background: linear-gradient(90deg, #e7b15a 0%, #d7dde6 50%, #7eb6e6 100%);
    }
    #rng-cyl::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, #3a404a, #f0a030);
    }
    canvas {
      width: 100%; max-width: 100%; height: auto; display: block;
      border-radius: 16px; background: #0e1218; margin-top: 4px;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
    }
    [hidden] { display: none !important; }

    #viewAdv { display: flex; flex-direction: column; }
    .tabs { display: flex; gap: 6px; margin: 0 0 12px; padding: 4px; border-radius: 999px;
      background: #171b22; border: 1px solid #2c323c; }
    .tabs button {
      flex: 1 1 0; min-height: 44px; padding: 8px 12px; border-radius: 999px; border: 0;
      background: transparent; color: #c5ceda; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      overflow-wrap: anywhere;
    }
    .tabs button[aria-selected="true"] { background: #f0a030; color: #1a1206; font-weight: 700; }
    .tabs button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .d-verdict { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: 0 0 10px;
      border-radius: 16px; background: #171b22; border: 2px solid #2c323c; min-height: 76px; }
    .d-verdict[data-kind="barrel"] { border-color: #e7b15a; }
    .d-verdict[data-kind="pin"] { border-color: #7eb6e6; }
    .d-badge { flex: none; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: #23272f; }
    .d-badge svg { width: 36px; height: 36px; }
    .d-verdict h2 { margin: 0; font-size: 20px; line-height: 1.25; color: #fff; }
    .d-verdict h2 small { font-size: 13px; font-weight: 600; color: #9aa3b2; margin-left: 6px; }
    .d-verdict p { margin: 3px 0 0; font-size: 14px; line-height: 1.5; color: #c5ceda; }

    .d-stage { position: relative; border-radius: 16px; overflow: hidden; background: #0e1218;
      box-shadow: 0 10px 28px rgba(0,0,0,.35); user-select: none; -webkit-user-select: none; touch-action: pan-y; }
    #dcv { margin: 0; border-radius: 0; box-shadow: none; cursor: ew-resize; }
    #dcv:focus-visible { outline: 3px solid #f0a030; outline-offset: -3px; }
    .d-pill { position: absolute; top: 10px; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 700;
      background: rgba(10,12,16,.78); color: #fff; pointer-events: none; max-width: 46%; }
    #pillL { left: 10px; } #pillR { right: 10px; }
    .d-how { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: #9aa3b2; }
    .d-how b { color: #f0a030; }
    .d-how .gd { display: inline-block; width: 22px; border-top: 3px dashed #ff5d7a; vertical-align: middle; margin-right: 4px; }

    #rng-s::-webkit-slider-runnable-track { height: 12px; background: linear-gradient(90deg, #e7b15a 0%, #d7dde6 50%, #7eb6e6 100%); }
    #rng-s::-webkit-slider-thumb { width: 34px; height: 34px; margin-top: -11px; border-width: 4px; }
    #rng-s::-moz-range-track { height: 12px; border-radius: 999px; background: linear-gradient(90deg, #e7b15a 0%, #d7dde6 50%, #7eb6e6 100%); }
    #rng-s::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 4px solid #1a1206; }
    #rng-s { height: 48px; }
    .d-ends { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: #b8c1ce; }
    .d-ends b { display: block; font-size: 14px; color: #fff; }
    .d-ends span:nth-child(2) { color: #9aa3b2; text-align: center; }
    .d-ends span:last-child { text-align: right; }

    .d-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .d-tile { background: #171b22; border: 2px solid #2c323c; border-radius: 16px; padding: 8px; color: #e8eaee;
      cursor: pointer; text-align: left; font: inherit; min-height: 44px; }
    .d-tile canvas { margin: 0; box-shadow: none; border-radius: 10px; }
    .d-tile b { display: block; margin-top: 6px; font-size: 15px; }
    .d-tile span { display: block; font-size: 12.5px; color: #9aa3b2; line-height: 1.4; }
    .d-tile[aria-pressed="true"] { border-color: #f0a030; }
    .d-tile[data-t="barrel"] b { color: #e7b15a; } .d-tile[data-t="pin"] b { color: #7eb6e6; }
    .d-tile:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .d-foot { margin: 14px 0 0; font-size: 12.5px; line-height: 1.6; color: #8b95a3; }
    .d-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (min-width: 760px) {
      .d-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; align-items: start; }
      .d-grid .panel { margin-top: 0; }
    }
  </style>
</head>
<body>
  <div id="sim">
    <div class="tabs" id="tabs" role="tablist">
      <button type="button" role="tab" id="tabDist" aria-controls="viewDist" aria-selected="true"></button>
      <button type="button" role="tab" id="tabAdv" aria-controls="viewAdv" aria-selected="false" tabindex="-1"></button>
    </div>

    <section id="viewDist" role="tabpanel" aria-labelledby="tabDist">
      <p class="cap" id="dCap"></p>
      <div class="d-verdict" id="verdict" data-kind="plano" role="status" aria-live="polite">
        <div class="d-badge" id="dBadge" aria-hidden="true"></div>
        <div>
          <h2 id="vTitle"></h2>
          <p id="vBody"></p>
        </div>
      </div>

      <div class="d-grid">
        <div>
          <div class="d-stage">
            <canvas id="dcv" width="960" height="540" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></canvas>
            <span class="d-pill" id="pillL"></span>
            <span class="d-pill" id="pillR"></span>
          </div>
          <ul class="d-how" id="dHow"></ul>
        </div>

        <div>
          <div class="panel">
            <p class="lab" id="lab-s"></p>
            <input id="rng-s" type="range" min="-100" max="100" step="1" value="-70" aria-labelledby="lab-s" />
            <div class="d-ends">
              <span><b id="endMinusB"></b><span id="endMinusS"></span></span>
              <span id="endPlano"></span>
              <span><b id="endPlusB"></b><span id="endPlusS"></span></span>
            </div>
            <label class="chk" style="margin-top:8px"><input type="checkbox" id="chk-guide" checked /> <span id="lab-guide"></span></label>
          </div>
          <div class="d-tiles">
            <button class="d-tile" data-t="barrel" type="button" aria-pressed="false"><canvas id="tBarrel" width="320" height="180"></canvas><b id="tBarrelB"></b><span id="tBarrelS"></span></button>
            <button class="d-tile" data-t="pin" type="button" aria-pressed="false"><canvas id="tPin" width="320" height="180"></canvas><b id="tPinB"></b><span id="tPinS"></span></button>
          </div>
        </div>
      </div>
      <p class="d-foot" id="dFoot"></p>
    </section>

    <section id="viewAdv" role="tabpanel" aria-labelledby="tabAdv" hidden>
    <p class="cap" id="pageCap"></p>
    <div class="controls">
    <p class="lab" id="lab-compare"></p>
    <div class="seg" id="grp-mode" role="group"></div>

    <div class="panel">
    <p class="lab" id="lab-rx"></p>
    <p class="note" id="rxNote"></p>
    <div class="field">
      <div class="field-top">
        <span class="lab" id="lab-sphere"></span>
        <span class="live" id="sphereLive"></span>
      </div>
      <input id="rng-sphere" type="range" min="0" max="200" step="1" value="160" />
      <div class="ends"><span id="end-minus"></span><span id="end-plano"></span><span id="end-plus"></span></div>
    </div>
    <div class="field">
      <div class="field-top">
        <span class="lab" id="lab-cyl"></span>
        <span class="live" id="cylLive"></span>
      </div>
      <input id="rng-cyl" type="range" min="0" max="100" step="1" value="0" />
      <div class="ends"><span id="end-cyl0"></span><span id="end-cyl1"></span></div>
    </div>
    <div class="row">
      <span class="lab" id="lab-mer"></span>
      <div class="seg" id="grp-mer" role="group"></div>
    </div>
    </div>

    <p class="lab" id="lab-show"></p>
    <div class="row">
      <label class="chk"><input type="checkbox" id="chk-zone" checked /> <span id="lab-zone"></span></label>
      <label class="chk"><input type="checkbox" id="chk-out" checked /> <span id="lab-out"></span></label>
    </div>
    <div id="hints"></div>
    </div>

    <div class="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <p class="capmode" id="modeCap"></p>
    <p class="note" id="noFixed" hidden></p>
    </div>
    </section>
  </div>

      noFixedZone: "この比較に、眼前に固定された光学部はありません。",
      hintSignLock: "このレンズでは球面の向きは固定です",
      hintMeridian: "乱視が「なし」のとき、方向は画面を変えません",
      hintOutside: "レンズ外の参考は眼鏡だけに出ます",
      zeroState: "球面と乱視がともに「なし」のときは差が小さくなります。先に図示の屈折を設定してください。",
      capHyper: "光学部の中では遠方がはっきりし、拡大し、直線がわずかに内側へ曲がります。乱視矯正を選んでいなければ、方向性のぼけは残ります。外は未矯正の画面です。",
      capHyperGap: "強い遠視のときだけ、光学部の縁に図示の欠けを描きます。弱と中では描きません。",
      capMyope: "光学部の中では遠方がはっきりし、縮小し、直線がわずかに外側へ曲がります。乱視矯正を選んでいなければ、方向性のぼけは残ります。外は未矯正の画面です。",
      capSpecCyl: "光学部の中では選んだ方向のぼけが取れ、わずかな方向性の伸びが残ります。外は未矯正の方向性のぼけのままです。",
      capCl: "画面全体で球面を矯正し、大きさはほとんど変わらず、枠の窓もありません。乱視が「なし」でなければ、方向性のぼけが全体に残ります。",
      capClCyl: "画面全体で球面と方向性のぼけを同時に取ります。方向性の伸びは眼鏡より軽く描きます。レンズの回転や装用の適否は示しません。",
      capClSame: "乱視の図示が「なし」のときは、矯正済みコンタクトレンズに近くなります。",
      capClPlain: "画面全体が未中和のぼけのままです。枠の窓はありません。近視の図示では遠方がよりぼけ、遠視の図示では遠方が比較的軽くぼけます。",
    },
  };

  const normalizeLang = (raw) => {
    const v = (raw || "").trim();
    if (v === "zh" || v === "zh-Hant" || v === "zh-hant") return "zh-Hant";
    if (v === "zh-Hans" || v === "zh-hans" || v === "zh-CN" || v === "zh-cn") return "zh-Hans";
    if (v === "ja" || v === "jp") return "ja";
    if (v === "en") return "en";
    return "zh-Hant";
  };

  let uiLang = normalizeLang(new URLSearchParams(location.search).get("lang"));
  let T = I18N[uiLang];

  const VW = 960, VH = 540, SW = 1400, SH = 788, PAD = 240, SCENE_H = SH + PAD;
  const ZX = VW / 2, ZY = VH * 0.5, ZRX = 250, ZRY = 230;
  const SPEC = { sv: 1, specCyl: 1 };

  const S = {
    mode: "sv",
    sphere: 160,
    cyl: 0,
    mer: "h",
    zone: true,
    outside: true,
  };

  const $ = (id) => document.getElementById(id);
  const cv = $("cv");
  const fx = cv.getContext("2d");
  const mk = (w, h) => {
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    return c;
  };
  const hasFilter = (() => {
    const c = mk(4, 4).getContext("2d");
    if (!c || !("filter" in c)) return false;
    c.filter = "blur(2px)";
    return c.filter === "blur(2px)";
  })();

  const photo = new Image();
  let photoReady = false;
  const blurCache = new Map();
  const pixelCache = new WeakMap();
  function drawFar(ctx) {
    ctx.fillStyle = "#243246";
    ctx.fillRect(0, 0, SW, SH);
    if (!photoReady) return;
    const ir = photo.naturalWidth / photo.naturalHeight;
    const cr = SW / SH;
    let dw = SW;
    let dh = SH;
    let dx = 0;
    let dy = 0;
    if (ir > cr) {
      dh = SH;
      dw = SH * ir;
      dx = (SW - dw) / 2;
    } else {
      dw = SW;
      dh = SW / ir;
      dy = (SH - dh) * 0.35;
    }
    ctx.drawImage(photo, dx, dy, dw, dh);
  }

  function extendFar(canvas) {
    const band = 72;
    const tmp = mk(SW, PAD);
    const tx = tmp.getContext("2d");
    tx.save();
    tx.translate(0, PAD);
    tx.scale(1, -1);
    tx.drawImage(canvas, 0, SH - band, SW, band, 0, 0, SW, PAD);
    tx.restore();
    canvas.getContext("2d").drawImage(tmp, 0, SH);
  }

  const far0 = mk(SW, SCENE_H);
  drawFar(far0.getContext("2d"));
  extendFar(far0);
  photo.onload = () => {
    photoReady = true;
    blurCache.clear();
    pixelCache.delete(far0);
    drawFar(far0.getContext("2d"));
    extendFar(far0);
    if (typeof render === "function") render();
  };
  photo.src = "spectacle-ridge.jpg";

  function blurOf(src, r) {
    if (r <= 0) return src;
    const c = mk(src.width, src.height);
    const x = c.getContext("2d");
    if (hasFilter) {
      x.filter = "blur(" + r + "px)";
      x.drawImage(src, 0, 0);
      x.filter = "none";
      return c;
    }
    const n = 5;
    x.globalAlpha = 1 / n;
    for (let i = 0; i < n; i++) {
      const t = (i - (n - 1) / 2) * r * 0.35;
      x.drawImage(src, t, 0);
      x.drawImage(src, 0, t);
    }
    return c;
  }

  function blurred(src, r) {
    const q = Math.max(0, Math.round(r * 2) / 2);
    if (q <= 0) return src;
    const key = "f" + q;
    const hit = blurCache.get(key);
    if (hit) return hit;
    const made = blurOf(src, q);
    blurCache.set(key, made);
    return made;
  }

  function layers(farR) {
    const c = mk(SW, SCENE_H);
    const x = c.getContext("2d");
    x.drawImage(blurred(far0, farR), 0, 0);
    return c;
  }

  function smear(src, angle, dist) {
    if (dist <= 0) return src;
    const c = mk(src.width, src.height);
    const x = c.getContext("2d");
    const steps = 7;
    x.globalAlpha = 1 / steps;
    for (let i = 0; i < steps; i++) {
      const t = (i / (steps - 1) - 0.5) * dist;
      x.drawImage(src, Math.cos(angle) * t, Math.sin(angle) * t);
    }
    return c;
  }

  function srcPixels(src) {
    const hit = pixelCache.get(src);
    if (hit) return hit;
    const img = src.getContext("2d").getImageData(0, 0, src.width, src.height);
    pixelCache.set(src, img);
    return img;
  }

  function blitMag(ctx, src, mag, pinch, lookX, lookY) {
    const srcCx = SW / 2 + (lookX || 0);
    const srcCy = SH / 2 + (lookY || 0);
    const safeMag = mag > 0.2 ? mag : 0.2;
    if (Math.abs(pinch) < 0.015) {
      const sw = VW / safeMag;
      const sh = VH / safeMag;
      ctx.drawImage(src, srcCx - sw / 2, srcCy - sh / 2, sw, sh, 0, 0, VW, VH);
      return;
    }
    const simg = srcPixels(src);
    const sd = simg.data;
    const sw = src.width;
    const shh = src.height;
    const out = ctx.createImageData(VW, VH);
    const od = out.data;
    const viewCx = VW / 2;
    const viewCy = VH / 2;
    const maxX = sw - 1.001;
    const maxY = shh - 1.001;
    for (let y = 0; y < VH; y++) {
      const ny = (y - ZY) / ZRY;
      const ny2 = ny * ny;
      const row = y * VW;
      for (let x = 0; x < VW; x++) {
        const nx = (x - ZX) / ZRX;
        const r2 = nx * nx + ny2;
        // pinch > 0 pincushion (plus / hyperopia): magnification grows toward the edge, lines bow inward.
        // pinch < 0 barrel (minus / myopia): magnification falls toward the edge, lines bow outward.
        let radial = 1 - pinch * r2;
        if (radial < 0.34) radial = 0.34;
        if (radial > 2.6) radial = 2.6;
        const ox = (x - viewCx) / safeMag;
        const oy = (y - viewCy) / safeMag;
        let sx = srcCx + ox * radial;
        let sy = srcCy + oy * radial;
        if (sy < 0) sy = Math.min(-sy, 200);
        if (sx < 0) sx = 0;
        else if (sx > maxX) sx = maxX;
        if (sy > maxY) sy = maxY;
        const x0 = sx | 0;
        const y0 = sy | 0;
        const fx = sx - x0;
        const fy = sy - y0;
        const i00 = (y0 * sw + x0) * 4;
        const i10 = i00 + 4;
        const i01 = i00 + sw * 4;
        const i11 = i01 + 4;
        const w00 = (1 - fx) * (1 - fy);
        const w10 = fx * (1 - fy);
        const w01 = (1 - fx) * fy;
        const w11 = fx * fy;
        const di = (row + x) * 4;
        od[di] = sd[i00] * w00 + sd[i10] * w10 + sd[i01] * w01 + sd[i11] * w11;
        od[di + 1] = sd[i00 + 1] * w00 + sd[i10 + 1] * w10 + sd[i01 + 1] * w01 + sd[i11 + 1] * w11;
        od[di + 2] = sd[i00 + 2] * w00 + sd[i10 + 2] * w10 + sd[i01 + 2] * w01 + sd[i11 + 2] * w11;
        od[di + 3] = 255;
      }
    }
    ctx.putImageData(out, 0, 0);
  }

  function makePlate(scene, mag, pinch, angle, stretchAmt, shx, shy, lookX, lookY) {
    const v = mk(VW, VH);
    blitMag(v.getContext("2d"), scene, mag, pinch, lookX, lookY);
    let out = v;
    if (stretchAmt) {
      const c = mk(VW, VH);
      const x = c.getContext("2d");
      x.translate(VW / 2, VH / 2);
      x.rotate(angle);
      x.scale(1 + stretchAmt, 1);
      x.rotate(-angle);
      x.drawImage(v, -VW / 2, -VH / 2);
      out = c;
    }
    if (shx || shy) {
      const c = mk(VW, VH);
      const x = c.getContext("2d");
      x.translate(VW / 2, VH / 2);
      x.transform(1, shy, shx, 1, 0, 0);
      x.drawImage(out, -VW / 2, -VH / 2);
      out = c;
    }
    return out;
  }

  function zonePath(ctx, inset) {
    ctx.beginPath();
    ctx.ellipse(ZX, ZY, Math.max(8, ZRX - inset), Math.max(8, ZRY - inset), 0, 0, Math.PI * 2);
  }

  function isSpec() { return !!SPEC[S.mode]; }
  function sphereState() {
    // Same direction as the straight-line tab: left is minus, right is plus.
    const delta = S.sphere - 100;
    const sign = delta < -1 ? "minus" : delta > 1 ? "plus" : "plano";
    const amt = Math.min(1, Math.abs(delta) / 100);
    return { sign, amt };
  }
  function cylAmt() { return Math.min(1, Math.max(0, S.cyl) / 100); }
  function merAngle() {
    if (S.mer === "v") return Math.PI / 2;
    if (S.mer === "o") return Math.PI / 4;
    return 0;
  }

  function optics() {
    const { sign, amt } = sphereState();
    const cA = cylAmt();
    const ang = merAngle();
    const cylPx = cA * 36;
    const mag = sign === "plus" ? 1 + 0.18 * amt : sign === "minus" ? 1 - 0.14 * amt : 1;
    const bend = amt * amt;
    const pinch = sign === "plus" ? 0.3 * bend : sign === "minus" ? -0.9 * bend : 0;
    let farR = 0;
    if (sign === "minus") farR = 22 * amt;
    else if (sign === "plus") farR = 12 * Math.max(0, amt - 0.2);
    const uncorr = smear(layers(farR), ang, cylPx);
    const residual = smear(layers(0), ang, cylPx);
    const sharp = layers(0);
    return { sign, amt, cA, ang, cylPx, mag, pinch, uncorr, residual, sharp };
  }

  function paintZone(plate, inset) {
    fx.save();
    zonePath(fx, inset);
    fx.clip();
    fx.drawImage(plate, 0, 0);
    fx.restore();
  }

  function label(text, x, y) {
    fx.font = "600 15px system-ui, sans-serif";
    fx.textAlign = "center";
    fx.textBaseline = "middle";
    fx.lineWidth = 4;
    fx.strokeStyle = "rgba(0,0,0,.7)";
    fx.fillStyle = "#fff";
    fx.strokeText(text, x, y);
    fx.fillText(text, x, y);
  }

  function draw() {
    const o = optics();
    const spec = isSpec();
    const gap = S.mode === "sv" && o.sign === "plus" && o.amt > 0.72;
    const inset = gap ? 8 : 0;
    fx.setTransform(1, 0, 0, 1, 0, 0);
    fx.clearRect(0, 0, VW, VH);

    if (!spec) {
      if (S.mode === "clPlain") {
        fx.drawImage(makePlate(o.uncorr, 1, 0, 0, 0, 0, 0), 0, 0);
      } else if (S.mode === "clCyl") {
        const stretch = o.cA > 0.66 ? 0.035 : 0;
        fx.drawImage(makePlate(o.sharp, 1, 0, o.ang, stretch, 0, 0), 0, 0);
      } else {
        fx.drawImage(makePlate(o.residual, 1, 0, 0, 0, 0, 0), 0, 0);
      }
    } else {
      const outside = makePlate(o.uncorr, 1, 0, 0, 0, 0, 0);
      fx.save();
      if (gap) {
        fx.beginPath();
        fx.rect(0, 0, VW, VH);
        fx.ellipse(ZX, ZY, ZRX + 16, ZRY + 16, 0, 0, Math.PI * 2);
        fx.clip("evenodd");
      }
      if (S.outside) fx.drawImage(outside, 0, 0);
      else {
        fx.fillStyle = "#14181e";
        fx.fillRect(0, 0, VW, VH);
      }
      fx.restore();
      if (!S.outside) {
        fx.save();
        zonePath(fx, -2);
        fx.strokeStyle = "#3a414c";
        fx.lineWidth = 16;
        fx.stroke();
        fx.restore();
      }
      if (gap) {
        fx.save();
        fx.beginPath();
        fx.ellipse(ZX, ZY, ZRX + 16, ZRY + 16, 0, 0, Math.PI * 2);
        fx.ellipse(ZX, ZY, ZRX - inset, ZRY - inset, 0, 0, Math.PI * 2);
        fx.fillStyle = "rgba(58, 46, 30, 0.94)";
        fx.fill("evenodd");
        fx.restore();
      }

      const stretch = S.mode === "specCyl" ? 0.13 * o.cA : 0;
      const svScene = S.mode === "specCyl" ? o.sharp : o.residual;
      const sv = makePlate(svScene, o.mag, o.pinch, o.ang, stretch, 0, 0);
      paintZone(sv, inset);

      if (S.zone) {
        fx.save();
        zonePath(fx, inset);
        fx.strokeStyle = "rgba(240,160,48,.95)";
        fx.lineWidth = 2.5;
        fx.stroke();
        fx.restore();
        label(T.zone, ZX, Math.max(16, ZY - ZRY - 16));
        if (S.outside) label(T.zoneOut, 70, ZY);
        if (gap) label(T.zoneGap, ZX + ZRX + 8, ZY + ZRY * 0.72);
      }
    }
  }

  function sphereWords() {
    const { sign, amt } = sphereState();
    if (sign === "plano" || amt < 0.06) return T.plano;
    const side = sign === "plus" ? T.signPlus : T.signMinus;
    const band = amt < 0.34 ? T.amtLight : amt < 0.67 ? T.amtMid : T.amtHigh;
    return band + " " + side;
  }
  function cylWords() {
    const a = cylAmt();
    if (a < 0.04) return T.amtNone;
    if (a < 0.34) return T.amtLight;
    if (a < 0.67) return T.amtMid;
    return T.amtHigh;
  }

  function captionText() {
    const { sign, amt } = sphereState();
    const quiet = amt < 0.04 && cylAmt() < 0.04;
    if (quiet) return T.zeroState;
    const map = {
      sv: sign === "minus" ? T.capMyope : T.capHyper,
      specCyl: T.capSpecCyl,
      cl: T.capCl, clCyl: T.capClCyl, clPlain: T.capClPlain,
    };
    let text = map[S.mode] || "";
    if (S.mode === "sv" && sign === "plus" && amt > 0.72) text += " " + T.capHyperGap;
    if (S.mode === "clCyl" && cylAmt() < 0.04) text += " " + T.capClSame;
    return text;
  }

  function fillSeg(id, key, options) {
    const host = $(id);
    host.setAttribute("aria-label", T[key] || "");
    host.replaceChildren();
    options.forEach(([value, labelKey]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.k = key === "groupCompare" ? "mode" : host.dataset.k;
      b.dataset.v = value;
      b.textContent = T[labelKey];
      host.appendChild(b);
    });
  }

  function buildControls() {
    $("grp-mode").dataset.k = "mode";
    $("grp-mer").dataset.k = "mer";
    fillSeg("grp-mode", "groupCompare", [
      ["sv", "modeSv"], ["specCyl", "modeSpecCyl"],
      ["cl", "modeCl"], ["clCyl", "modeClCyl"], ["clPlain", "modeClPlain"],
    ]);
    fillSeg("grp-mer", "meridian", [["h", "merH"], ["o", "merO"], ["v", "merV"]]);
    $("pageCap").textContent = T.pageCap;
    $("lab-compare").textContent = T.groupCompare;
    $("lab-rx").textContent = T.groupRx;
    $("rxNote").textContent = T.rxNote;
    $("lab-sphere").textContent = T.sphereAmt;
    $("end-plus").textContent = T.signPlus;
    $("end-plano").textContent = T.plano;
    $("end-minus").textContent = T.signMinus;
    $("end-cyl0").textContent = T.amtNone;
    $("end-cyl1").textContent = T.amtHigh;
    $("rng-sphere").setAttribute("aria-label", T.sphereAmt);
    $("rng-cyl").setAttribute("aria-label", T.cylAmt);
    $("lab-cyl").textContent = T.cylAmt;
    $("lab-mer").textContent = T.meridian;
    $("lab-show").textContent = T.groupShow;
    $("lab-zone").textContent = T.showZone;
    $("lab-out").textContent = T.showOutside;
    document.documentElement.lang = T.htmlLang;
    document.title = T.title;
  }

  function syncUi() {
    const spec = isSpec();
    document.querySelectorAll("#sim button[data-k]").forEach((b) => {
      const k = b.dataset.k;
      const v = b.dataset.v;
      const on = S[k] === v;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      let disabled = false;
      if (k === "mer") disabled = cylAmt() < 0.04;
      b.disabled = disabled;
    });
    $("rng-sphere").value = String(S.sphere);
    $("rng-cyl").value = String(S.cyl);
    $("sphereLive").textContent = sphereWords();
    $("cylLive").textContent = cylWords();
    $("chk-zone").checked = S.zone;
    $("chk-out").checked = S.outside;
    $("chk-out").disabled = !spec;
    const hints = [];
    if (cylAmt() < 0.04) hints.push(T.hintMeridian);
    if (!spec) hints.push(T.hintOutside);
    $("hints").replaceChildren();
    hints.forEach((text) => {
      const p = document.createElement("p");
      p.className = "hint";
      p.textContent = text;
      $("hints").appendChild(p);
    });
    $("modeCap").textContent = captionText();
    const showFixed = !spec && S.zone;
    $("noFixed").hidden = !showFixed;
    $("noFixed").textContent = T.noFixedZone;
  }

  function render() {
    draw();
    syncUi();
    reportHeight();
  }

  $("sim").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-k]");
    if (!b || b.disabled) return;
    S[b.dataset.k] = b.dataset.v;
    render();
  });
  $("rng-sphere").addEventListener("input", (ev) => { S.sphere = Number(ev.target.value); render(); });
  $("rng-cyl").addEventListener("input", (ev) => { S.cyl = Number(ev.target.value); render(); });
  $("chk-zone").addEventListener("change", (ev) => { S.zone = ev.target.checked; render(); });
  $("chk-out").addEventListener("change", (ev) => { S.outside = ev.target.checked; render(); });

  function reportHeight() {
    const h = Math.ceil($("sim").getBoundingClientRect().height || 900);
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "eyesinfo-spectacle-image-height", height: h }, "*");
    }
  }
  window.addEventListener("load", reportHeight);
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(reportHeight).observe($("sim"));

  buildControls();
  render();
})();
  </script>

(() => {

      barrelSub: "Barrel · {s}近視示意", pinSub: "Pincushion · {s}遠視示意",
      sLight: "輕度", sMid: "中度", sHigh: "較強",
      foot: "示意效果已放大，方便觀察。實際感覺因度數、鏡框及鏡片設計而異。滑桿是示意設定，不是你的處方，亦不能預測戴鏡後的感受。不能代替註冊醫生。本站不提供診斷、處方、預約、購買或轉介。",
    },
    "zh-Hans": {
      cap: "教育示意 · 不是视力检查、验光或配镜评估。",
      tabDist: "直线变形", tabAdv: "散光与隐形眼镜", tabsLabel: "查看方式",
      pillL: "未戴镜（直线）", pillR: "镜片所见",
      canvasLabel: "比较线位置。左边是没有镜片的画面，右边是透过镜片所见的画面。",
      how: ["左右拖动画面中的白线", "红色虚线＝直线应该在的位置", "看格线有没有向外或向内弯"],
      labS: "镜片度数（示意）",
      endMinusB: "近视眼镜", endMinusS: "负度", endPlano: "平光", endPlusB: "远视眼镜", endPlusS: "正度",
      guide: "显示直线参考（红色虚线）",
      tileBarrelB: "桶状变形", tileBarrelS: "近视眼镜 · 格线向外凸",
      tilePinB: "枕状变形", tilePinS: "远视眼镜 · 格线向内凹",
      planoTitle: "平光", planoBody: "没有镜片度数，直线保持笔直。向左（近视）或向右（远视）拖动滑杆。",
      barrelTitle: "桶状变形", barrelBody: "近视（负度）镜片令景物缩小，越近镜边缩得越多，直线向外凸出，像木桶。",
      pinTitle: "枕状变形", pinBody: "远视（正度）镜片令景物放大，越近镜边放得越大，直线向内凹，四角被拉开，像枕头。",
      barrelSub: "Barrel · {s}近视示意", pinSub: "Pincushion · {s}远视示意",
      sLight: "轻度", sMid: "中度", sHigh: "较强",
      foot: "示意效果已放大，方便观察。实际感觉因度数、镜框及镜片设计而异。滑杆是示意设定，不是你的处方，也不能预测戴镜后的感受。不能代替注册医生。本站不提供诊断、处方、预约、购买或转介。",
    },
    en: {
      cap: "Education illustration · not a vision test, refraction, or dispensing assessment.",
      tabDist: "Straight-line distortion", tabAdv: "Astigmatism & contact lenses", tabsLabel: "View",
      pillL: "No lens (straight)", pillR: "Through the lens",
      canvasLabel: "Comparison divider. Left: view without a lens. Right: view through the lens.",
      how: ["Drag the white line left and right", "Red dashed = where the straight lines should be", "Look for grid lines bending outward or inward"],
      labS: "Lens power (illustration)",
      endMinusB: "Myopia glasses", endMinusS: "minus", endPlano: "Plano", endPlusB: "Hyperopia glasses", endPlusS: "plus",
      guide: "Show straight-line guide (red dashed)",
      tileBarrelB: "Barrel distortion", tileBarrelS: "Myopia glasses · lines bulge outward",
      tilePinB: "Pincushion distortion", tilePinS: "Hyperopia glasses · lines curve inward",
      planoTitle: "Plano", planoBody: "No lens power, so straight lines stay straight. Drag the slider left (myopia) or right (hyperopia).",
      barrelTitle: "Barrel distortion", barrelBody: "Myopia (minus) lenses make things look smaller, and more so toward the edge of the lens, so straight lines bulge outward like a barrel.",
      pinTitle: "Pincushion distortion", pinBody: "Hyperopia (plus) lenses make things look larger, and more so toward the edge of the lens, so straight lines curve inward and the corners stretch out like a pincushion.",
      barrelSub: "Barrel · {s} myopia illustration", pinSub: "Pincushion · {s} hyperopia illustration",
      sLight: "Mild", sMid: "Moderate", sHigh: "Stronger",
      foot: "The effect is exaggerated so it is easy to see. What you actually notice depends on the power, the frame and the lens design. The slider is an illustration, not your prescription, and cannot predict how glasses will feel. This is not a substitute for a registered doctor. This site does not offer diagnosis, prescriptions, booking, purchase or referral.",
    },
    ja: {
      cap: "教育用図示 · 視力検査、屈折検査、眼鏡合わせではありません。",
      tabDist: "直線のゆがみ", tabAdv: "乱視とコンタクトレンズ", tabsLabel: "表示",
      pillL: "レンズなし（直線）", pillR: "レンズ越し",
      canvasLabel: "比較線の位置。左はレンズなし、右はレンズ越しの見え方です。",
      how: ["白い線を左右にドラッグ", "赤い破線＝直線があるはずの位置", "格子の線が外や内に曲がっているか見る"],
      labS: "レンズ度数（図示）",
      endMinusB: "近視用の眼鏡", endMinusS: "マイナス", endPlano: "正視", endPlusB: "遠視用の眼鏡", endPlusS: "プラス",
      guide: "直線の目安を表示（赤い破線）",
      tileBarrelB: "樽型のゆがみ", tileBarrelS: "近視用の眼鏡 · 線が外にふくらむ",
      tilePinB: "糸巻き型のゆがみ", tilePinS: "遠視用の眼鏡 · 線が内にへこむ",
      planoTitle: "正視", planoBody: "レンズ度数がないので、直線はまっすぐのままです。スライダーを左（近視）または右（遠視）へ動かしてください。",
      barrelTitle: "樽型のゆがみ", barrelBody: "近視（マイナス）のレンズは物を小さく見せ、レンズの縁ほど小さくなるため、直線が外にふくらんで樽のように見えます。",
      pinTitle: "糸巻き型のゆがみ", pinBody: "遠視（プラス）のレンズは物を大きく見せ、レンズの縁ほど大きくなるため、直線が内にへこみ、四隅が引き伸ばされて糸巻きのように見えます。",
      barrelSub: "Barrel · {s}の近視図示", pinSub: "Pincushion · {s}の遠視図示",
      sLight: "弱", sMid: "中", sHigh: "強",
      foot: "見やすいように効果を強調しています。実際の見え方は度数、フレーム、レンズ設計で異なります。スライダーは図示用の設定で、あなたの処方ではなく、眼鏡をかけたときの感覚を予測するものでもありません。登録医の代わりにはなりません。当サイトは診断、処方、予約、購入、紹介を行いません。",
    },
  };

  const norm = (raw) => {
    const v = (raw || "").trim();
    if (v === "zh" || v === "zh-Hant" || v === "zh-hant") return "zh-Hant";
    if (v === "zh-Hans" || v === "zh-hans" || v === "zh-CN" || v === "zh-cn") return "zh-Hans";
    if (v === "ja" || v === "jp") return "ja";
    if (v === "en") return "en";
    return "zh-Hant";
  };
  const qs = new URLSearchParams(location.search);
  const D = I18N_D[norm(qs.get("lang"))];

  const VW = 960, VH = 540, SW = 1728, SH = 972, P = 120;
  const $ = (id) => document.getElementById(id);
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

  const src = mk(SW, SH);
  (function build() {
    const x = src.getContext("2d");
    const g = x.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, "#7fbdf0"); g.addColorStop(0.6, "#d9eeff"); g.addColorStop(0.6, "#a6d28f"); g.addColorStop(1, "#68a85f");
    x.fillStyle = g; x.fillRect(0, 0, SW, SH);
    x.fillStyle = "#ffd66b"; x.beginPath(); x.arc(SW * 0.68, SH * 0.3, 78, 0, Math.PI * 2); x.fill();
    x.fillStyle = "#86b878"; x.beginPath(); x.moveTo(0, SH * 0.62);
    x.quadraticCurveTo(SW * 0.2, SH * 0.42, SW * 0.45, SH * 0.62); x.quadraticCurveTo(SW * 0.7, SH * 0.5, SW, SH * 0.62);
    x.lineTo(SW, SH); x.lineTo(0, SH); x.fill();
    x.fillStyle = "#4f8f4a"; x.fillRect(0, SH * 0.82, SW, SH * 0.18);
    const cx = SW / 2, cy = SH / 2;
    x.lineCap = "butt";
    const lines = (w, col) => {
      x.lineWidth = w; x.strokeStyle = col; x.beginPath();
      for (let k = -Math.ceil(cx / P); k <= Math.ceil(cx / P); k++) { x.moveTo(cx + k * P, 0); x.lineTo(cx + k * P, SH); }
      for (let k = -Math.ceil(cy / P); k <= Math.ceil(cy / P); k++) { x.moveTo(0, cy + k * P); x.lineTo(SW, cy + k * P); }
      x.stroke();
    };
    lines(13, "#2b3340"); lines(6, "#f6f2ea");
  })();
  const sd = src.getContext("2d").getImageData(0, 0, SW, SH).data;

  // s in [-1, 1]; negative = minus lens (barrel), positive = plus lens (pincushion).
  const params = (s) => ({ m: s >= 0 ? 1 + 0.08 * s : 1 + 0.10 * s, pinch: s >= 0 ? 0.20 * s : 0.32 * s });

  function distort(ctx, w, h, s) {
    const { m, pinch } = params(s);
    const k = w / VW;
    const out = ctx.createImageData(w, h), od = out.data;
    const maxX = SW - 1.001, maxY = SH - 1.001, hw = w / 2, hh = h / 2;
    for (let y = 0; y < h; y++) {
      const ny = (y - hh) / hh;
      for (let x = 0; x < w; x++) {
        const nx = (x - hw) / hw;
        const r2 = nx * nx + ny * ny;
        // Plus: ease the corners. A plain r² term hooked the left and right
        // edges of the strong-plus preview. Still a sketch, not a lens model.
        const pinchTerm = pinch > 0 ? (pinch * r2) / (1 + 0.65 * r2) : pinch * r2;
        let radial = 1 - pinchTerm;
        if (radial < 0.45) radial = 0.45; else if (radial > 2) radial = 2;
        let sx = SW / 2 + ((x - hw) / k) * radial / m;
        let sy = SH / 2 + ((y - hh) / k) * radial / m;
        if (sx < 0) sx = 0; else if (sx > maxX) sx = maxX;
        if (sy < 0) sy = 0; else if (sy > maxY) sy = maxY;
        const x0 = sx | 0, y0 = sy | 0, fx = sx - x0, fy = sy - y0;
        const i = (y0 * SW + x0) * 4, j = i + SW * 4;
        const a = (1 - fx) * (1 - fy), b = fx * (1 - fy), c = (1 - fx) * fy, d = fx * fy;
        const o = (y * w + x) * 4;
        od[o] = sd[i] * a + sd[i + 4] * b + sd[j] * c + sd[j + 4] * d;
        od[o + 1] = sd[i + 1] * a + sd[i + 5] * b + sd[j + 1] * c + sd[j + 5] * d;
        od[o + 2] = sd[i + 2] * a + sd[i + 6] * b + sd[j + 2] * c + sd[j + 6] * d;
        od[o + 3] = 255;
      }
    }
    ctx.putImageData(out, 0, 0);
  }

  function drawGuides(ctx, w, h, s, fromX) {
    const { m } = params(s);
    const k = w / VW, step = P * m * k;
    ctx.save();
    ctx.beginPath(); ctx.rect(fromX, 0, w - fromX, h); ctx.clip();
    ctx.setLineDash([10 * k, 8 * k]); ctx.lineWidth = 2.5 * k; ctx.strokeStyle = "#ff5d7a"; ctx.beginPath();
    for (let i = -12; i <= 12; i++) { ctx.moveTo(w / 2 + i * step, 0); ctx.lineTo(w / 2 + i * step, h); }
    for (let i = -8; i <= 8; i++) { ctx.moveTo(0, h / 2 + i * step); ctx.lineTo(w, h / 2 + i * step); }
    ctx.stroke(); ctx.restore();
  }

  const cv = $("dcv"), cx = cv.getContext("2d");
  const lensCv = mk(VW, VH), lensCx = lensCv.getContext("2d");
  const st = { s: -0.7, div: 0.5, guide: true };

  const ICON = {
    barrel: '<svg viewBox="0 0 36 36" fill="none" stroke="#e7b15a" stroke-width="2.4" stroke-linecap="round"><path d="M9 6Q3 18 9 30M18 5Q18 18 18 31M27 6Q33 18 27 30M7 10Q18 6 29 10M7 18H29M7 26Q18 30 29 26"/></svg>',
    pin: '<svg viewBox="0 0 36 36" fill="none" stroke="#7eb6e6" stroke-width="2.4" stroke-linecap="round"><path d="M7 6Q13 18 7 30M18 5V31M29 6Q23 18 29 30M7 7Q18 13 29 7M7 18H29M7 29Q18 23 29 29"/></svg>',
    plano: '<svg viewBox="0 0 36 36" fill="none" stroke="#d7dde6" stroke-width="2.4" stroke-linecap="round"><path d="M8 6V30M18 6V30M28 6V30M6 9H30M6 18H30M6 27H30"/></svg>',
  };

  function strengthWord() {
    const a = Math.abs(st.s);
    return a < 0.34 ? D.sLight : a < 0.67 ? D.sMid : D.sHigh;
  }

  function verdict() {
    const a = Math.abs(st.s), v = $("verdict");
    let kind = "plano", title = D.planoTitle, sub = "", body = D.planoBody;
    if (a >= 0.05) {
      if (st.s < 0) { kind = "barrel"; title = D.barrelTitle; sub = D.barrelSub.replace("{s}", strengthWord()); body = D.barrelBody; }
      else { kind = "pin"; title = D.pinTitle; sub = D.pinSub.replace("{s}", strengthWord()); body = D.pinBody; }
    }
    v.dataset.kind = kind;
    $("dBadge").innerHTML = ICON[kind];
    const h = $("vTitle");
    h.textContent = title;
    if (sub) { const sm = document.createElement("small"); sm.textContent = sub; h.appendChild(sm); }
    $("vBody").textContent = body;
    document.querySelectorAll(".d-tile").forEach((t) => t.setAttribute("aria-pressed", String(t.dataset.t === kind)));
  }

  function arrow(x, y, dir) {
    cx.beginPath();
    cx.moveTo(x + dir * 5, y - 8); cx.lineTo(x + dir * 5, y + 8); cx.lineTo(x + dir * 15, y);
    cx.closePath(); cx.fillStyle = "#1a1206"; cx.fill();
  }

  function draw() {
    distort(lensCx, VW, VH, st.s);
    cx.setTransform(1, 0, 0, 1, 0, 0);
    const dx = Math.round(st.div * VW);
    cx.drawImage(src, SW / 2 - VW / 2, SH / 2 - VH / 2, VW, VH, 0, 0, VW, VH);
    cx.save(); cx.beginPath(); cx.rect(dx, 0, VW - dx, VH); cx.clip(); cx.drawImage(lensCv, 0, 0); cx.restore();
    if (st.guide && Math.abs(st.s) >= 0.05) drawGuides(cx, VW, VH, st.s, dx);
    cx.fillStyle = "#fff"; cx.fillRect(dx - 2, 0, 4, VH);
    cx.beginPath(); cx.arc(dx, VH / 2, 26, 0, Math.PI * 2); cx.fillStyle = "#fff"; cx.fill();
    cx.lineWidth = 4; cx.strokeStyle = "#1a1206"; cx.stroke();
    arrow(dx, VH / 2, -1); arrow(dx, VH / 2, 1);
    cv.setAttribute("aria-valuenow", String(Math.round(st.div * 100)));
    verdict();
  }

  let queued = false;
  const render = () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; draw(); }); };

  function tile(id, s) {
    const c = $(id), x = c.getContext("2d");
    distort(x, c.width, c.height, s);
    drawGuides(x, c.width, c.height, s, 0);
  }

  function setText() {
    $("tabDist").textContent = D.tabDist;
    $("tabAdv").textContent = D.tabAdv;
    $("tabs").setAttribute("aria-label", D.tabsLabel);
    $("dCap").textContent = D.cap;
    $("pillL").textContent = D.pillL;
    $("pillR").textContent = D.pillR;
    cv.setAttribute("aria-label", D.canvasLabel);
    const how = $("dHow");
    how.replaceChildren();
    D.how.forEach((t, i) => {
      const li = document.createElement("li");
      const b = document.createElement("b");
      b.textContent = "①②③"[i] + " ";
      li.appendChild(b);
      if (i === 1) { const g = document.createElement("span"); g.className = "gd"; li.appendChild(g); }
      li.appendChild(document.createTextNode(t));
      how.appendChild(li);
    });
    $("lab-s").textContent = D.labS;
    $("endMinusB").textContent = D.endMinusB; $("endMinusS").textContent = D.endMinusS;
    $("endPlano").textContent = D.endPlano;
    $("endPlusB").textContent = D.endPlusB; $("endPlusS").textContent = D.endPlusS;
    $("lab-guide").textContent = D.guide;
    $("tBarrelB").textContent = D.tileBarrelB; $("tBarrelS").textContent = D.tileBarrelS;
    $("tPinB").textContent = D.tilePinB; $("tPinS").textContent = D.tilePinS;
    $("dFoot").textContent = D.foot;
  }

  $("rng-s").addEventListener("input", (e) => { st.s = Number(e.target.value) / 100; render(); });
  $("chk-guide").addEventListener("change", (e) => { st.guide = e.target.checked; render(); });
  document.querySelectorAll(".d-tile").forEach((t) => t.addEventListener("click", () => {
    st.s = t.dataset.t === "barrel" ? -0.85 : 0.85; $("rng-s").value = String(Math.round(st.s * 100)); render();
  }));

  let drag = false;
  const move = (e) => { const r = cv.getBoundingClientRect(); st.div = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); render(); };
  cv.addEventListener("pointerdown", (e) => { drag = true; cv.setPointerCapture(e.pointerId); move(e); });
  cv.addEventListener("pointermove", (e) => { if (drag) move(e); });
  cv.addEventListener("pointerup", () => { drag = false; });
  cv.addEventListener("pointercancel", () => { drag = false; });
  cv.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 0.1 : 0.03;
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") st.div = Math.max(0, st.div - step);
    else if (e.key === "ArrowRight" || e.key === "ArrowUp") st.div = Math.min(1, st.div + step);
    else if (e.key === "Home") st.div = 0;
    else if (e.key === "End") st.div = 1;
    else return;
    e.preventDefault(); render();
  });

  const tabD = $("tabDist"), tabA = $("tabAdv"), viewD = $("viewDist"), viewA = $("viewAdv");
  function showTab(which, focus) {
    const adv = which === "adv";
    viewD.hidden = adv; viewA.hidden = !adv;
    tabD.setAttribute("aria-selected", String(!adv)); tabA.setAttribute("aria-selected", String(adv));
    tabD.tabIndex = adv ? -1 : 0; tabA.tabIndex = adv ? 0 : -1;
    if (focus) (adv ? tabA : tabD).focus();
  }
  tabD.addEventListener("click", () => showTab("dist"));
  tabA.addEventListener("click", () => showTab("adv"));
  $("tabs").addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "Home" || e.key === "End") {
      e.preventDefault();
      const toAdv = e.key === "End" || (e.key !== "Home" && tabA.getAttribute("aria-selected") !== "true");
      showTab(toAdv ? "adv" : "dist", true);
    }
  });

  setText();
  tile("tBarrel", -0.85); tile("tPin", 0.85);
  showTab(qs.get("view") === "adv" ? "adv" : "dist");
  draw();
})();
  </script>
