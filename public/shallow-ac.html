const normalizeLang = (raw) => {
  const v = (raw || "").trim();
  if (v === "zh" || v === "zh-Hant" || v === "zh-hant") return "zh-Hant";
  if (v === "zh-Hans" || v === "zh-hans" || v === "zh-CN" || v === "zh-cn") return "zh-Hans";
  if (v === "ja" || v === "jp") return "ja";
  if (v === "en") return "en";
  return "zh-Hant";
};

let uiLang = normalizeLang(new URLSearchParams(location.search).get("lang"));
let T = I18N[uiLang];
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { const x = clamp(t, 0, 1); return x * x * (3 - 2 * x); };

/** Default = patent path so the five-station flow is visible; mid-dilate + shallow to close. */
const S = { depth: 78, lens: 28, pupil: 22 };

function midBell(p01) {
  const x = (p01 - 0.5) / 0.2;
  return Math.exp(-0.5 * x * x);
}

function metrics() {
  const shallow = 1 - S.depth / 100;
  const thick = S.lens / 100;
  const p01 = S.pupil / 100;
  // Pupil block needs shallow AC; mid-dilation alone on a deep chamber stays relatively patent.
  const rawBlock = clamp(
    shallow * 0.35 + midBell(p01) * shallow * (0.7 + thick * 0.35) + thick * shallow * 0.3,
    0,
    1,
  );
  const block = smooth(rawBlock);
  const bombe = smooth(clamp((block - 0.28) / 0.5, 0, 1)) * (0.25 + shallow * 0.75);
  const crowd = shallow * 0.42 + thick * 0.48 + bombe * 0.55;
  const angleOpen = clamp(1 - crowd, 0, 1);
  const tmContact = clamp(1 - angleOpen * 1.15, 0, 1);
  const iop = smooth(clamp(tmContact * 0.75 + block * 0.3 + thick * 0.2, 0, 1));
  const pupilGate = clamp(1 - block * 0.95, 0, 1);
  const tmGate = clamp(1 - tmContact * 0.97, 0, 1);
  return { shallow, thick, p01, block, bombe, angleOpen, tmContact, iop, pupilGate, tmGate };
}

function activeMechs(m) {
  return {
    block: m.block > 0.4 && m.bombe > 0.25,
    thick: m.thick > 0.5,
    shallow: m.shallow > 0.4,
  };
}

function storyFor(m) {
  if (m.tmContact > 0.55 && m.shallow > 0.35 && m.thick > 0.4) return T.storyCrowd;
  if (m.block > 0.45 && m.bombe > 0.3) return T.storyBlock;
  if (m.thick > 0.55) return T.storyThick;
  if (m.shallow > 0.45) return T.storyShallow;
  return T.storyOpen;
}

  document.documentElement.lang = T.htmlLang;
  $("sac-page-cap").textContent = T.pageCap;
  $("sac-mech-title").textContent = T.mechTitle;
  $("sac-depth-lab").textContent = T.depth;
  $("sac-lens-lab").textContent = T.lens;
  $("sac-pupil-lab").textContent = T.pupil;
  $("sac-reset").textContent = T.reset;
  const list = $("sac-mech-list");
  list.innerHTML = "";
  [T.mech1, T.mech2, T.mech3].forEach((text, i) => {
    const li = document.createElement("li");
    li.dataset.mech = ["block", "thick", "shallow"][i];
    li.textContent = text;
    list.appendChild(li);
  });
  let note = document.getElementById("sac-mech-note");
  if (!note) {
    note = document.createElement("p");
    note.id = "sac-mech-note";
    note.style.margin = "8px 0 0";
    note.style.color = "#8b93a3";
    note.style.fontSize = "12.5px";
    list.parentElement.appendChild(note);
  }
  note.textContent = T.mechNote;

  const hint = $("sac-hint");
  hint.innerHTML = "";
  hint.appendChild(document.createTextNode(T.hint + " "));
  const a = document.createElement("a");
  a.href = "/urgent"; a.target = "_top"; a.rel = "noopener";
  a.textContent = T.urgentLink;
  hint.appendChild(a);
  hint.appendChild(document.createTextNode(uiLang === "en" ? "." : "。"));
  syncChrome();
  updateLabels();
  postHeight();
}

function syncChrome() {
  const m = metrics();
  $("sac-depth").value = String(Math.round(S.depth));
  $("sac-lens").value = String(Math.round(S.lens));
  $("sac-pupil").value = String(Math.round(S.pupil));
  const dTag = S.depth >= 55 ? T.deep : S.depth <= 35 ? T.shallow : "";
  $("sac-depthv").textContent = Math.round(S.depth) + "%" + (dTag ? " · " + dTag : "");
  const lTag = S.lens >= 60 ? T.large : S.lens <= 25 ? T.small : "";
  $("sac-lensv").textContent = Math.round(S.lens) + "%" + (lTag ? " · " + lTag : "");
  $("sac-pupilv").textContent = Math.round(S.pupil) + "%";
  $("sac-story").textContent = storyFor(m);

  const act = activeMechs(m);
  [...$("sac-mech-list").children].forEach((li) => {
    li.classList.toggle("on", !!act[li.dataset.mech]);
  });

  const angleLab = m.angleOpen > 0.45 ? T.angleOpen : m.angleOpen > 0.2 ? T.angleNarrow : T.angleClosed;
  const iopLab = m.iop < 0.35 ? T.iopLow : m.iop < 0.65 ? T.iopMid : T.iopHigh;
  const pathLab = m.tmGate > 0.65 && m.pupilGate > 0.65 ? T.pathOk : m.tmGate < 0.3 || m.pupilGate < 0.3 ? T.pathBlocked : T.pathLimited;

  $("sac-chip-angle").innerHTML = `${T.angleStatus}：<strong>${angleLab}</strong>`;
  $("sac-chip-iop").innerHTML = `${T.iopStatus}：<strong>${iopLab}</strong>`;
  $("sac-chip-path").innerHTML = `${T.pathStatus}：<strong>${pathLab}</strong>`;
  $("sac-chip-angle").classList.toggle("warn", m.angleOpen <= 0.2);
  $("sac-chip-iop").classList.toggle("warn", m.iop >= 0.65);
  $("sac-chip-path").classList.toggle("warn", m.tmGate < 0.3 || m.pupilGate < 0.3);
}

/* —— Three.js scene —— */
const view = $("sac-view");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x05070b, 1);
view.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.position = "absolute";
labelRenderer.domElement.style.inset = "0";
labelRenderer.domElement.style.pointerEvents = "none";
view.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 40);
camera.position.set(0.4, 0.55, 4.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0.35, 0, 0);
controls.minDistance = 2.2;
controls.maxDistance = 7;

scene.add(new THREE.AmbientLight(0x8899aa, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.05);
key.position.set(3, 2, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aacc, 0.45);
fill.position.set(-2, -1, 2);
scene.add(fill);

const root = new THREE.Group();
scene.add(root);

function makeLabel(text) {
  const el = document.createElement("div");
  el.className = "label3d";
  el.textContent = text;
  return new CSS2DObject(el);
}

const labels = {
  cornea: makeLabel(""),
  lens: makeLabel(""),
  ciliary: makeLabel(""),
  iris: makeLabel(""),
  tm: makeLabel(""),
  ac: makeLabel(""),
};

// Globe (sclera) — translucent shell
const sclera = new THREE.Mesh(
  new THREE.SphereGeometry(1.55, 48, 32),
  new THREE.MeshStandardMaterial({
    color: 0x1c2836, transparent: true, opacity: 0.22,
    roughness: 0.85, metalness: 0.05, side: THREE.DoubleSide,
  }),
);
root.add(sclera);

// Cornea dome on +X (RIGHT)
const cornea = new THREE.Mesh(
  new THREE.SphereGeometry(0.72, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.55),
  new THREE.MeshPhysicalMaterial({
    color: 0xa8d8ea, transparent: true, opacity: 0.35,
    roughness: 0.15, metalness: 0, transmission: 0.9, thickness: 0.4,
    side: THREE.DoubleSide,
  }),
);
cornea.rotation.z = -Math.PI / 2;
cornea.position.set(1.05, 0, 0);
root.add(cornea);
labels.cornea.position.set(1.55, 0.55, 0);
root.add(labels.cornea);

// Ciliary body (inside, near iris root)
const ciliary = new THREE.Mesh(
  new THREE.TorusGeometry(0.78, 0.11, 12, 48),
  new THREE.MeshStandardMaterial({ color: 0x6a5040, roughness: 0.7 }),
);
ciliary.rotation.y = Math.PI / 2;
root.add(ciliary);
labels.ciliary.position.set(0.15, 0.95, 0);
root.add(labels.ciliary);

// Iris disc with pupil (ring)
const irisMat = new THREE.MeshStandardMaterial({ color: 0x3d5f7a, roughness: 0.65, side: THREE.DoubleSide });
const iris = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.82, 64), irisMat);
iris.rotation.y = Math.PI / 2;
root.add(iris);
labels.iris.position.set(0.55, 0.7, 0.4);
root.add(labels.iris);

// Soft bombé bulge (forward = +X) — scaled with metrics
const bombeMesh = new THREE.Mesh(
  new THREE.TorusGeometry(0.55, 0.08, 10, 48),
  new THREE.MeshStandardMaterial({ color: 0x4a7090, transparent: true, opacity: 0.55 }),
);
bombeMesh.rotation.y = Math.PI / 2;
root.add(bombeMesh);

// Lens
const lensMat = new THREE.MeshPhysicalMaterial({
  color: 0xf0c878, transparent: true, opacity: 0.55,
  roughness: 0.25, transmission: 0.7, thickness: 0.5,
});
const lens = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), lensMat);
lens.scale.set(0.28, 0.55, 0.55);
root.add(lens);
labels.lens.position.set(0.2, -0.05, 0);
root.add(labels.lens);

// TM / angle marker (pair)
const tmMat = new THREE.MeshStandardMaterial({ color: 0x6ecf8e });
const tmA = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), tmMat);
const tmB = tmA.clone();
tmA.position.set(0.95, 0.72, 0);
tmB.position.set(0.95, -0.72, 0);
root.add(tmA, tmB);
labels.tm.position.set(1.05, 0.95, 0);
root.add(labels.tm);

labels.ac.position.set(0.85, 0.15, 0.55);
root.add(labels.ac);

function updateLabels() {
  labels.cornea.element.textContent = T.cornea;
  labels.lens.element.textContent = T.lensLab;
  labels.ciliary.element.textContent = T.ciliary;
  labels.iris.element.textContent = T.iris;
  labels.tm.element.textContent = T.tm;
  labels.ac.element.textContent = T.ac;
}

function applyAnatomy(m) {
  // Lens X: deep (shallow=0) → left/more posterior; shallow → right toward cornea
  const lensX = lerp(0.05, 0.72, m.shallow);
  const lensRX = lerp(0.22, 0.38, m.thick);
  const lensRY = lerp(0.42, 0.62, m.thick);
  lens.position.set(lensX, 0, 0);
  lens.scale.set(lensRX, lensRY, lensRY);
  labels.lens.position.set(lensX - 0.05, -0.02, 0.35);

  // Iris plane just anterior to lens front
  const irisX = lensX + lensRX * 0.15 - 0.12;
  iris.position.x = irisX;
  // Pupil radius from slider
  const pupilR = lerp(0.12, 0.42, m.p01);
  iris.geometry.dispose();
  iris.geometry = new THREE.RingGeometry(pupilR, 0.82, 64);

  // Bombé: move mid-iris torus toward cornea (+X)
  bombeMesh.visible = m.bombe > 0.12;
  bombeMesh.position.x = irisX + 0.06 + m.bombe * 0.22;
  bombeMesh.scale.setScalar(0.85 + m.bombe * 0.25);
  bombeMesh.material.opacity = 0.25 + m.bombe * 0.5;

  ciliary.position.x = irisX - 0.12;

  const tmCol = m.angleOpen > 0.45 ? 0x6ecf8e : m.angleOpen > 0.2 ? 0xf0a030 : 0xe07070;
  tmMat.color.setHex(tmCol);
  // Angle gap: when closed, iris root closer to TM
  const rootY = lerp(0.78, 0.62, 1 - m.angleOpen);
  tmA.position.set(0.95, rootY, 0);
  tmB.position.set(0.95, -rootY, 0);
}

/* —— Aqueous flow 2D: five stations in order; when patent, every particle visits all five —— */
const flow = $("sac-flow");
const fx = flow.getContext("2d");
/** Segments: 0 ciliary→PC, 1 PC→pupil, 2 pupil→AC, 3 AC→TM; seg 4 = dwelling on TM */
/** @type {{ seg: number, u: number, hold: number, alive: boolean }[]} */
const particles = [];

function spawnFlowParticle() {
  particles.push({ seg: 0, u: 0, hold: 0, alive: true });
  if (particles.length > 32) particles.shift();
}

function gateAt(seg, m) {
  if (seg === 1 || seg === 2) return m.pupilGate;
  if (seg === 3) return m.tmGate;
  return 1;
}

function updateFlowParticles(dt, m) {
  if (Math.random() < 0.55) spawnFlowParticle();
  for (const p of particles) {
    if (!p.alive) continue;
    // Completed path: briefly sit on TM (station 5) so the visit is visible
    if (p.seg >= 4) {
      p.hold += dt;
      if (p.hold > 0.4) p.alive = false;
      continue;
    }
    const g = gateAt(p.seg, m);
    if (g < 0.28) {
      // Hard stop — no silent crawl past a closed gate
      p.u = Math.min(p.u + dt * 0.12, 0.86);
      continue;
    }
    const speed = lerp(0.4, 0.95, clamp((g - 0.28) / 0.55, 0, 1));
    p.u += dt * speed;
    while (p.u >= 1 && p.alive && p.seg < 4) {
      p.u -= 1;
      p.seg += 1;
      if (p.seg >= 4) {
        if (m.tmGate < 0.28) {
          p.seg = 3;
          p.u = 0.86;
          break;
        }
        p.u = 0;
        p.hold = 0;
        break;
      }
    }
  }
  for (let i = particles.length - 1; i >= 0; i--) if (!particles[i].alive) particles.splice(i, 1);
}

function drawFlow(m) {
  const W = flow.width, H = flow.height;
  fx.setTransform(1, 0, 0, 1, 0, 0);
  fx.clearRect(0, 0, W, H);
  fx.fillStyle = "#0b0d11";
  fx.fillRect(0, 0, W, H);
  fx.fillStyle = "#c8cdd6";
  fx.font = "13px system-ui";
  fx.fillText(T.flowTitle, 18, 24);

  const nodes = [
    { x: 90, y: 115, lab: T.ciliary },
    { x: 280, y: 115, lab: T.pc },
    { x: 480, y: 115, lab: T.pupilStation },
    { x: 680, y: 115, lab: T.ac },
    { x: 870, y: 115, lab: T.tm },
  ];

  const gates = [1, m.pupilGate, m.pupilGate, m.tmGate];

  for (let i = 0; i < 4; i++) {
    const a = nodes[i], b = nodes[i + 1], g = gates[i];
    fx.strokeStyle = g > 0.65 ? "#6ecf8e" : g > 0.3 ? "#f0a030" : "#e07070";
    fx.lineWidth = 4;
    fx.beginPath();
    fx.moveTo(a.x + 34, a.y);
    fx.lineTo(b.x - 34, b.y);
    fx.stroke();
    fx.fillStyle = fx.strokeStyle;
    fx.beginPath();
    fx.moveTo(b.x - 34, b.y);
    fx.lineTo(b.x - 46, b.y - 7);
    fx.lineTo(b.x - 46, b.y + 7);
    fx.closePath();
    fx.fill();
  }

  nodes.forEach((n, i) => {
    const g = i === 0 ? 1 : gates[i - 1];
    const col = i === 0 ? "#4a90b8" : g > 0.65 ? "#6ecf8e" : g > 0.3 ? "#f0a030" : "#e07070";
    fx.fillStyle = "#1a1f28";
    fx.beginPath();
    fx.arc(n.x, n.y, 32, 0, Math.PI * 2);
    fx.fill();
    fx.strokeStyle = col;
    fx.lineWidth = 3;
    fx.stroke();
    fx.fillStyle = "#e4e4e4";
    fx.font = "11px system-ui";
    fx.textAlign = "center";
    fx.fillText(n.lab, n.x, n.y + 4);
    if (i > 0) {
      fx.fillStyle = col;
      fx.font = "10px system-ui";
      fx.fillText(g > 0.65 ? T.gateOpen : g > 0.3 ? T.gatePartial : T.gateClosed, n.x, n.y + 48);
    }
  });
  fx.textAlign = "left";

  for (const p of particles) {
    if (!p.alive) continue;
    if (p.seg >= 4) {
      const n = nodes[4];
      fx.fillStyle = "#7ec8e3";
      fx.beginPath();
      fx.arc(n.x + Math.sin(p.hold * 12) * 2, n.y, 4, 0, Math.PI * 2);
      fx.fill();
      continue;
    }
    const a = nodes[p.seg], b = nodes[p.seg + 1];
    if (!a || !b) continue;
    const t = clamp(p.u, 0, 1);
    const x = lerp(a.x, b.x, t);
    const y = a.y + Math.sin(t * Math.PI) * -12;
    const g = gates[p.seg];
    fx.fillStyle = g < 0.28 && t > 0.5 ? "#e07070" : "#7ec8e3";
    fx.beginPath();
    fx.arc(x, y, 3.6, 0, Math.PI * 2);
    fx.fill();
  }
}

function resize() {
  const w = view.clientWidth || 640;
  const h = view.clientHeight || 400;
  renderer.setSize(w, h, false);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function postHeight() {
  try {
    const h = Math.ceil(document.documentElement.scrollHeight || 0);
    if (h > 0 && window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "eyesinfo-shallow-ac-height", height: h }, "*");
    }
  } catch (_) { /* ignore */ }
}

$("sac-depth").addEventListener("input", (e) => { S.depth = +e.target.value; syncChrome(); });
$("sac-lens").addEventListener("input", (e) => { S.lens = +e.target.value; syncChrome(); });
$("sac-pupil").addEventListener("input", (e) => { S.pupil = +e.target.value; syncChrome(); });
$("sac-reset").addEventListener("click", () => {
  S.depth = 78; S.lens = 28; S.pupil = 22;
  particles.length = 0;
  syncChrome();
});

window.addEventListener("resize", () => { resize(); postHeight(); });

applyLang();
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const m = metrics();
  applyAnatomy(m);
  updateFlowParticles(dt, m);
  drawFlow(m);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(postHeight, 80);
setTimeout(postHeight, 400);
</script>
