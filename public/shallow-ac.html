const normalizeLang = (raw) => {
  const v = (raw || "").trim();
  if (v === "zh" || v === "zh-Hant" || v === "zh-hant") return "zh-Hant";
  if (v === "zh-Hans" || v === "zh-hans" || v === "zh-CN" || v === "zh-cn") return "zh-Hans";
  if (v === "ja" || v === "jp") return "ja";
  if (v === "en") return "en";
  return "zh-Hant";
};

let uiLang = normalizeLang(new URLSearchParams(location.search).get("lang"));
let T = I18N[uiLang];
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { const x = clamp(t, 0, 1); return x * x * (3 - 2 * x); };

/** depth: 0 = shallow (lens left/near cornea), 100 = deep (lens right/far) — matches slider label 「深度」 */
const S = { depth: 70, lens: 35, pupil: 45 };

function midBell(p01) {
  const x = (p01 - 0.5) / 0.22;
  return Math.exp(-0.5 * x * x);
}

function metrics() {
  // UI depth 100 = deep → shallowFactor 0; UI depth 0 = shallow → shallowFactor 1
  const shallow = 1 - S.depth / 100;
  const thick = S.lens / 100;
  const p01 = S.pupil / 100;
  const rawBlock = clamp(shallow * 0.45 + midBell(p01) * (0.4 + shallow * 0.45) + thick * 0.15, 0, 1);
  const block = smooth(rawBlock);
  const bombe = smooth(clamp((block - 0.22) / 0.55, 0, 1)) * (0.35 + shallow * 0.65);
  const crowd = shallow * 0.4 + thick * 0.45 + bombe * 0.55;
  const angleOpen = clamp(1 - crowd, 0, 1);
  const tmContact = clamp(1 - angleOpen * 1.12, 0, 1);
  const iop = smooth(clamp(tmContact * 0.75 + block * 0.3 + thick * 0.2, 0, 1));
  const pupilGate = 1 - block * 0.92;
  const tmGate = 1 - tmContact * 0.95;
  return { shallow, thick, p01, block, bombe, angleOpen, tmContact, iop, pupilGate, tmGate };
}

function storyFor(m) {
  if (m.tmContact > 0.55 && m.shallow > 0.35 && m.thick > 0.4) return T.storyCrowd;
  if (m.block > 0.45 && m.bombe > 0.3) return T.storyBlock;
  if (m.thick > 0.55) return T.storyThick;
  if (m.shallow > 0.45) return T.storyShallow;
  return T.storyOpen;
}

const particles = [];
function spawnParticle() {
  particles.push({ t: 0, speed: 0.18 + Math.random() * 0.12, alive: true });
  if (particles.length > 40) particles.shift();
}

function applyLang(lang) {
  uiLang = normalizeLang(lang);
  T = I18N[uiLang];

  $("sac-page-cap").textContent = T.pageCap;
  $("sac-depth-lab").textContent = T.depth;
  $("sac-lens-lab").textContent = T.lens;
  $("sac-pupil-lab").textContent = T.pupil;
  $("sac-reset").textContent = T.reset;
  const hint = $("sac-hint");
  hint.innerHTML = "";
  hint.appendChild(document.createTextNode(T.hint + " "));
  const a = document.createElement("a");
  a.href = "/urgent";
  a.target = "_top";
  a.rel = "noopener";
  a.textContent = T.urgentLink;
  hint.appendChild(a);
  hint.appendChild(document.createTextNode(uiLang === "en" ? "." : "。"));
  syncLabels();
  postHeight();
}

function syncLabels() {
  $("sac-depth").value = String(Math.round(S.depth));
  $("sac-lens").value = String(Math.round(S.lens));
  $("sac-pupil").value = String(Math.round(S.pupil));
  // Show deep←→shallow hint on depth value
  const dTag = S.depth >= 55 ? T.deep : S.depth <= 35 ? T.shallow : "";
  $("sac-depthv").textContent = Math.round(S.depth) + "%" + (dTag ? " · " + dTag : "");
  const lTag = S.lens >= 60 ? T.large : S.lens <= 25 ? T.small : "";
  $("sac-lensv").textContent = Math.round(S.lens) + "%" + (lTag ? " · " + lTag : "");
  $("sac-pupilv").textContent = Math.round(S.pupil) + "%";
  $("sac-story").textContent = storyFor(metrics());
}

const sag = $("sac-sag"), sx = sag.getContext("2d");
const flow = $("sac-flow"), fx = flow.getContext("2d");
const SW = 960, SH = 440, FW = 960, FH = 200;

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawGauge(ctx, x, y, w, h, value, title, low, mid, high) {
  ctx.fillStyle = "#1a1f28";
  roundRect(ctx, x, y, w, h, 10); ctx.fill();
  ctx.fillStyle = "#c8cdd6";
  ctx.font = "12px system-ui";
  ctx.textAlign = "left";
  ctx.fillText(title, x + 12, y + 18);
  const bx = x + 12, by = y + 32, bw = w - 24, bh = 12;
  ctx.fillStyle = "#0b0d11";
  roundRect(ctx, bx, by, bw, bh, 6); ctx.fill();
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, "#6ecf8e");
  g.addColorStop(0.55, "#f0a030");
  g.addColorStop(1, "#e07070");
  ctx.fillStyle = g;
  roundRect(ctx, bx, by, Math.max(4, bw * clamp(value, 0, 1)), bh, 6); ctx.fill();
  ctx.fillStyle = "#9aa3b2";
  ctx.font = "11px system-ui";
  ctx.fillText(low, bx, by + 28);
  ctx.textAlign = "center";
  ctx.fillText(mid, bx + bw / 2, by + 28);
  ctx.textAlign = "right";
  ctx.fillText(high, bx + bw, by + 28);
  ctx.textAlign = "left";
}

function wrapCenter(ctx, text, x, y, maxW, lh) {
  const chars = [...text];
  let line = "", lines = [];
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = ch; }
    else line = test;
  }
  if (line) lines.push(line);
  const start = y - ((lines.length - 1) * lh) / 2;
  lines.forEach((l, i) => ctx.fillText(l, x, start + i * lh));
}

/**
 * Layout: cornea = LEFT arc. Inside eye = right of cornea (left half of globe).
 * Lens X moves left↔right with AC depth.
 */
function layout(m) {
  const CX = 400, CY = 225;
  const RX = 200, RY = 158;
  // Cornea apex (leftmost)
  const corneaX = CX - RX - 8;
  // Lens horizontal travel: deep → right, shallow → left (toward cornea)
  const lensXDeep = CX - 10;
  const lensXShallow = CX - RX + 78;
  const lensCX = lerp(lensXShallow, lensXDeep, 1 - m.shallow);
  const lensRX = lerp(24, 44, m.thick);
  const lensRY = lerp(48, 70, m.thick);
  const pupilHalf = lerp(11, 50, m.p01);
  // Iris plane just in front of lens anterior surface
  const lensFront = lensCX - lensRX;
  const irisX = lensFront - 6;
  const angleTop = { x: CX - RX + 36, y: CY - RY + 52 };
  const angleBot = { x: CX - RX + 36, y: CY + RY - 52 };
  return { CX, CY, RX, RY, corneaX, lensCX, lensRX, lensRY, pupilHalf, irisX, lensFront, angleTop, angleBot };
}

function irisCurveY(side, t, L) {
  const rootY = side < 0 ? L.angleTop.y + 6 : L.angleBot.y - 6;
  const pupilY = L.CY + side * L.pupilHalf;
  return lerp(rootY, pupilY, smooth(t));
}

function irisCurveX(t, L, m) {
  const rootX = L.angleTop.x + 10;
  const pupilX = L.lensFront - 1;
  let x = lerp(rootX, pupilX, smooth(t));
  // Bombé: peripheral mid-iris bows LEFT (anterior / toward cornea)
  if (m.bombe > 0.05) x -= Math.sin(Math.PI * t) * m.bombe * 34;
  // Thicker lens nudges leaflet slightly anterior
  x -= m.thick * 6 * (1 - t);
  return x;
}

function aqueousPathPts(L, m) {
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    let x, y;
    if (t < 0.22) {
      const u = t / 0.22;
      x = lerp(L.irisX + 24, L.lensFront + 6, u);
      y = lerp(L.CY - L.RY + 38, L.CY - L.pupilHalf - 4, u);
    } else if (t < 0.45) {
      const u = (t - 0.22) / 0.23;
      x = irisCurveX(1, L, m);
      y = lerp(L.CY - L.pupilHalf, L.CY + L.pupilHalf * 0.2, u);
    } else if (t < 0.7) {
      const u = (t - 0.45) / 0.25;
      x = lerp(irisCurveX(1, L, m) - 2, L.CX - L.RX + 88, u);
      y = lerp(L.CY, L.CY + 48, u);
    } else {
      const u = (t - 0.7) / 0.3;
      x = lerp(L.CX - L.RX + 88, L.CX - L.RX + 40, u);
      y = lerp(L.CY + 48, L.CY + L.RY - 52, u);
    }
    pts.push([x, y]);
  }
  return pts;
}

function drawSagittal(m) {
  const ctx = sx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, SW, SH);
  ctx.fillStyle = "#0b0d11";
  ctx.fillRect(0, 0, SW, SH);

  const L = layout(m);

  // Globe
  ctx.fillStyle = "#1a222c";
  ctx.beginPath();
  ctx.ellipse(L.CX, L.CY, L.RX, L.RY, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#3a4555";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Cornea = LEFT arc (outside / anterior wall)
  ctx.strokeStyle = "#8fd0e8";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.ellipse(L.CX - L.RX + 22, L.CY, 56, 82, 0, -1.28, 1.28);
  ctx.stroke();
  ctx.strokeStyle = "rgba(143,208,232,0.3)";
  ctx.lineWidth = 11;
  ctx.beginPath();
  ctx.ellipse(L.CX - L.RX + 22, L.CY, 48, 74, 0, -1.18, 1.18);
  ctx.stroke();

  // Clip interior of globe — lens & CB must stay inside
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(L.CX, L.CY, L.RX - 4, L.RY - 4, 0, 0, Math.PI * 2);
  ctx.clip();

  if (m.block > 0.25) {
    ctx.fillStyle = `rgba(224,112,112,${0.06 + m.block * 0.14})`;
    ctx.fillRect(L.irisX - 4, L.CY - L.pupilHalf - 16, L.lensRX * 2 + 30, L.pupilHalf * 2 + 32);
  }

  // AC wash between cornea and iris (left of iris, inside arc)
  ctx.fillStyle = m.tmContact > 0.55
    ? "rgba(224,112,112,0.2)"
    : m.block > 0.4
      ? "rgba(240,160,48,0.15)"
      : "rgba(126,200,227,0.16)";
  ctx.beginPath();
  ctx.ellipse(L.CX - L.RX + 22, L.CY, 50, 76, 0, -1.2, 1.2);
  for (let i = 24; i >= 0; i--) ctx.lineTo(irisCurveX(i / 24, L, m), irisCurveY(1, i / 24, L));
  for (let i = 0; i <= 24; i++) ctx.lineTo(irisCurveX(i / 24, L, m), irisCurveY(-1, i / 24, L));
  ctx.closePath();
  ctx.fill();

  // Ciliary body — inside globe, at iris root (left half, behind iris root)
  ctx.fillStyle = "#6a5040";
  for (const side of [-1, 1]) {
    const cy = L.CY + side * (L.RY - 44);
    const cbx = L.angleTop.x + 22;
    ctx.beginPath();
    ctx.moveTo(cbx - 4, cy);
    ctx.lineTo(cbx + 26, cy + side * 6);
    ctx.lineTo(cbx + 20, cy + side * 26);
    ctx.lineTo(cbx - 8, cy + side * 16);
    ctx.closePath();
    ctx.fill();
  }

  // Lens — INSIDE arc / inside globe; X from AC depth
  ctx.fillStyle = "rgba(240,200,120,0.48)";
  ctx.beginPath();
  ctx.ellipse(L.lensCX, L.CY, L.lensRX, L.lensRY, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#f0a030";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Iris
  ctx.fillStyle = "#3d5f7a";
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(irisCurveX(0, L, m), irisCurveY(side, 0, L));
    for (let i = 1; i <= 28; i++) {
      const t = i / 28;
      ctx.lineTo(irisCurveX(t, L, m), irisCurveY(side, t, L));
    }
    ctx.lineTo(irisCurveX(1, L, m) + 10, irisCurveY(side, 1, L) + side * 6);
    ctx.lineTo(irisCurveX(0, L, m) + 12, irisCurveY(side, 0, L) + side * 14);
    ctx.closePath();
    ctx.fill();
  }

  if (m.block > 0.3) {
    ctx.strokeStyle = `rgba(224,112,112,${0.45 + m.block * 0.45})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(irisCurveX(1, L, m), L.CY - L.pupilHalf);
    ctx.lineTo(irisCurveX(1, L, m), L.CY + L.pupilHalf);
    ctx.stroke();
    ctx.fillStyle = "#e07070";
    ctx.font = "bold 12px system-ui";
    ctx.fillText(T.pupilBlock, irisCurveX(1, L, m) + 6, L.CY - L.pupilHalf - 10);
  }

  // Angle marker
  const tmX = L.CX - L.RX + 40;
  const tmY = L.CY + L.RY - 52;
  ctx.strokeStyle = m.angleOpen > 0.45 ? "#6ecf8e" : m.angleOpen > 0.2 ? "#f0a030" : "#e07070";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(tmX, tmY);
  ctx.lineTo(irisCurveX(0.1, L, m), irisCurveY(1, 0.1, L));
  ctx.stroke();
  ctx.fillStyle = ctx.strokeStyle;
  ctx.beginPath();
  ctx.arc(tmX, tmY, 5, 0, Math.PI * 2);
  ctx.fill();

  // Particles
  const path = aqueousPathPts(L, m);
  for (const p of particles) {
    if (!p.alive) continue;
    const idx = Math.min(path.length - 1, Math.floor(p.t * (path.length - 1)));
    const pt = path[idx];
    if (!pt) continue;
    const blockedHere = (p.t > 0.35 && p.t < 0.55 && m.pupilGate < 0.35) || (p.t > 0.78 && m.tmGate < 0.3);
    ctx.fillStyle = blockedHere ? "rgba(224,112,112,0.9)" : "rgba(126,200,227,0.9)";
    ctx.beginPath();
    ctx.arc(pt[0], pt[1], blockedHere ? 3.1 : 2.4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  // Labels
  ctx.fillStyle = "#c8cdd6";
  ctx.font = "12px system-ui";
  ctx.fillText(T.cornea, L.CX - L.RX - 28, L.CY - 100);
  ctx.fillText(T.ac, L.CX - L.RX + 70, L.CY - 8);
  ctx.fillText(T.lensLab, L.lensCX - 12, L.CY + 4);
  ctx.fillText(T.ciliary, L.angleTop.x + 8, L.CY - L.RY + 30);
  ctx.fillText(T.tm, tmX - 6, tmY + 18);
  if (m.bombe > 0.25) {
    ctx.fillStyle = "#f0a030";
    ctx.fillText(T.bombe, L.irisX - 80, L.CY - 50);
  }

  // Depth motion cue arrow under diagram area
  ctx.fillStyle = "#6a7384";
  ctx.font = "11px system-ui";
  ctx.fillText("← " + T.shallow + "    " + T.depth + "    " + T.deep + " →", L.CX - 90, L.CY + L.RY + 28);

  // Inset
  const ix = 700, iy = 36, iw = 236, ih = 190;
  ctx.fillStyle = "#141920";
  roundRect(ctx, ix, iy, iw, ih, 12); ctx.fill();
  ctx.strokeStyle = "#3a4250";
  ctx.lineWidth = 1.5;
  roundRect(ctx, ix, iy, iw, ih, 12); ctx.stroke();
  ctx.fillStyle = "#9aa3b2";
  ctx.font = "12px system-ui";
  ctx.fillText(T.inset, ix + 12, iy + 20);
  const cx = ix + 48, cy = iy + 112;
  ctx.strokeStyle = "#8fd0e8";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, 70, -0.25, 1.4);
  ctx.stroke();
  const openPx = lerp(6, 46, m.angleOpen);
  ctx.fillStyle = "#3d5f7a";
  ctx.beginPath();
  ctx.moveTo(cx + 58, cy - 8);
  ctx.quadraticCurveTo(cx + 28, cy - openPx * 0.15, cx + 6, cy - openPx);
  ctx.lineTo(cx + 70, cy - 52);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = m.tmContact > 0.5 ? "#e07070" : "#6ecf8e";
  ctx.beginPath();
  ctx.arc(cx + 50, cy + 18, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#c8cdd6";
  ctx.font = "11px system-ui";
  ctx.fillText(T.angle, cx + 70, cy - 4);
  ctx.fillText(m.angleOpen > 0.45 ? T.gaugeOpen : m.angleOpen > 0.2 ? T.gaugeNarrow : T.gaugeClosed, ix + 12, iy + ih - 12);

  drawGauge(ctx, 18, 18, 250, 70, 1 - m.angleOpen, T.gaugeAngle, T.gaugeOpen, T.gaugeNarrow, T.gaugeClosed);
  drawGauge(ctx, 18, 98, 250, 70, m.iop, T.gaugeIop, T.gaugeLow, T.gaugeMid, T.gaugeHigh);
}

function drawFlow(m) {
  const ctx = fx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, FW, FH);
  ctx.fillStyle = "#0b0d11";
  ctx.fillRect(0, 0, FW, FH);
  ctx.fillStyle = "#c8cdd6";
  ctx.font = "13px system-ui";
  ctx.fillText(T.flowTitle, 20, 26);

  const nodes = [
    { x: 90, y: 110, lab: T.ciliary },
    { x: 280, y: 110, lab: T.pc },
    { x: 480, y: 110, lab: T.gatePupil },
    { x: 680, y: 110, lab: T.ac },
    { x: 870, y: 110, lab: T.gateTm },
  ];
  const gates = [1, 1, m.pupilGate, 1, m.tmGate];

  for (let i = 0; i < nodes.length - 1; i++) {
    const a = nodes[i], b = nodes[i + 1], g = gates[i + 1];
    ctx.strokeStyle = g > 0.65 ? "#6ecf8e" : g > 0.3 ? "#f0a030" : "#e07070";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(a.x + 36, a.y);
    ctx.lineTo(b.x - 36, b.y);
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.moveTo(b.x - 36, b.y);
    ctx.lineTo(b.x - 48, b.y - 7);
    ctx.lineTo(b.x - 48, b.y + 7);
    ctx.closePath();
    ctx.fill();
  }

  nodes.forEach((n, i) => {
    const g = gates[i];
    const col = i === 2 || i === 4
      ? (g > 0.65 ? "#6ecf8e" : g > 0.3 ? "#f0a030" : "#e07070")
      : "#4a90b8";
    ctx.fillStyle = "#1a1f28";
    ctx.beginPath();
    ctx.arc(n.x, n.y, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = "#e4e4e4";
    ctx.font = "11px system-ui";
    ctx.textAlign = "center";
    wrapCenter(ctx, n.lab, n.x, n.y - 2, 68, 12);
    if (i === 2 || i === 4) {
      ctx.fillStyle = col;
      ctx.font = "10px system-ui";
      ctx.fillText(g > 0.65 ? T.gateOpen : g > 0.3 ? T.gatePartial : T.gateClosed, n.x, n.y + 46);
    }
  });
  ctx.textAlign = "left";

  for (const p of particles) {
    if (!p.alive) continue;
    const u = p.t;
    const seg = Math.min(3, Math.floor(u * 4));
    const local = u * 4 - seg;
    const a = nodes[seg], b = nodes[seg + 1];
    if (!a || !b) continue;
    const x = lerp(a.x, b.x, local);
    const y = a.y + Math.sin(local * Math.PI) * -8;
    ctx.fillStyle = gates[seg + 1] < 0.3 && local > 0.55 ? "#e07070" : "#7ec8e3";
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function updateParticles(dt, m) {
  if (Math.random() < 0.32 * (0.35 + m.pupilGate)) spawnParticle();
  for (const p of particles) {
    if (!p.alive) continue;
    let speed = p.speed;
    if (p.t > 0.35 && p.t < 0.55) speed *= Math.max(0.05, m.pupilGate);
    if (p.t > 0.78) speed *= Math.max(0.05, m.tmGate);
    if ((p.t > 0.4 && p.t < 0.52 && m.pupilGate < 0.25) || (p.t > 0.85 && m.tmGate < 0.2)) speed *= 0.02;
    p.t += dt * speed;
    if (p.t >= 1) {
      if (m.tmGate < 0.25) p.t = 0.88;
      else p.alive = false;
    }
  }
  for (let i = particles.length - 1; i >= 0; i--) if (!particles[i].alive) particles.splice(i, 1);
}

function postHeight() {
  try {
    const h = Math.ceil(document.documentElement.scrollHeight || document.body.scrollHeight || 0);
    if (h > 0 && window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "eyesinfo-shallow-ac-height", height: h }, "*");
    }
  } catch (_) { /* ignore */ }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const m = metrics();
  updateParticles(dt, m);
  drawSagittal(m);
  drawFlow(m);
  requestAnimationFrame(frame);
}

$("sac-depth").addEventListener("input", (e) => { S.depth = +e.target.value; syncLabels(); });
$("sac-lens").addEventListener("input", (e) => { S.lens = +e.target.value; syncLabels(); });
$("sac-pupil").addEventListener("input", (e) => { S.pupil = +e.target.value; syncLabels(); });
$("sac-reset").addEventListener("click", () => {
  S.depth = 70; S.lens = 35; S.pupil = 45;
  particles.length = 0;
  syncLabels();
});

window.addEventListener("resize", postHeight);
applyLang(uiLang);
requestAnimationFrame(frame);
setTimeout(postHeight, 50);
setTimeout(postHeight, 300);
})();
</script>
</body>
