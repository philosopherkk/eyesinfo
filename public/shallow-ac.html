const normalizeLang = (raw) => {
  const v = (raw || "").trim();
  if (v === "zh" || v === "zh-Hant" || v === "zh-hant") return "zh-Hant";
  if (v === "zh-Hans" || v === "zh-hans" || v === "zh-CN" || v === "zh-cn") return "zh-Hans";
  if (v === "ja" || v === "jp") return "ja";
  if (v === "en") return "en";
  return "zh-Hant";
};

let uiLang = normalizeLang(new URLSearchParams(location.search).get("lang"));
let T = I18N[uiLang];
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { const x = clamp(t, 0, 1); return x * x * (3 - 2 * x); };

const S = { depth: 78, lens: 28, pupil: 22, iol: false };
let cutawayOn = true;

function midBell(p01) {
  const x = (p01 - 0.5) / 0.2;
  return Math.exp(-0.5 * x * x);
}

function metrics() {
  const shallow = 1 - S.depth / 100;
  const thick = S.lens / 100;
  const p01 = S.pupil / 100;
  const rawBlock = clamp(
    shallow * 0.35 + midBell(p01) * shallow * (0.7 + thick * 0.35) + thick * shallow * 0.3,
    0,
    1,
  );
  let block = smooth(rawBlock);
  let bombe = smooth(clamp((block - 0.28) / 0.5, 0, 1)) * (0.25 + shallow * 0.75);
  let crowd = shallow * 0.42 + thick * 0.48 + bombe * 0.55;
  let angleOpen = clamp(1 - crowd, 0, 1);
  let tmContact = clamp(1 - angleOpen * 1.15, 0, 1);
  let iop = smooth(clamp(tmContact * 0.75 + block * 0.3 + thick * 0.2, 0, 1));
  let pupilGate = clamp(1 - block * 0.95, 0, 1);
  let tmGate = clamp(1 - tmContact * 0.97, 0, 1);

  // Map-eye parametric anatomy (same +Z anterior as eye-viewer)
  let lensEquatorZ = lerp(0.78, 1.06, shallow);
  let lensRadius = lerp(0.42, 0.58, thick);
  let lensFront = lerp(0.16, 0.28, thick);
  let lensBack = lerp(0.24, 0.36, thick);
  const pupilR = lerp(0.12, 0.42, p01);

  // Lens out + thin IOL: crowding / block / bombé resolve (teaching outcome)
  if (S.iol) {
    block = 0.05;
    bombe = 0;
    crowd = 0.08;
    angleOpen = 0.92;
    tmContact = 0.05;
    iop = 0.12;
    pupilGate = 0.96;
    tmGate = 0.95;
    lensEquatorZ = 0.86;
    lensRadius = 0.55;
    lensFront = 0.045;
    lensBack = 0.05;
  }

  return {
    shallow, thick, p01, block, bombe, angleOpen, tmContact, iop, pupilGate, tmGate,
    lensEquatorZ, lensRadius, lensFront, lensBack, pupilR, iol: S.iol,
  };
}

function activeMechs(m) {
  if (m.iol) return { block: false, thick: false, shallow: false };
  return {
    block: m.block > 0.4 && m.bombe > 0.25,
    thick: m.thick > 0.5,
    shallow: m.shallow > 0.4,
  };
}

function storyFor(m) {
  if (m.iol) return T.storyIol;
  if (m.tmContact > 0.55 && m.shallow > 0.35 && m.thick > 0.4) return T.storyCrowd;
  if (m.block > 0.45 && m.bombe > 0.3) return T.storyBlock;
  if (m.thick > 0.55) return T.storyThick;
  if (m.shallow > 0.45) return T.storyShallow;
  return T.storyOpen;
}

function applyLang() {
  document.documentElement.lang = T.htmlLang;
  $("sac-page-cap").textContent = T.pageCap;
  $("sac-mech-title").textContent = T.mechTitle;
  $("sac-depth-lab").textContent = T.depth;
  $("sac-lens-lab").textContent = T.lens;
  $("sac-pupil-lab").textContent = T.pupil;
  $("sac-reset").textContent = T.reset;
  $("sac-cut").textContent = cutawayOn ? T.cutOn : T.cutOff;
  $("sac-iol").textContent = S.iol ? T.iolOff : T.iolOn;
  $("sac-iol").classList.toggle("on", S.iol);
  const list = $("sac-mech-list");
  list.innerHTML = "";
  [T.mech1, T.mech2, T.mech3].forEach((text, i) => {
    const li = document.createElement("li");
    li.dataset.mech = ["block", "thick", "shallow"][i];
    li.textContent = text;
    list.appendChild(li);
  });
  let note = document.getElementById("sac-mech-note");
  if (!note) {
    note = document.createElement("p");
    note.id = "sac-mech-note";
    note.style.margin = "8px 0 0";
    note.style.color = "#8b93a3";
    note.style.fontSize = "12.5px";
    list.parentElement.appendChild(note);
  }
  note.textContent = T.mechNote;

  const hint = $("sac-hint");
  hint.innerHTML = "";
  hint.appendChild(document.createTextNode(T.hint + " "));
  const a = document.createElement("a");
  a.href = "/urgent"; a.target = "_top"; a.rel = "noopener";
  a.textContent = T.urgentLink;
  hint.appendChild(a);
  hint.appendChild(document.createTextNode(uiLang === "en" ? "." : "。"));
  syncChrome();
  updateLabels();
  postHeight();
}

let anatomyDirty = true;

function syncChrome() {
  const m = metrics();
  $("sac-depth").value = String(Math.round(S.depth));
  $("sac-lens").value = String(Math.round(S.lens));
  $("sac-pupil").value = String(Math.round(S.pupil));
  const dTag = S.depth >= 55 ? T.deep : S.depth <= 35 ? T.shallow : "";
  $("sac-depthv").textContent = Math.round(S.depth) + "%" + (dTag ? " · " + dTag : "");
  const lTag = S.lens >= 60 ? T.large : S.lens <= 25 ? T.small : "";
  $("sac-lensv").textContent = Math.round(S.lens) + "%" + (lTag ? " · " + lTag : "");
  $("sac-pupilv").textContent = Math.round(S.pupil) + "%";
  $("sac-story").textContent = storyFor(m);
  $("sac-cut").textContent = cutawayOn ? T.cutOn : T.cutOff;
  $("sac-iol").textContent = S.iol ? T.iolOff : T.iolOn;
  $("sac-iol").classList.toggle("on", S.iol);

  // While showing IOL outcome, depth/lens sliders are dimmed (pupil still free)
  $("sac-depth").closest("label").classList.toggle("is-dim", S.iol);
  $("sac-lens").closest("label").classList.toggle("is-dim", S.iol);

  const act = activeMechs(m);
  [...$("sac-mech-list").children].forEach((li) => {
    li.classList.toggle("on", !!act[li.dataset.mech]);
  });

  const angleLab = m.angleOpen > 0.45 ? T.angleOpen : m.angleOpen > 0.2 ? T.angleNarrow : T.angleClosed;
  const iopLab = m.iop < 0.35 ? T.iopLow : m.iop < 0.65 ? T.iopMid : T.iopHigh;
  const pathLab = m.tmGate > 0.65 && m.pupilGate > 0.65 ? T.pathOk : m.tmGate < 0.3 || m.pupilGate < 0.3 ? T.pathBlocked : T.pathLimited;

  $("sac-chip-angle").innerHTML = `${T.angleStatus}：<strong>${angleLab}</strong>`;
  $("sac-chip-iop").innerHTML = `${T.iopStatus}：<strong>${iopLab}</strong>`;
  $("sac-chip-path").innerHTML = `${T.pathStatus}：<strong>${pathLab}</strong>`;
  $("sac-chip-angle").classList.toggle("warn", m.angleOpen <= 0.2);
  $("sac-chip-iop").classList.toggle("warn", m.iop >= 0.65);
  $("sac-chip-path").classList.toggle("warn", m.tmGate < 0.3 || m.pupilGate < 0.3);

  anatomyDirty = true;
}

function applyAnatomyIfNeeded() {
  if (!anatomyDirty) return;
  anatomyDirty = false;
  const m = metrics();
  anatomy.setParams({
    pupilR: m.pupilR,
    lensEquatorZ: m.lensEquatorZ,
    lensRadius: m.lensRadius,
    lensFront: m.lensFront,
    lensBack: m.lensBack,
    bombe: m.bombe,
    angleOpen: m.angleOpen,
    cutaway: cutawayOn,
    iol: m.iol,
  });
  updateLabels();
}

/* —— Three.js: map-eye anatomy —— */
const view = $("sac-view");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x05070b, 1);
renderer.localClippingEnabled = true;
view.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.position = "absolute";
labelRenderer.domElement.style.inset = "0";
labelRenderer.domElement.style.pointerEvents = "none";
view.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 60);
// Sagittal teaching view: look at anterior segment from +X so cut face is visible; cornea (+Z) toward the right of frame.
camera.position.set(3.6, 0.55, 1.15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 1.05);
controls.minDistance = 2.0;
controls.maxDistance = 8;

scene.add(new THREE.AmbientLight(0x8899aa, 0.7));
const key = new THREE.DirectionalLight(0xfff0dc, 1.8);
key.position.set(3, 2.2, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9cc3ff, 0.65);
fill.position.set(-2.5, -0.5, 2);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x7cb9ff, 1.1);
rim.position.set(-1, 2, -3);
scene.add(rim);

const anatomy = createMapEyeAnatomy(THREE, { cutaway: true });
scene.add(anatomy.group);

function makeLabel(text) {
  const el = document.createElement("div");
  el.className = "label3d";
  el.textContent = text;
  return new CSS2DObject(el);
}
const labels = {
  cornea: makeLabel(""),
  lens: makeLabel(""),
  ciliary: makeLabel(""),
  iris: makeLabel(""),
  tm: makeLabel(""),
  ac: makeLabel(""),
};
labels.cornea.position.set(0.15, 0.55, 1.62);
labels.lens.position.set(0.15, -0.05, 0.92);
labels.ciliary.position.set(0.15, 0.95, 1.05);
labels.iris.position.set(0.15, 0.55, 1.18);
labels.tm.position.set(0.15, 0.9, 1.28);
labels.ac.position.set(0.15, 0.25, 1.35);
Object.values(labels).forEach((l) => scene.add(l));

function updateLabels() {
  labels.cornea.element.textContent = T.cornea;
  labels.lens.element.textContent = S.iol ? T.lensLabIol : T.lensLab;
  labels.ciliary.element.textContent = T.ciliary;
  labels.iris.element.textContent = T.iris;
  labels.tm.element.textContent = T.tm;
  labels.ac.element.textContent = T.ac;
  const path = anatomy.getFlowPath();
  if (path.length >= 5) {
    labels.ciliary.position.set(path[0].x + 0.02, path[0].y + 0.08, path[0].z);
    labels.ac.position.set(path[3].x + 0.02, path[3].y - 0.06, path[3].z);
    labels.tm.position.set(path[4].x + 0.02, path[4].y + 0.08, path[4].z);
  }
}

/* —— Aqueous flow: one particle state → 3D eye path + 2D chart —— */
const flow = $("sac-flow");
const fx = flow.getContext("2d");
/** @type {{ seg: number, u: number, hold: number, alive: boolean }[]} */
const particles = [];

const flowGroup = new THREE.Group();
scene.add(flowGroup);
/** @type {THREE.Mesh[]} */
const checkpointMeshes = [];
/** @type {THREE.Mesh[]} */
const particleMeshes = [];
const PARTICLE_POOL = 36;
const checkGeo = new THREE.SphereGeometry(0.032, 12, 12);
const partGeo = new THREE.SphereGeometry(0.022, 10, 10);

function spawnFlowParticle() {
  particles.push({ seg: 0, u: 0, hold: 0, alive: true });
  if (particles.length > PARTICLE_POOL) particles.shift();
}

function gateAt(seg, m) {
  if (seg === 1 || seg === 2) return m.pupilGate;
  if (seg === 3) return m.tmGate;
  return 1;
}

function updateFlowParticles(dt, m) {
  if (Math.random() < 0.55) spawnFlowParticle();
  for (const p of particles) {
    if (!p.alive) continue;
    if (p.seg >= 4) {
      p.hold += dt;
      if (p.hold > 0.4) p.alive = false;
      continue;
    }
    const g = gateAt(p.seg, m);
    if (g < 0.28) {
      p.u = Math.min(p.u + dt * 0.12, 0.86);
      continue;
    }
    const speed = lerp(0.4, 0.95, clamp((g - 0.28) / 0.55, 0, 1));
    p.u += dt * speed;
    while (p.u >= 1 && p.alive && p.seg < 4) {
      p.u -= 1;
      p.seg += 1;
      if (p.seg >= 4) {
        if (m.tmGate < 0.28) {
          p.seg = 3;
          p.u = 0.86;
          break;
        }
        p.u = 0;
        p.hold = 0;
        break;
      }
    }
  }
  for (let i = particles.length - 1; i >= 0; i--) if (!particles[i].alive) particles.splice(i, 1);
}

function syncFlow3D(m) {
  const path = anatomy.getFlowPath();
  if (path.length < 5) return;

  while (checkpointMeshes.length < path.length) {
    const mesh = new THREE.Mesh(
      checkGeo,
      new THREE.MeshBasicMaterial({ color: 0xf3c06a, transparent: true, opacity: 0.9 }),
    );
    flowGroup.add(mesh);
    checkpointMeshes.push(mesh);
  }
  path.forEach((wp, i) => {
    const mesh = checkpointMeshes[i];
    mesh.position.set(wp.x, wp.y, wp.z);
    mesh.visible = true;
    const g = i === 0 ? 1 : i <= 2 ? m.pupilGate : m.tmGate;
    mesh.material.color.setHex(g > 0.65 ? 0x6ecf8e : g > 0.3 ? 0xf0a030 : 0xe07070);
  });

  while (particleMeshes.length < PARTICLE_POOL) {
    const mesh = new THREE.Mesh(
      partGeo,
      new THREE.MeshBasicMaterial({ color: 0x7ec8e3 }),
    );
    mesh.visible = false;
    flowGroup.add(mesh);
    particleMeshes.push(mesh);
  }
  for (const mesh of particleMeshes) mesh.visible = false;

  particles.forEach((p, idx) => {
    if (!p.alive || idx >= particleMeshes.length) return;
    const mesh = particleMeshes[idx];
    let x; let y; let z;
    if (p.seg >= 4) {
      ({ x, y, z } = path[4]);
    } else {
      const a = path[p.seg];
      const b = path[p.seg + 1];
      const t = clamp(p.u, 0, 1);
      x = lerp(a.x, b.x, t);
      y = lerp(a.y, b.y, t);
      z = lerp(a.z, b.z, t);
    }
    mesh.position.set(x, y, z);
    mesh.visible = true;
    const g = p.seg >= 4 ? 1 : gateAt(p.seg, m);
    mesh.material.color.setHex(g < 0.28 && p.u > 0.5 ? 0xe07070 : 0x7ec8e3);
  });
}

function drawFlow(m) {
  const W = flow.width, H = flow.height;
  fx.setTransform(1, 0, 0, 1, 0, 0);
  fx.clearRect(0, 0, W, H);
  fx.fillStyle = "#0b0d11";
  fx.fillRect(0, 0, W, H);
  fx.fillStyle = "#c8cdd6";
  fx.font = "13px system-ui";
  fx.fillText(T.flowTitle, 18, 24);

  const nodes = [
    { x: 90, y: 115, lab: T.ciliary },
    { x: 280, y: 115, lab: T.pc },
    { x: 480, y: 115, lab: T.pupilStation },
    { x: 680, y: 115, lab: T.ac },
    { x: 870, y: 115, lab: T.tm },
  ];
  const gates = [1, m.pupilGate, m.pupilGate, m.tmGate];

  for (let i = 0; i < 4; i++) {
    const a = nodes[i], b = nodes[i + 1], g = gates[i];
    fx.strokeStyle = g > 0.65 ? "#6ecf8e" : g > 0.3 ? "#f0a030" : "#e07070";
    fx.lineWidth = 4;
    fx.beginPath();
    fx.moveTo(a.x + 34, a.y);
    fx.lineTo(b.x - 34, b.y);
    fx.stroke();
    fx.fillStyle = fx.strokeStyle;
    fx.beginPath();
    fx.moveTo(b.x - 34, b.y);
    fx.lineTo(b.x - 46, b.y - 7);
    fx.lineTo(b.x - 46, b.y + 7);
    fx.closePath();
    fx.fill();
  }

  nodes.forEach((n, i) => {
    const g = i === 0 ? 1 : gates[i - 1];
    const col = i === 0 ? "#4a90b8" : g > 0.65 ? "#6ecf8e" : g > 0.3 ? "#f0a030" : "#e07070";
    fx.fillStyle = "#1a1f28";
    fx.beginPath();
    fx.arc(n.x, n.y, 32, 0, Math.PI * 2);
    fx.fill();
    fx.strokeStyle = col;
    fx.lineWidth = 3;
    fx.stroke();
    fx.fillStyle = "#e4e4e4";
    fx.font = "11px system-ui";
    fx.textAlign = "center";
    fx.fillText(n.lab, n.x, n.y + 4);
    if (i > 0) {
      fx.fillStyle = col;
      fx.font = "10px system-ui";
      fx.fillText(g > 0.65 ? T.gateOpen : g > 0.3 ? T.gatePartial : T.gateClosed, n.x, n.y + 48);
    }
  });
  fx.textAlign = "left";

  for (const p of particles) {
    if (!p.alive) continue;
    if (p.seg >= 4) {
      const n = nodes[4];
      fx.fillStyle = "#7ec8e3";
      fx.beginPath();
      fx.arc(n.x + Math.sin(p.hold * 12) * 2, n.y, 4, 0, Math.PI * 2);
      fx.fill();
      continue;
    }
    const a = nodes[p.seg], b = nodes[p.seg + 1];
    if (!a || !b) continue;
    const t = clamp(p.u, 0, 1);
    const x = lerp(a.x, b.x, t);
    const y = a.y + Math.sin(t * Math.PI) * -12;
    const g = gates[p.seg];
    fx.fillStyle = g < 0.28 && t > 0.5 ? "#e07070" : "#7ec8e3";
    fx.beginPath();
    fx.arc(x, y, 3.6, 0, Math.PI * 2);
    fx.fill();
  }
}

function resize() {
  const w = view.clientWidth || 640;
  const h = view.clientHeight || 400;
  renderer.setSize(w, h, false);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function postHeight() {
  try {
    const h = Math.ceil(document.documentElement.scrollHeight || 0);
    if (h > 0 && window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "eyesinfo-shallow-ac-height", height: h }, "*");
    }
  } catch (_) { /* ignore */ }
}

$("sac-depth").addEventListener("input", (e) => {
  if (S.iol) return;
  S.depth = +e.target.value;
  syncChrome();
});
$("sac-lens").addEventListener("input", (e) => {
  if (S.iol) return;
  S.lens = +e.target.value;
  syncChrome();
});
$("sac-pupil").addEventListener("input", (e) => { S.pupil = +e.target.value; syncChrome(); });
$("sac-iol").addEventListener("click", () => {
  S.iol = !S.iol;
  particles.length = 0;
  syncChrome();
});
$("sac-cut").addEventListener("click", () => {
  cutawayOn = !cutawayOn;
  anatomy.setCutaway(cutawayOn);
  anatomyDirty = true;
  $("sac-cut").textContent = cutawayOn ? T.cutOn : T.cutOff;
});
$("sac-reset").addEventListener("click", () => {
  S.depth = 78; S.lens = 28; S.pupil = 22; S.iol = false;
  particles.length = 0;
  syncChrome();
});

window.addEventListener("resize", () => { resize(); postHeight(); });

applyLang();
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const m = metrics();
  applyAnatomyIfNeeded();
  updateFlowParticles(dt, m);
  syncFlow3D(m);
  drawFlow(m);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(postHeight, 80);
setTimeout(postHeight, 400);
</script>
</body>
