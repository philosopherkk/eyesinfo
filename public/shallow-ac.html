    }
    #sacsim canvas { width: 100%; display: block; border-radius: 10px; background: #000; touch-action: none; }
    #sacsim .bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 4px 2px 8px; }
    #sacsim .seg { display: flex; flex-wrap: wrap; border-radius: 9px; overflow: hidden; border: 1px solid #444; }
    #sacsim .seg button, #sacsim .btn {
      background: #23272f; color: #ddd; border: 0; padding: 7px 11px; font-size: 13px;
      cursor: pointer; min-height: 40px;
    }
    #sacsim .seg button.on { background: #f0a030; color: #111; font-weight: 700; }
    #sacsim .btn { border: 1px solid #444; border-radius: 9px; }
    #sacsim .steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    #sacsim .steps button {
      background: #1a1f28; color: #9aa3b2; border: 1px solid #3a4250; border-radius: 999px;
      padding: 6px 11px; font-size: 12.5px; cursor: pointer; min-height: 36px;
    }
    #sacsim .steps button.on { background: #2a3340; color: #f3c06a; border-color: #f0a030; font-weight: 600; }
    #sacsim label { font-size: 13px; display: flex; align-items: center; gap: 6px; color: #bbb; }
    #sacsim label.dim { opacity: 0.4; pointer-events: none; }
    #sacsim input[type=range] { width: 100px; accent-color: #f0a030; }
    #sacsim .v { min-width: 42px; font-variant-numeric: tabular-nums; color: #f3c06a; }
    #sacsim .story {
      margin: 0 2px 10px; padding: 10px 12px; border-radius: 10px;
      background: #1a1f28; border: 1px solid #2c3440; font-size: 13.5px; line-height: 1.5; color: #d5dae3;
      min-height: 3.4em;
    }
    #sacsim .hint { margin: 10px 2px 0; font-size: 12.5px; line-height: 1.45; color: #8b93a3; }
    #sacsim .hint a { color: #7ec8e3; }
    #sacsim .flow-wrap { margin-top: 10px; }
  </style>
</head>

const MODES = ["open", "block", "lens", "vault", "plateau"];
const normalizeLang = (raw) => {
  const v = (raw || "").trim();
  if (v === "zh" || v === "zh-Hant" || v === "zh-hant") return "zh-Hant";
  if (v === "zh-Hans" || v === "zh-hans" || v === "zh-CN" || v === "zh-cn") return "zh-Hans";
  if (v === "ja" || v === "jp") return "ja";
  if (v === "en") return "en";
  return "zh-Hant";
};

let uiLang = normalizeLang(new URLSearchParams(location.search).get("lang"));
let T = I18N[uiLang];
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { const x = clamp(t, 0, 1); return x * x * (3 - 2 * x); };

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const S = {
  mode: "open",
  depth: 25,     // 0 deep … 100 shallow
  pupil: 45,     // 0 miotic … 100 dilated
  lens: 20,      // thickness
  vault: 15,     // anterior vault
  plateau: 10,   // plateau iris
  play: !reduceMotion,
  demo: !reduceMotion,
  step: 0,
  demoT: 0,
};

function midBell(p01) {
  const x = (p01 - 0.5) / 0.22;
  return Math.exp(-0.5 * x * x);
}

function metrics() {
  const shallow = S.depth / 100;
  const p01 = S.pupil / 100;
  const thick = S.lens / 100;
  const vault = S.vault / 100;
  const plat = S.plateau / 100;

  // Force emphasis by selected mechanism
  const force = {
    open: { block: 0, thick: 0.05, vault: 0.05, plat: 0.05, shallowBias: -0.25 },
    block: { block: 0.85, thick: 0.1, vault: 0.1, plat: 0.05, shallowBias: 0.2 },
    lens: { block: 0.15, thick: 0.9, vault: 0.25, plat: 0.05, shallowBias: 0.35 },
    vault: { block: 0.2, thick: 0.25, vault: 0.9, plat: 0.1, shallowBias: 0.15 },
    plateau: { block: 0.08, thick: 0.1, vault: 0.1, plat: 0.9, shallowBias: -0.1 },
  }[S.mode] || { block: 0, thick: 0, vault: 0, plat: 0, shallowBias: 0 };

  const shallowEff = clamp(shallow + force.shallowBias * 0.5 + thick * 0.25 + vault * 0.15, 0, 1);
  const thickEff = clamp(thick * 0.55 + force.thick * 0.55, 0, 1);
  const vaultEff = clamp(vault * 0.55 + force.vault * 0.55 + thickEff * 0.2, 0, 1);
  const platEff = clamp(plat * 0.55 + force.plat * 0.55, 0, 1);

  const rawBlock = clamp(
    force.block * 0.7 +
    shallowEff * 0.35 * midBell(p01) +
    midBell(p01) * 0.35 * (S.mode === "block" ? 1 : 0.35) -
    (S.mode === "open" ? 0.45 : 0) -
    (S.mode === "plateau" ? 0.2 : 0),
    0, 1
  );
  const block = smooth(rawBlock);
  // Bombé: peripheral iris bows ANTERIORLY (toward cornea)
  const bombe = smooth(clamp((block - 0.2) / 0.55, 0, 1)) * (0.4 + shallowEff * 0.6);

  // Angle crowding from multiple mechanisms
  const crowd =
    shallowEff * 0.35 +
    bombe * 0.55 +
    thickEff * 0.4 +
    vaultEff * 0.45 +
    platEff * 0.55;
  const angleOpen = clamp(1 - crowd, 0, 1);
  // Plateau: central AC can stay deeper while angle is narrow
  const centralDeep = clamp(1 - shallowEff * 0.8 - thickEff * 0.35 - vaultEff * 0.25 + platEff * 0.45, 0, 1);
  const tmContact = clamp(1 - angleOpen * 1.1, 0, 1);
  const iop = smooth(clamp(tmContact * 0.7 + block * 0.25 + thickEff * 0.15 + platEff * 0.1, 0, 1));
  const pupilGate = S.mode === "plateau" ? 0.85 : 1 - block * 0.92;
  const tmGate = 1 - tmContact * 0.95;

  return {
    shallow: shallowEff, p01, thick: thickEff, vault: vaultEff, plat: platEff,
    block, bombe, angleOpen, centralDeep, tmContact, iop, pupilGate, tmGate,
  };
}

const particles = [];
function spawnParticle() {
  particles.push({ t: 0, speed: 0.18 + Math.random() * 0.12, alive: true });
  if (particles.length > 48) particles.shift();
}

function modeLabel(mode) {
  switch (mode) {
    case "open": return T.mOpen;
    case "block": return T.mBlock;
    case "lens": return T.mLens;
    case "vault": return T.mVault;
    case "plateau": return T.mPlateau;
    default: {
      const _x = mode;
      return _x;
    }
  }
}

function sliderRelevance() {
  // Which sliders are primary for the active mechanism (others dimmed but still usable)
  return {
    depth: true,
    pupil: S.mode === "open" || S.mode === "block",
    lens: S.mode === "lens" || S.mode === "open",
    vault: S.mode === "vault" || S.mode === "lens",
    plateau: S.mode === "plateau",
  };
}

function applyLang(lang) {
  uiLang = normalizeLang(lang);
  T = I18N[uiLang];
  document.documentElement.lang = T.htmlLang;
  const cap = $("sac-page-cap");
  if (cap) cap.textContent = T.pageCap;
  $("sac-depth-lab").textContent = T.depth;
  $("sac-pupil-lab").textContent = T.pupil;
  $("sac-lens-lab").textContent = T.lens;
  $("sac-vault-lab").textContent = T.vault;
  $("sac-plateau-lab").textContent = T.plateau;
  $("sac-demo").textContent = T.demo;
  $("sac-reset").textContent = T.reset;

  const modes = $("sac-modes");
  modes.innerHTML = "";
  MODES.forEach((mode) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.mode = mode;
    b.textContent = modeLabel(mode);
    b.className = mode === S.mode ? "on" : "";
    b.addEventListener("click", () => {
      S.mode = mode;
      S.demo = false;
      S.step = MODES.indexOf(mode);
      applyStepTargets(S.step, true);
      refreshChrome();
    });
    modes.appendChild(b);
  });

  const steps = $("sac-steps");
  steps.innerHTML = "";
  [T.step1, T.step2, T.step3, T.step4, T.step5].forEach((label, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.className = i === S.step ? "on" : "";
    b.setAttribute("role", "tab");
    b.addEventListener("click", () => {
      S.step = i;
      S.demo = false;
      applyStepTargets(i, true);
      refreshChrome();
    });
    steps.appendChild(b);
  });

  const hint = $("sac-hint");
  hint.innerHTML = "";
  hint.appendChild(document.createTextNode(T.hint + " "));
  const a = document.createElement("a");
  a.href = "/urgent";
  a.target = "_top";
  a.rel = "noopener";
  a.textContent = T.urgentLink;
  hint.appendChild(a);
  hint.appendChild(document.createTextNode(uiLang === "en" ? "." : "。"));
  refreshChrome();
  postHeight();
}

function refreshChrome() {
  [["depth", S.depth], ["pupil", S.pupil], ["lens", S.lens], ["vault", S.vault], ["plateau", S.plateau]].forEach(([k, v]) => {
    $(`sac-${k}`).value = String(Math.round(v));
    $(`sac-${k}v`).textContent = Math.round(v) + "%";
  });
  const rel = sliderRelevance();
  $("lab-wrap-depth").classList.toggle("dim", !rel.depth);
  $("lab-wrap-pupil").classList.toggle("dim", !rel.pupil);
  $("lab-wrap-lens").classList.toggle("dim", !rel.lens);
  $("lab-wrap-vault").classList.toggle("dim", !rel.vault);
  $("lab-wrap-plateau").classList.toggle("dim", !rel.plateau);

  [...$("sac-modes").children].forEach((b) => b.classList.toggle("on", b.dataset.mode === S.mode));
  [...$("sac-steps").children].forEach((b, i) => {
    b.classList.toggle("on", i === S.step);
    b.setAttribute("aria-selected", i === S.step ? "true" : "false");
  });
  $("sac-play").textContent = S.play ? "❚❚" : "▶";
  $("sac-play").setAttribute("aria-label", S.play ? T.pauseAria : T.playAria);
  const stories = [T.story1, T.story2, T.story3, T.story4, T.story5];
  $("sac-story").textContent = stories[S.step] || stories[0];
}

function applyStepTargets(step, snap) {
  const targets = [
    { mode: "open", depth: 18, pupil: 35, lens: 15, vault: 10, plateau: 5 },
    { mode: "block", depth: 72, pupil: 52, lens: 25, vault: 20, plateau: 8 },
    { mode: "lens", depth: 55, pupil: 40, lens: 85, vault: 45, plateau: 10 },
    { mode: "vault", depth: 40, pupil: 42, lens: 40, vault: 88, plateau: 12 },
    { mode: "plateau", depth: 22, pupil: 48, lens: 20, vault: 18, plateau: 90 },
  ][step] || { mode: "open", depth: 25, pupil: 45, lens: 20, vault: 15, plateau: 10 };
  if (snap) {
    S.mode = targets.mode;
    S.depth = targets.depth;
    S.pupil = targets.pupil;
    S.lens = targets.lens;
    S.vault = targets.vault;
    S.plateau = targets.plateau;
  }
  return targets;
}

function updateDemo(dt) {
  if (!S.demo || !S.play) return;
  S.demoT += dt;
  const phase = S.demoT % 25;
  const step = Math.min(4, Math.floor(phase / 5));
  if (step !== S.step) S.step = step;
  const targets = applyStepTargets(S.step, false);
  const prev = applyStepTargets(Math.max(0, S.step - 1), false);
  const local = (phase % 5) / 5;
  const ease = smooth(local);
  const from = S.step === 0 ? targets : prev;
  S.mode = ease > 0.35 ? targets.mode : from.mode;
  S.depth = lerp(from.depth, targets.depth, ease);
  S.pupil = lerp(from.pupil, targets.pupil, ease);
  S.lens = lerp(from.lens, targets.lens, ease);
  S.vault = lerp(from.vault, targets.vault, ease);
  S.plateau = lerp(from.plateau, targets.plateau, ease);
}

const sag = $("sac-sag"), sx = sag.getContext("2d");
const flow = $("sac-flow"), fx = flow.getContext("2d");
const SW = 960, SH = 440, FW = 960, FH = 220;

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawGauge(ctx, x, y, w, h, value, title, low, mid, high) {
  ctx.fillStyle = "#1a1f28";
  roundRect(ctx, x, y, w, h, 10); ctx.fill();
  ctx.fillStyle = "#c8cdd6";
  ctx.font = "12px system-ui";
  ctx.textAlign = "left";
  ctx.fillText(title, x + 12, y + 18);
  const bx = x + 12, by = y + 32, bw = w - 24, bh = 12;
  ctx.fillStyle = "#0b0d11";
  roundRect(ctx, bx, by, bw, bh, 6); ctx.fill();
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, "#6ecf8e");
  g.addColorStop(0.55, "#f0a030");
  g.addColorStop(1, "#e07070");
  ctx.fillStyle = g;
  roundRect(ctx, bx, by, Math.max(4, bw * clamp(value, 0, 1)), bh, 6); ctx.fill();
  ctx.fillStyle = "#9aa3b2";
  ctx.font = "11px system-ui";
  ctx.fillText(low, bx, by + 28);
  ctx.textAlign = "center";
  ctx.fillText(mid, bx + bw / 2, by + 28);
  ctx.textAlign = "right";
  ctx.fillText(high, bx + bw, by + 28);
  ctx.textAlign = "left";
}

function wrapCenter(ctx, text, x, y, maxW, lh) {
  const chars = [...text];
  let line = "", lines = [];
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = ch; }
    else line = test;
  }
  if (line) lines.push(line);
  const start = y - ((lines.length - 1) * lh) / 2;
  lines.forEach((l, i) => ctx.fillText(l, x, start + i * lh));
}

/**
 * Anatomy layout (anterior LEFT):
 *  - Globe ellipse; cornea anterior bulge
 *  - Lens oval INSIDE globe, posterior to iris
 *  - Ciliary body INSIDE sclera at iris root
 *  - Bombé: peripheral iris bows LEFT (anterior)
 */
function layout(m) {
  const CX = 430, CY = 225;
  const RX = 195, RY = 155;
  // Iris plane x: deeper when AC deep (centralDeep high), more anterior when shallow/thick/vault
  const irisX = CX - 35 - m.centralDeep * 42 + (1 - m.centralDeep) * 8 + m.thick * 10 + m.vault * 12;
  const pupilHalf = lerp(12, 52, m.p01);
  // Lens center behind iris, always inside globe
  const lensThick = lerp(22, 48, m.thick);
  const vaultShift = m.vault * 28; // anterior surface advances
  const lensCX = irisX + 38 + lensThick * 0.15 - vaultShift * 0.15;
  const lensRX = lerp(28, 40, m.thick) + m.vault * 4;
  const lensRY = lerp(52, 68, m.thick);
  // Ciliary body: inside wall, just posterior to iris root; plateau moves it anterior
  const cbInset = 18;
  const cbAnterior = m.plat * 22; // plateau: processes more anterior
  const angleTop = { x: CX - RX + 38, y: CY - RY + 48 };
  const angleBot = { x: CX - RX + 38, y: CY + RY - 48 };
  return { CX, CY, RX, RY, irisX, pupilHalf, lensCX, lensRX, lensRY, lensThick, vaultShift, cbInset, cbAnterior, angleTop, angleBot };
}

function irisCurveY(side, t, L, m) {
  // t: 0 at angle root → 1 at pupil margin
  // side: -1 upper, +1 lower
  const rootY = side < 0 ? L.angleTop.y + 8 : L.angleBot.y - 8;
  const pupilY = L.CY + side * L.pupilHalf;
  let y = lerp(rootY, pupilY, smooth(t));
  // Plateau: root stays propped anteriorly (handled in x); mild mid flattening
  if (m.plat > 0.2) {
    y = lerp(y, lerp(rootY, pupilY, t * 0.85 + 0.1), m.plat * 0.35);
  }
  return y;
}

function irisCurveX(t, L, m) {
  // Base iris near irisX; pupil margin contacts anterior lens
  const lensFront = L.lensCX - L.lensRX + L.vaultShift * 0.35;
  const rootX = L.irisX - 8 - m.plat * 10; // plateau: root more anterior
  const pupilX = lensFront - 2;
  let x = lerp(rootX, pupilX, smooth(t));
  // Bombé: mid-peripheral iris bows ANTERIORLY (smaller x = toward cornea)
  if (m.bombe > 0.05) {
    const bow = Math.sin(Math.PI * t) * m.bombe * 36;
    x -= bow; // anterior = left
  }
  // Thick lens / vault: whole leaflet nudged anterior
  x -= m.thick * 8 * (1 - t) + m.vault * 10 * (0.3 + 0.7 * (1 - t));
  return x;
}

function drawSagittal(m) {
  const ctx = sx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, SW, SH);
  ctx.fillStyle = "#0b0d11";
  ctx.fillRect(0, 0, SW, SH);

  const L = layout(m);

  // Globe (sclera/vitreous cavity) — everything of interest sits inside
  ctx.fillStyle = "#1a222c";
  ctx.beginPath();
  ctx.ellipse(L.CX, L.CY, L.RX, L.RY, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#3a4555";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Cornea = anterior bulge (left)
  ctx.strokeStyle = "#8fd0e8";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.ellipse(L.CX - L.RX + 18, L.CY, 52, 78, 0, -1.25, 1.25);
  ctx.stroke();
  ctx.strokeStyle = "rgba(143,208,232,0.28)";
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.ellipse(L.CX - L.RX + 18, L.CY, 46, 72, 0, -1.15, 1.15);
  ctx.stroke();

  // Clip to globe interior for lens / CB / iris
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(L.CX, L.CY, L.RX - 3, L.RY - 3, 0, 0, Math.PI * 2);
  ctx.clip();

  // Posterior chamber tint when blocked
  if (m.block > 0.25) {
    ctx.fillStyle = `rgba(224,112,112,${0.06 + m.block * 0.16})`;
    ctx.beginPath();
    ctx.rect(L.irisX - 5, L.CY - L.pupilHalf - 20, L.lensCX + L.lensRX - L.irisX + 20, L.pupilHalf * 2 + 40);
    ctx.fill();
  }

  // Anterior chamber wash (between cornea and iris)
  const acCol = m.tmContact > 0.55
    ? "rgba(224,112,112,0.2)"
    : m.block > 0.4
      ? "rgba(240,160,48,0.16)"
      : "rgba(126,200,227,0.16)";
  ctx.fillStyle = acCol;
  ctx.beginPath();
  ctx.moveTo(L.CX - L.RX + 8, L.CY);
  ctx.ellipse(L.CX - L.RX + 18, L.CY, 48, 74, 0, -1.2, 1.2);
  for (let i = 24; i >= 0; i--) {
    const t = i / 24;
    ctx.lineTo(irisCurveX(t, L, m), irisCurveY(1, t, L, m));
  }
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    ctx.lineTo(irisCurveX(t, L, m), irisCurveY(-1, t, L, m));
  }
  ctx.closePath();
  ctx.fill();

  // Ciliary body — INSIDE sclera, behind iris root; plateau advances processes
  const cbX = L.irisX + 14 - L.cbAnterior;
  ctx.fillStyle = "#6a5040";
  for (const side of [-1, 1]) {
    const cy = L.CY + side * (L.RY - 42);
    ctx.beginPath();
    ctx.moveTo(cbX - 6, cy);
    ctx.lineTo(cbX + 28, cy + side * 8);
    ctx.lineTo(cbX + 22, cy + side * 28);
    ctx.lineTo(cbX - 10, cy + side * 18);
    ctx.closePath();
    ctx.fill();
    // Plateau: anterior process finger toward iris root
    if (m.plat > 0.25) {
      ctx.fillStyle = "#8a6a50";
      ctx.beginPath();
      ctx.ellipse(cbX - 8 - m.plat * 6, cy + side * 6, 10, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#6a5040";
    }
  }

  // Lens — INSIDE globe, posterior to iris
  const lensFront = L.lensCX - L.lensRX + L.vaultShift * 0.5;
  const lensBack = L.lensCX + L.lensRX;
  ctx.fillStyle = "rgba(240,200,120,0.45)";
  ctx.beginPath();
  ctx.ellipse(L.lensCX + L.vaultShift * 0.15, L.CY, L.lensRX, L.lensRY, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#f0a030";
  ctx.lineWidth = 2;
  ctx.stroke();
  // Anterior vault highlight
  if (m.vault > 0.25) {
    ctx.strokeStyle = `rgba(240,160,48,${0.35 + m.vault * 0.4})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(lensFront + 8, L.CY, 10 + m.vault * 8, L.lensRY * 0.85, 0, -1.4, 1.4);
    ctx.stroke();
  }

  // Iris leaflets (upper & lower)
  ctx.fillStyle = "#3d5f7a";
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(irisCurveX(0, L, m), irisCurveY(side, 0, L, m));
    for (let i = 1; i <= 28; i++) {
      const t = i / 28;
      ctx.lineTo(irisCurveX(t, L, m), irisCurveY(side, t, L, m));
    }
    // thicken toward root
    const tipX = irisCurveX(1, L, m);
    const tipY = irisCurveY(side, 1, L, m);
    ctx.lineTo(tipX + 10, tipY + side * 6);
    ctx.lineTo(irisCurveX(0, L, m) + 12, irisCurveY(side, 0, L, m) + side * 14);
    ctx.closePath();
    ctx.fill();
  }

  // Pupil-block contact at pupil margin (against anterior lens)
  if (m.block > 0.3) {
    ctx.strokeStyle = `rgba(224,112,112,${0.45 + m.block * 0.45})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(irisCurveX(1, L, m), L.CY - L.pupilHalf);
    ctx.lineTo(irisCurveX(1, L, m), L.CY + L.pupilHalf);
    ctx.stroke();
    ctx.fillStyle = "#e07070";
    ctx.font = "bold 12px system-ui";
    ctx.fillText(T.pupilBlock, irisCurveX(1, L, m) + 6, L.CY - L.pupilHalf - 10);
  }

  // Angle / TM markers
  const tmX = L.CX - L.RX + 42;
  const tmY = L.CY + L.RY - 55;
  const irisNear = { x: irisCurveX(0.08, L, m), y: irisCurveY(1, 0.08, L, m) };
  ctx.strokeStyle = m.angleOpen > 0.45 ? "#6ecf8e" : m.angleOpen > 0.2 ? "#f0a030" : "#e07070";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(tmX, tmY);
  ctx.lineTo(irisNear.x, irisNear.y);
  ctx.stroke();
  ctx.fillStyle = ctx.strokeStyle;
  ctx.beginPath();
  ctx.arc(tmX, tmY, 5, 0, Math.PI * 2);
  ctx.fill();

  // Particles along aqueous path
  const path = aqueousPathPts(L, m);
  for (const p of particles) {
    if (!p.alive) continue;
    const idx = Math.min(path.length - 1, Math.floor(p.t * (path.length - 1)));
    const pt = path[idx];
    if (!pt) continue;
    const blockedHere = (p.t > 0.35 && p.t < 0.55 && m.pupilGate < 0.35) || (p.t > 0.78 && m.tmGate < 0.3);
    ctx.fillStyle = blockedHere ? "rgba(224,112,112,0.9)" : "rgba(126,200,227,0.9)";
    ctx.beginPath();
    ctx.arc(pt[0], pt[1], blockedHere ? 3.2 : 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore(); // end globe clip

  // Labels (outside clip)
  ctx.fillStyle = "#c8cdd6";
  ctx.font = "12px system-ui";
  ctx.fillText(T.cornea, L.CX - L.RX - 20, L.CY - 95);
  ctx.fillText(T.ac, L.CX - L.RX + 70, L.CY - 10);
  ctx.fillText(T.lensLab, L.lensCX - 10, L.CY + 4);
  ctx.fillText(T.ciliary, L.irisX + 20 - L.cbAnterior, L.CY - L.RY + 28);
  ctx.fillText(T.tm, tmX - 8, tmY + 18);
  if (m.bombe > 0.25) {
    ctx.fillStyle = "#f0a030";
    ctx.fillText(T.bombe, L.irisX - 70, L.CY - 55);
  }
  if (m.thick > 0.45 && S.mode === "lens") {
    ctx.fillStyle = "#f0a030";
    ctx.fillText(T.thickLens, L.lensCX - 20, L.CY - L.lensRY - 8);
  }
  if (m.vault > 0.45 && S.mode === "vault") {
    ctx.fillStyle = "#f0a030";
    ctx.fillText(T.antVault, L.lensCX - L.lensRX - 30, L.CY - 70);
  }
  if (m.plat > 0.45 && S.mode === "plateau") {
    ctx.fillStyle = "#f0a030";
    ctx.fillText(T.plateauIris, L.irisX - 40, L.CY + L.RY - 20);
  }

  // Angle inset
  const ix = 700, iy = 36, iw = 236, ih = 200;
  ctx.fillStyle = "#141920";
  roundRect(ctx, ix, iy, iw, ih, 12); ctx.fill();
  ctx.strokeStyle = "#3a4250";
  ctx.lineWidth = 1.5;
  roundRect(ctx, ix, iy, iw, ih, 12); ctx.stroke();
  ctx.fillStyle = "#9aa3b2";
  ctx.font = "12px system-ui";
  ctx.fillText(T.inset, ix + 12, iy + 20);

  const cx = ix + 48, cy = iy + 118;
  ctx.strokeStyle = "#8fd0e8";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, 72, -0.25, 1.4);
  ctx.stroke();
  // Iris root: plateau props it up; bombé / thick / vault crowd the angle
  const openPx = lerp(6, 46, m.angleOpen);
  const rootLift = m.plat * 14;
  ctx.fillStyle = "#3d5f7a";
  ctx.beginPath();
  ctx.moveTo(cx + 58, cy - 8 - rootLift);
  ctx.quadraticCurveTo(cx + 28, cy - openPx * 0.15 - rootLift * 0.3, cx + 6, cy - openPx);
  ctx.lineTo(cx + 72, cy - 55);
  ctx.closePath();
  ctx.fill();
  // Plateau ciliary process in inset
  if (m.plat > 0.3) {
    ctx.fillStyle = "#8a6a50";
    ctx.beginPath();
    ctx.ellipse(cx + 40, cy + 8, 12, 8, -0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = m.tmContact > 0.5 ? "#e07070" : "#6ecf8e";
  ctx.beginPath();
  ctx.arc(cx + 50, cy + 20, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#c8cdd6";
  ctx.font = "11px system-ui";
  ctx.fillText(T.angle, cx + 72, cy - 6);
  ctx.fillText(T.tm, cx + 60, cy + 38);
  ctx.fillText(m.angleOpen > 0.45 ? T.gaugeOpen : m.angleOpen > 0.2 ? T.gaugeNarrow : T.gaugeClosed, ix + 12, iy + ih - 14);

  drawGauge(ctx, 20, 20, 250, 70, 1 - m.angleOpen, T.gaugeAngle, T.gaugeOpen, T.gaugeNarrow, T.gaugeClosed);
  drawGauge(ctx, 20, 100, 250, 70, m.iop, T.gaugeIop, T.gaugeLow, T.gaugeMid, T.gaugeHigh);
}

function aqueousPathPts(L, m) {
  const pts = [];
  const lensFront = L.lensCX - L.lensRX + L.vaultShift * 0.35;
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    let x, y;
    if (t < 0.22) {
      const u = t / 0.22;
      x = lerp(L.irisX + 20 - L.cbAnterior, lensFront + 8, u);
      y = lerp(L.CY - L.RY + 40, L.CY - L.pupilHalf - 6, u);
    } else if (t < 0.45) {
      const u = (t - 0.22) / 0.23;
      x = irisCurveX(1, L, m) + 2;
      y = lerp(L.CY - L.pupilHalf, L.CY + L.pupilHalf * 0.15, u);
    } else if (t < 0.7) {
      const u = (t - 0.45) / 0.25;
      x = lerp(irisCurveX(1, L, m) - 4, L.CX - L.RX + 90, u);
      // After pupil: into AC (more anterior if bombé creates space then toward angle)
      y = lerp(L.CY, L.CY + 50, u);
    } else {
      const u = (t - 0.7) / 0.3;
      x = lerp(L.CX - L.RX + 90, L.CX - L.RX + 42, u);
      y = lerp(L.CY + 50, L.CY + L.RY - 55, u);
    }
    pts.push([x, y]);
  }
  return pts;
}

function drawFlow(m) {
  const ctx = fx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, FW, FH);
  ctx.fillStyle = "#0b0d11";
  ctx.fillRect(0, 0, FW, FH);
  ctx.fillStyle = "#c8cdd6";
  ctx.font = "13px system-ui";
  ctx.fillText(T.flowTitle, 20, 28);

  const nodes = [
    { x: 90, y: 120, lab: T.ciliary },
    { x: 280, y: 120, lab: T.pc },
    { x: 480, y: 120, lab: T.gatePupil },
    { x: 680, y: 120, lab: T.ac },
    { x: 870, y: 120, lab: T.gateTm },
  ];
  const gates = [1, 1, m.pupilGate, 1, m.tmGate];

  for (let i = 0; i < nodes.length - 1; i++) {
    const a = nodes[i], b = nodes[i + 1];
    const g = gates[i + 1];
    ctx.strokeStyle = g > 0.65 ? "#6ecf8e" : g > 0.3 ? "#f0a030" : "#e07070";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(a.x + 36, a.y);
    ctx.lineTo(b.x - 36, b.y);
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.moveTo(b.x - 36, b.y);
    ctx.lineTo(b.x - 48, b.y - 7);
    ctx.lineTo(b.x - 48, b.y + 7);
    ctx.closePath();
    ctx.fill();
  }

  nodes.forEach((n, i) => {
    const g = gates[i];
    const col = i === 2 || i === 4
      ? (g > 0.65 ? "#6ecf8e" : g > 0.3 ? "#f0a030" : "#e07070")
      : "#4a90b8";
    ctx.fillStyle = "#1a1f28";
    ctx.beginPath();
    ctx.arc(n.x, n.y, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = "#e4e4e4";
    ctx.font = "11px system-ui";
    ctx.textAlign = "center";
    wrapCenter(ctx, n.lab, n.x, n.y - 4, 70, 13);
    if (i === 2 || i === 4) {
      const state = g > 0.65 ? T.gateOpen : g > 0.3 ? T.gatePartial : T.gateClosed;
      ctx.fillStyle = col;
      ctx.font = "10px system-ui";
      ctx.fillText(state, n.x, n.y + 48);
    }
  });
  ctx.textAlign = "left";

  for (const p of particles) {
    if (!p.alive) continue;
    const u = p.t;
    const seg = Math.min(3, Math.floor(u * 4));
    const local = u * 4 - seg;
    const a = nodes[seg], b = nodes[seg + 1];
    if (!a || !b) continue;
    const x = lerp(a.x, b.x, local);
    const y = a.y + Math.sin(local * Math.PI) * -8;
    const gate = gates[seg + 1];
    const blocked = gate < 0.3 && local > 0.55;
    ctx.fillStyle = blocked ? "#e07070" : "#7ec8e3";
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function updateParticles(dt, m) {
  if (Math.random() < 0.35 * (0.3 + m.pupilGate)) spawnParticle();
  for (const p of particles) {
    if (!p.alive) continue;
    let speed = p.speed;
    if (p.t > 0.35 && p.t < 0.55) speed *= Math.max(0.05, m.pupilGate);
    if (p.t > 0.78) speed *= Math.max(0.05, m.tmGate);
    if ((p.t > 0.4 && p.t < 0.52 && m.pupilGate < 0.25) || (p.t > 0.85 && m.tmGate < 0.2)) {
      speed *= 0.02;
    }
    p.t += dt * speed;
    if (p.t >= 1) {
      if (m.tmGate < 0.25) p.t = 0.88;
      else p.alive = false;
    }
  }
  for (let i = particles.length - 1; i >= 0; i--) if (!particles[i].alive) particles.splice(i, 1);
}

function postHeight() {
  try {
    const h = Math.ceil(document.documentElement.scrollHeight || document.body.scrollHeight || 0);
    if (h > 0 && window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "eyesinfo-shallow-ac-height", height: h }, "*");
    }
  } catch (_) { /* ignore */ }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.play) {
    updateDemo(dt);
    updateParticles(dt, metrics());
    refreshChrome();
  }
  const m = metrics();
  drawSagittal(m);
  drawFlow(m);
  requestAnimationFrame(frame);
}

["depth", "pupil", "lens", "vault", "plateau"].forEach((k) => {
  $(`sac-${k}`).addEventListener("input", (e) => {
    S[k] = +e.target.value;
    S.demo = false;
    refreshChrome();
  });
});
$("sac-play").addEventListener("click", () => { S.play = !S.play; refreshChrome(); });
$("sac-demo").addEventListener("click", () => {
  S.demo = true;
  S.play = true;
  S.demoT = S.step * 5;
  refreshChrome();
});
$("sac-reset").addEventListener("click", () => {
  S.mode = "open";
  S.depth = 25; S.pupil = 45; S.lens = 20; S.vault = 15; S.plateau = 10;
  S.step = 0; S.demoT = 0;
  S.demo = !reduceMotion;
  S.play = !reduceMotion;
  particles.length = 0;
  refreshChrome();
});

window.addEventListener("resize", postHeight);
applyLang(uiLang);
applyStepTargets(0, true);
refreshChrome();
requestAnimationFrame(frame);
setTimeout(postHeight, 50);
setTimeout(postHeight, 300);
})();
</script>
</body>
